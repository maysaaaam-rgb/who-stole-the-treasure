<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Anchor marks (offline)</title>
<style>body{margin:0;background:#0b1020;color:#fff;font:600 11px system-ui;padding:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:#eef;border-radius:10px;color:#223;padding:2px;text-align:center;position:relative}
.m{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #000;transform:translate(-50%,-50%);z-index:99}
.gridline{position:absolute;left:0;right:0;height:1px;background:rgba(0,0,0,.25);z-index:98}</style></head><body>
<div class="grid" id="g"></div>
<script src="js/monster-anchors.js"></script>
<script>
var q=new URLSearchParams(location.search);
var list=(q.get('m')||'aquafind_baby,florasprout_baby,astralight_baby').split(',');
var S=300;
document.getElementById('g').innerHTML=list.map(function(k){
  var a=MONSTER_ANCHORS[k];
  function dot(p,c){return '<div class="m" style="left:'+(p.x/1024*S)+'px;top:'+(p.y/1024*S)+'px;background:'+c+'"></div>';}
  var lines='';for(var y=100;y<1024;y+=100){lines+='<div class="gridline" style="top:'+(y/1024*S)+'px"></div>';}
  return '<div class="cell"><div style="position:relative;width:'+S+'px;height:'+S+'px;margin:0 auto"><img src="assets/monsters/art/'+k+'.webp" style="width:100%;height:100%">'+lines+
   dot(a.hatBase,'#f00')+dot(a.eyeCenter,'#0f0')+dot(a.neck,'#00f')+dot(a.chest,'#ff0')+dot(a.pawRight,'#0ff')+'</div><div>'+k+' eye y='+a.eyeCenter.y+' hat y='+a.hatBase.y+' neck y='+a.neck.y+'</div></div>';
}).join('');
</script></body></html>
