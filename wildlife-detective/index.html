<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Detective: TikTok vs. Nature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #060d0a;
      --bg-panel: rgba(16, 33, 24, 0.88);
      --panel-border: #1f4231;
      --primary-emerald: #10b981;
      --emerald-lip: #047857;
      --accent-amber: #f59e0b;
      --amber-lip: #b45309;
      --accent-cyan: #38bdf8;
      --danger-coral: #ef4444;
      --coral-lip: #b91c1c;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 10%, #0f2d1e 0%, var(--bg-void) 85%);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #game-arena {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 2px solid var(--panel-border);
      border-radius: 28px;
      width: 100%;
      max-width: 960px;
      min-height: 640px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    header {
      padding: 16px 24px;
      background: rgba(6, 13, 10, 0.6);
      border-bottom: 2px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .title-shield {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary-emerald);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .meter-container { flex: 1; max-width: 300px; display: flex; flex-direction: column; gap: 4px; }
    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }
    .meter-track {
      background: #0d1a13;
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
    }
    .meter-fill {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary-emerald));
      transition: width 0.4s ease;
    }
    .xp-counter {
      background: #11281c;
      border: 1px solid #235439;
      padding: 8px 18px;
      border-radius: 50px;
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      color: var(--accent-amber);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    main#stage {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .btn-3d {
      border: none;
      font-family: 'Fredoka', cursive;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 16px 32px;
      border-radius: 18px;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      min-height: 60px;
    }
    .btn-green { background: var(--primary-emerald); box-shadow: 0 6px 0 var(--emerald-lip); }
    .btn-green:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--emerald-lip); }
    .btn-green:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--emerald-lip); }
    .btn-coral { background: var(--danger-coral); box-shadow: 0 6px 0 var(--coral-lip); }
    .btn-coral:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--coral-lip); }
    .btn-coral:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-lip); }
    .btn-amber { background: var(--accent-amber); box-shadow: 0 6px 0 var(--amber-lip); color: #1a1303; }
    .btn-amber:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--amber-lip); }
    .btn-amber:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--amber-lip); }

    .stage-prompt { text-align: center; margin-bottom: 24px; max-width: 680px; }
    .stage-prompt h2 { font-family: 'Fredoka', cursive; font-size: 2rem; color: #fff; margin-bottom: 6px; }
    .stage-prompt p { font-size: 1.05rem; color: var(--text-muted); font-weight: 600; }
    .stage-prompt .pill-target {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary-emerald);
      color: #34d399;
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card-deck {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      width: 100%;
      perspective: 1200px;
    }
    .flip-card {
      height: 250px;
      cursor: pointer;
      border-radius: 20px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border: 2px solid var(--panel-border);
    }
    .card-front { background: linear-gradient(180deg, #163223 0%, #0d1e15 100%); }
    .card-front:hover { border-color: var(--primary-emerald); }
    .card-back {
      background: linear-gradient(180deg, #102a1b 0%, #08150d 100%);
      transform: rotateY(180deg);
      border-color: var(--accent-cyan);
      text-align: center;
      justify-content: center;
      gap: 12px;
    }

    .arena-showdown { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
    .trading-card {
      width: 320px;
      min-height: 380px;
      background: #0f241a;
      border: 3px solid var(--primary-emerald);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }
    .trading-card-img {
      height: 220px;
      background: #06130c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .trading-card-caption {
      padding: 18px;
      flex: 1;
      text-align: center;
      background: rgba(13, 26, 19, 0.95);
      border-top: 2px solid var(--panel-border);
    }
    .trading-card-caption h4 { font-family: 'Fredoka', cursive; font-size: 1.25rem; margin-bottom: 6px; }
    .trading-card-caption p { font-size: 0.95rem; color: #cbd5e1; }

    .rubber-stamp {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
      opacity: 0;
      font-family: 'Fredoka', cursive;
      font-size: 2.1rem;
      font-weight: 800;
      padding: 10px 22px;
      border: 6px solid currentColor;
      border-radius: 18px;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .stamp-do { color: #10b981; transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 1; }
    .stamp-dont { color: #ef4444; transform: translate(-50%, -50%) rotate(12deg) scale(1); opacity: 1; }
    .wobble { animation: softWobble 0.4s ease; }
    @keyframes softWobble {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .habitat-viewport {
      width: 100%;
      max-width: 650px;
      height: 220px;
      background: radial-gradient(circle at 50% 80%, #1e4620 0%, #06150c 80%);
      border: 3px solid var(--panel-border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .capy-rig { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .adaptation-tray {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 680px;
      margin-top: 16px;
    }
    .adapt-btn {
      background: rgba(15, 36, 26, 0.85);
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .adapt-btn:hover { border-color: var(--accent-cyan); transform: translateY(-3px); }
    .adapt-btn.unlocked {
      border-color: var(--primary-emerald);
      background: rgba(16, 185, 129, 0.2);
      pointer-events: none;
      opacity: 0.7;
    }

    .teleprompter-box {
      width: 100%;
      max-width: 720px;
      background: #08150f;
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
      text-align: center;
      margin-top: 14px;
    }
    .teleprompter-text { font-size: 1.25rem; line-height: 1.7; font-weight: 700; color: #cbd5e1; }
    .teleprompter-text .word { display: inline-block; padding: 2px 5px; border-radius: 6px; transition: all 0.15s ease; }
    .teleprompter-text .word.glow {
      background: var(--accent-amber);
      color: #1a1303;
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
    }
  </style>
</head>
<body>
<div id="game-arena">
  <header>
    <div class="title-shield">🐾 Wildlife Detective</div>
    <div class="meter-container">
      <div class="meter-label-row">
        <span>Wild Energy</span>
        <span id="meter-perc">25%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
    </div>
    <div class="xp-counter">
      <span>⭐</span>
      <span id="score-val">0</span>
      <span style="font-size:0.75rem; color:#fff;">XP</span>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playSnap() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1100, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.08);
  }
  playXP() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [987.77, 1318.51].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.2, now + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
    });
  }
  playSoftFail() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(246.94, now);
    osc.frequency.exponentialRampToValueAtTime(220.00, now + 0.25);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.25);
  }
  playFanfare() {
    this.init(); if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.35);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.12);
      osc.stop(this.ctx.currentTime + idx * 0.12 + 0.35);
    });
  }
  speak(text, onComplete) {
    if (!('speechSynthesis' in window)) { if (onComplete) onComplete(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.05; u.lang = "en-US";
    if (onComplete) u.onend = onComplete;
    window.speechSynthesis.speak(u);
  }
}

const audio = new SoundEngine();
const SVGS = {
  axolotl: `<svg viewBox="0 0 100 90" width="90" height="80"><ellipse cx="50" cy="50" rx="32" ry="24" fill="#f472b6"/><circle cx="40" cy="46" r="4" fill="#0f172a"/><circle cx="60" cy="46" r="4" fill="#0f172a"/><path d="M44 56 Q50 62 56 56" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22 40 Q10 32 18 24 Q24 35 24 44" fill="#db2777"/><path d="M78 40 Q90 32 82 24 Q76 35 76 44" fill="#db2777"/></svg>`,
  dragon: `<svg viewBox="0 0 100 90" width="90" height="80"><ellipse cx="50" cy="52" rx="30" ry="22" fill="#d97706"/><circle cx="40" cy="48" r="4" fill="#1c1917"/><circle cx="60" cy="48" r="4" fill="#1c1917"/><path d="M30 62 Q50 72 70 62" stroke="#78350f" stroke-width="4" fill="none"/></svg>`,
  snake: `<svg viewBox="0 0 100 90" width="90" height="80"><path d="M30 70 Q20 45 45 45 Q70 45 60 25 Q50 10 35 25" stroke="#15803d" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="34" cy="22" r="3" fill="#fff"/></svg>`,
  lamp: `<svg viewBox="0 0 100 100" width="110" height="110"><rect x="25" y="30" width="50" height="42" rx="16" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/><circle cx="42" cy="48" r="4" fill="#854d0e"/><circle cx="58" cy="48" r="4" fill="#854d0e"/><path d="M46 56 Q50 60 54 56" stroke="#854d0e" stroke-width="2" fill="none"/><rect x="35" y="72" width="30" height="8" rx="4" fill="#cbd5e1"/></svg>`,
  capy: `<svg viewBox="0 0 140 120" width="130" height="110"><ellipse cx="70" cy="70" rx="46" ry="34" fill="#92400e"/><ellipse cx="102" cy="52" rx="24" ry="20" fill="#a16207"/><circle cx="108" cy="46" r="3.5" fill="#1c1917"/><ellipse cx="94" cy="38" rx="5" ry="7" fill="#78350f"/><rect x="52" y="92" width="12" height="20" rx="6" fill="#78350f"/><rect x="80" y="92" width="12" height="20" rx="6" fill="#78350f"/></svg>`
};

const state = {
  score: 0,
  unlockedCards: new Set(),
  p2Index: 0,
  adaptationsUnlocked: new Set()
};

function addXP(pts) {
  state.score += pts;
  document.getElementById('score-val').innerText = state.score;
}

function updateProgress(perc) {
  document.getElementById('meter-fill').style.width = perc + "%";
  document.getElementById('meter-perc').innerText = perc + "%";
}

function renderPhase1() {
  updateProgress(25);
  const cards = [
    { id: "axolotl", name: "Axolotl", svg: SVGS.axolotl, tag: "Needs cold, clean water in Mexican lakes.", speech: "The axolotl is wild. It needs cold, clean water in Mexico!" },
    { id: "dragon", name: "Bearded Dragon", svg: SVGS.dragon, tag: "Needs hot desert sunshine.", speech: "The bearded dragon is wild. It needs hot desert sunshine!" },
    { id: "snake", name: "Ball Python", svg: SVGS.snake, tag: "Needs warm African grasslands.", speech: "The ball python is wild. It needs warm grasslands in Africa!" }
  ];

  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 1: The Care Card Scanner</h2>
      <p>Tap each wild animal to inspect its true biological requirements.</p>
      <div class="pill-target">Grammar: It needs [noun]</div>
    </div>
    <div class="card-deck">
      ${cards.map(c => `
        <div class="flip-card" id="card-${c.id}" onclick="flipCard('${c.id}', '${c.speech}')">
          <div class="card-face card-front">
            <div>${c.svg}</div>
            <h3>${c.name}</h3>
            <span style="font-size:0.8rem; color:var(--accent-cyan); font-weight:700;">👆 TAP TO SCAN</span>
          </div>
          <div class="card-face card-back">
            <span style="background:var(--accent-amber); color:#1a1303; padding:4px 10px; border-radius:12px; font-weight:800; font-size:0.75rem;">SCANNED ✔</span>
            <p style="font-weight:700; font-size:1.05rem; color:#fff;">${c.tag}</p>
            <span style="font-size:0.8rem; color:var(--primary-emerald); font-weight:800;">+10 XP EARNED</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function flipCard(id, speech) {
  audio.playSnap();
  const el = document.getElementById(`card-${id}`);
  if (!el.classList.contains('flipped')) {
    el.classList.add('flipped');
    audio.speak(speech);
    if (!state.unlockedCards.has(id)) {
      state.unlockedCards.add(id);
      addXP(10);
      audio.playXP();
    }
    if (state.unlockedCards.size === 3) {
      setTimeout(() => { audio.playFanfare(); renderPhase2(); }, 2200);
    }
  }
}

const P2_ROUNDS = [
  { title: "Viral Trend: Capybara in Bathtub", desc: "A TikTok creator keeps a 50kg capybara inside a tiny apartment bathroom.", svg: SVGS.capy, ruleSpeech: "Keep it wild! A capybara needs a wild wetland and a herd of friends!" },
  { title: "Viral Decor: Capybara Nightlight", desc: "A cute silicone desk lamp that taps on and off. No river or food needed!", svg: SVGS.lamp, ruleSpeech: "Great choice! Buy the toy nightlight and leave the real animal in nature!" }
];

function renderPhase2() {
  updateProgress(55);
  const round = P2_ROUNDS[state.p2Index];
  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 2: Screen vs. Reality Arena</h2>
      <p>Look at the TikTok feed. What is the Ranger-approved choice?</p>
      <div class="pill-target">Imperatives: Keep it wild! / Buy the toy!</div>
    </div>
    <div class="arena-showdown">
      <div class="trading-card" id="focus-card">
        <div class="trading-card-img">
          ${round.svg}
          <div id="stamp-slot" class="rubber-stamp"></div>
        </div>
        <div class="trading-card-caption">
          <h4>${round.title}</h4>
          <p>${round.desc}</p>
        </div>
      </div>
      <div style="display:flex; gap:16px;">
        <button class="btn-3d btn-green" onclick="evaluateChoice(true)">🌿 KEEP IT WILD / BUY TOY!</button>
        <button class="btn-3d btn-coral" onclick="evaluateChoice(false)">📦 ORDER LIVE BEDROOM PET</button>
      </div>
    </div>
  `;
}

function evaluateChoice(isEcoChoice) {
  const card = document.getElementById('focus-card');
  const stamp = document.getElementById('stamp-slot');
  if (isEcoChoice) {
    audio.playXP();
    stamp.className = "rubber-stamp stamp-do";
    stamp.innerText = "KEEP IT WILD!";
    audio.speak(P2_ROUNDS[state.p2Index].ruleSpeech);
    addXP(25);
    setTimeout(() => {
      state.p2Index++;
      if (state.p2Index < P2_ROUNDS.length) renderPhase2();
      else { audio.playFanfare(); renderPhase3(); }
    }, 2400);
  } else {
    audio.playSoftFail();
    stamp.className = "rubber-stamp stamp-dont";
    stamp.innerText = "DON'T BUY!";
    card.classList.add('wobble');
    audio.speak("Wait, detective! Wild animals cannot live in human bedrooms. Try again!");
    setTimeout(() => { card.classList.remove('wobble'); stamp.className = "rubber-stamp"; }, 1200);
  }
}

function renderPhase3() {
  updateProgress(80);
  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 3: Living Room Escape & Teleprompter</h2>
      <p>Unlock 3 biological adaptations to teleport the capybara to the Pantanal wetland!</p>
      <div class="pill-target">Target: It needs [wetland] / It cannot live in a bedroom</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
      <div class="habitat-viewport" id="viewport">
        <div class="capy-rig" id="capy-rig">${SVGS.capy}</div>
      </div>
      <div class="adaptation-tray" id="adapt-tray">
        <button class="adapt-btn" id="ad-snorkel" onclick="unlockAdaptation('snorkel')">
          <span style="font-size:1.8rem;">👀</span><b>Snorkel Face</b>
          <span style="font-size:0.75rem; color:#94a3b8;">Eyes & nose on top</span>
        </button>
        <button class="adapt-btn" id="ad-feet" onclick="unlockAdaptation('feet')">
          <span style="font-size:1.8rem;">🐾</span><b>Webbed Feet</b>
          <span style="font-size:0.75rem; color:#94a3b8;">Paddle flippers to swim</span>
        </button>
        <button class="adapt-btn" id="ad-herd" onclick="unlockAdaptation('herd')">
          <span style="font-size:1.8rem;">🌿</span><b>Herd Life</b>
          <span style="font-size:0.75rem; color:#94a3b8;">Needs 20+ companions</span>
        </button>
      </div>
      <div class="teleprompter-box" id="teleprompter" style="display:none;">
        <div class="teleprompter-text" id="tele-text">
          <span class="word">This</span> <span class="word">is</span> <span class="word">the</span> <span class="word">wild</span> <span class="word">capybara.</span>
          <span class="word">It</span> <span class="word">cannot</span> <span class="word">live</span> <span class="word">in</span> <span class="word">a</span> <span class="word">bedroom</span>
          <span class="word">because</span> <span class="word">it</span> <span class="word">needs</span> <span class="word">a</span> <span class="word">wetland</span> <span class="word">and</span> <span class="word">a</span> <span class="word">herd!</span>
          <span class="word">Keep</span> <span class="word">it</span> <span class="word">wild!</span>
        </div>
        <button class="btn-3d btn-amber" style="margin-top:16px;" onclick="broadcastTeleprompter()">📢 BROADCAST TO CLASSROOM</button>
      </div>
    </div>
  `;
}

function unlockAdaptation(type) {
  if (state.adaptationsUnlocked.has(type)) return;
  state.adaptationsUnlocked.add(type);
  audio.playSnap(); audio.playXP(); addXP(15);
  const btn = document.getElementById(`ad-${type}`);
  btn.classList.add('unlocked');
  btn.innerHTML += `<span style="color:var(--primary-emerald); font-weight:800;">ACTIVE ✔</span>`;

  if (type === 'snorkel') audio.speak("Snorkel face! Eyes and nostrils are high up to breathe while swimming!");
  if (type === 'feet') audio.speak("Webbed feet! Toes have skin flaps to paddle fast across rivers!");
  if (type === 'herd') audio.speak("Herd life! Capybaras get sick and lonely without a giant group!");

  if (state.adaptationsUnlocked.size === 3) {
    setTimeout(() => {
      audio.playFanfare();
      updateProgress(100);
      document.getElementById('capy-rig').style.transform = "scale(1.25) translateY(-8px)";
      document.getElementById('viewport').style.background = "radial-gradient(circle at 50% 60%, #065f46 0%, #022c22 85%)";
      document.getElementById('adapt-tray').style.display = 'none';
      document.getElementById('teleprompter').style.display = 'block';
      audio.speak("Teleport success! Capybara returned safely to the South American Pantanal. Ready for broadcast!");
    }, 1800);
  }
}

function broadcastTeleprompter() {
  const words = document.querySelectorAll('#tele-text .word');
  let idx = 0;
  audio.speak("This is the wild capybara. It cannot live in a bedroom because it needs a wetland and a herd! Keep it wild!", () => {
    words.forEach(w => w.classList.remove('glow'));
    audio.playFanfare();
    renderDiploma();
  });
  const interval = setInterval(() => {
    if (idx < words.length) {
      words.forEach(w => w.classList.remove('glow'));
      words[idx].classList.add('glow');
      idx++;
    } else {
      clearInterval(interval);
    }
  }, 310);
}

function renderDiploma() {
  document.getElementById('stage').innerHTML = `
    <div style="text-align:center; padding:20px; max-width:600px;">
      <div style="font-size:4.5rem; margin-bottom:12px;">🎖️</div>
      <h2 style="font-size:2.4rem; color:var(--primary-emerald); margin-bottom:8px; font-family:'Fredoka';">Junior Wildlife Ranger!</h2>
      <p style="font-size:1.15rem; color:#cbd5e1; margin-bottom:20px; font-weight:600;">
        Mission Accomplished! You protected wild species from social media fads and returned Capy to the wetland.
      </p>
      <div style="background:#0b1d14; border:2px dashed var(--panel-border); border-radius:20px; padding:20px; margin-bottom:24px;">
        <h4 style="color:var(--accent-amber); font-size:1.2rem; font-family:'Fredoka';">RANGER CODE:</h4>
        <p style="color:#fff; font-weight:700; margin-top:6px;">"Wild animals stay in nature. Buy the toy, keep the wild!"</p>
        <div style="margin-top:10px; font-size:1.2rem; font-weight:800; color:var(--accent-cyan);">Total Score: ${state.score} XP</div>
      </div>
      <button class="btn-3d btn-green" onclick="location.reload()">🔄 PLAY AGAIN</button>
    </div>
  `;
}

renderPhase1();
</script>
</body>
</html>
