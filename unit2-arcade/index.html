<style>

<body>
<div class="sky" id="sky"></div>

<div id="menu" class="screen on">
  <div class="menubox card">
    <div class="title" id="mtitle">Unit 2 Arcade!</div>
    <div class="sub" id="msub">Pick a game. Teams take turns. Everyone helps on mini whiteboards!</div>
    <div class="row"><span class="lab">Class</span><button class="chip sel" data-g="3">🔧 Grade 3 · Thank You</button><button class="chip" data-g="4">🌲 Grade 4 · What Lives Here?</button></div>
    <div class="row"><span class="lab">Teams</span><button class="chip" data-t="2">2</button><button class="chip" data-t="3">3</button><button class="chip sel" data-t="4">4</button><button class="chip" data-t="5">5</button><button class="chip" data-t="6">6</button></div>
    <div class="row"><span class="lab">Length</span><button class="chip" data-l="s">⏱️ Short · 1 level</button><button class="chip sel" data-l="n">⌛ Normal · 2 levels</button><button class="chip" data-l="l">🏋️ Long · 3 levels</button></div>
    <button class="gm cup" data-game="cup"><i>🏆</i><b>Champions Cup: all 4 games in a row</b><span>One running score, 4 games, 3 levels each if you choose Long. The big challenge for one or two lessons!</span></button>
    <div class="row"><span class="lab">Hangman</span><button class="chip sel" data-h="snow">⛄ Save the snowman</button><button class="chip" data-h="balloon">🎈 Save the balloons</button></div>
    <div class="games">
      <button class="gm" data-game="memory"><i>🃏</i><b>Memory Match</b><span>Find the picture and its word</span></button>
      <button class="gm" data-game="sentence"><i>🧩</i><b>Sentence Relay</b><span>Put the words in the right order</span></button>
      <button class="gm" data-game="letters"><i>⛄</i><b>Hangman</b><span>Guess the letters and save the snowman (or the balloons)!</span></button>
      <button class="gm" data-game="wheel"><i>🎡</i><b>Speaking Wheel</b><span>Spin and say a sentence</span></button>
    </div>
  </div>
</div>

<div id="play" class="screen">
  <div id="score"></div>
  <div id="banner"></div><div id="lvl"></div>
  <div id="stage"></div>
  <div id="msg"></div>
  <div id="foot"><button class="btn orange" id="again" hidden>🔊 Say it</button><button class="btn" id="check" hidden>✔ Check</button><button class="btn blue" id="undo" hidden>↩ Undo</button><button class="btn pink" id="next" hidden>Next team ▶</button><button class="btn grey" id="quit">✕ Back to games</button></div>
</div>

<div id="end" class="screen">
  <div class="title" style="font-size:clamp(28px,6.8vh,80px)" id="endT">🏆 Well done, everyone! 🏆</div>
  <div class="podium" id="podium"></div>
  <div class="row"><button class="btn" id="replay">↺ Play again</button><button class="btn blue" id="home">⌂ All games</button></div>
</div>

<div id="meme"><div id="memePic"></div><div id="memeCap"></div></div>
<div id="tools"><button class="btn purple" id="mus" title="Music">🎵</button><button class="btn blue" id="snd" title="Sound">🔊</button><button class="btn blue" id="full" title="Full screen">⛶</button></div>

<script src="data.js"></script>

$('next').onclick = function () {
  sfx('click'); if ('speechSynthesis' in window) speechSynthesis.cancel(); passTurn();
  if (cfg.game === 'sentence') { G.i++; if (G.i >= G.list.length) return levelDone(sentLevel); nextSentence(); }
  else if (cfg.game === 'letters') { G.i++; if (G.i >= G.list.length) return levelDone(hangLevel); hangWord(); }
  else if (cfg.game === 'wheel') { G.spins++; if (G.spins >= G.max) { G.spins = 0; return levelDone(readyWheel); } readyWheel(); }
};
(function () { var q = (location.search.match(/grade=([34])/) || [])[1]; if (q) { cfg.g = q; document.querySelectorAll('.chip[data-g]').forEach(function (x) { x.classList.toggle('sel', x.dataset.g === q); }); } })();
</script>
