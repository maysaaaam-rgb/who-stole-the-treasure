  for (i = 0; i < (n || 26); i++) { var d = document.createElement('div'); d.className = 'conf'; d.textContent = bits[i % bits.length]; d.style.left = Math.random() * 98 + 'vw'; d.style.fontSize = (2.6 + Math.random() * 3) + 'vh'; d.style.animationDuration = (1.4 + Math.random() * 1.3) + 's'; d.style.animationDelay = (Math.random() * .35) + 's'; document.body.appendChild(d); setTimeout((function (x) { return function () { x.remove(); }; })(d), 3200); }

function celebrate(emoji, text) { $('celea').textContent = emoji; $('celet').textContent = text; var c = $('cele'); c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); setTimeout(function () { c.classList.remove('on'); }, 1300); }

/* ---------- SETUP ---------- */
document.querySelectorAll('.chip').forEach(function (b) {
  b.onclick = function () { sfx('click'); var k = b.dataset.g ? 'g' : b.dataset.t ? 't' : 'm'; document.querySelectorAll('.chip[data-' + k + ']').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); cfg[k] = k === 'g' ? b.dataset.g : Number(b.dataset[k]); };
});
$('go').onclick = function () { audio(); sfx('click'); countdown(start); };
$('again').onclick = function () { countdown(start); }; $('home').onclick = function () { show('setup'); };
$('full').onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); };
$('snd').onclick = function () { soundOn = !soundOn; $('snd').textContent = soundOn ? '🔊' : '🔇'; if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); };
$('mus').onclick = function () { audio(); music(!musicOn); }; $('mus').style.opacity = .5;
function countdown(done) { var n = 3; $('count').classList.add('on'); (function step() { if (n === 0) { $('cnum').textContent = 'GO!'; sfx('go'); setTimeout(function () { $('count').classList.remove('on'); done(); }, 650); return; } var s = $('cnum'); s.textContent = n; s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; sfx('tick'); n--; setTimeout(step, 750); })(); }

function start() {
  var all = DATA[cfg.g].slice();
  if (cfg.m >= all.length) Q = shuffle(all);
  else { var by = {}; shuffle(all).forEach(function (q) { (by[q.s] = by[q.s] || []).push(q); }); var keys = Object.keys(by), out = [];
    while (out.length < cfg.m) { var added = false; keys.forEach(function (k) { if (out.length < cfg.m && by[k].length) { out.push(by[k].shift()); added = true; } }); if (!added) break; } Q = shuffle(out); }

}
function buildHill() {
  $('cols').innerHTML = TEAMS.slice(0, cfg.t).map(function (t, i) {
    return '<div class="col" id="col' + i + '"><div class="flag">🏆</div><div class="path"><span class="tok" id="tok' + i + '" style="bottom:4%">' + t.e + '</span></div><div class="pw" id="pw' + i + '"></div><div class="pt" id="pt' + i + '" style="color:' + t.c + '">0</div><div class="nm">' + t.n + '</div></div>'; }).join('');
}
function drawHill(hopIdx) {
  scores.forEach(function (p, i) {
    var tok = $('tok' + i); tok.style.bottom = Math.min(90, 4 + (p / maxPer) * 86) + '%'; $('pt' + i).textContent = p;
    $('col' + i).classList.toggle('turn', i === turn); $('pw' + i).textContent = (power[i] ? '⚡' : '') + (streak[i] >= 2 ? '🔥' : '');
    if (i === hopIdx) { tok.classList.remove('hop'); void tok.offsetWidth; tok.classList.add('hop'); }
  });
}

/* ---------- QUESTIONS ---------- */
function ask() {
  var q = Q[qi]; tries = 0; locked = false; built = []; dbl = false; $('msg').textContent = ''; $('next').hidden = true;
  $('qcount').textContent = (qi + 1) + ' / ' + Q.length; $('qtag').textContent = q.s;
  var b = $('bmon'); b.textContent = TEAMS[turn].e; b.className = 'big'; $('bwho').textContent = TEAMS[turn].n + ' team, it’s your turn!';
  $('qtext').textContent = q.q; $('qpic').textContent = q.pic || ''; $('qpass').textContent = q.pass || '';
  var qb = $('qbox'); qb.style.animation = 'none'; void qb.offsetWidth; qb.style.animation = '';
  $('say').hidden = !q.say; $('power').hidden = !power[turn]; $('power').textContent = '⚡ Double stars!'; $('power').classList.remove('pink'); drawHill();
  if (q.order) { $('opts').style.display = 'none'; $('orderArea').style.display = 'flex'; $('undo').hidden = false; $('check').hidden = false; renderOrder(); }
  else {
    $('orderArea').style.display = 'none'; $('undo').hidden = true; $('check').hidden = true;
    var o = $('opts'); o.style.display = 'grid'; o.innerHTML = '';
    shuffle(q.o).forEach(function (txt, i) { var bt = document.createElement('button'); bt.className = 'opt'; bt.innerHTML = '<span class="let">' + 'ABCD'[i] + '</span><span></span>'; bt.lastChild.textContent = txt; if (q.big) bt.lastChild.style.fontSize = 'clamp(44px,10vh,120px)'; bt.onclick = function () { choose(bt, txt); }; o.appendChild(bt); });
  }

}
function renderOrder() {
  var q = Q[qi]; if (!q._tiles) q._tiles = shuffle(q.order);
  $('tiles').innerHTML = ''; $('built').innerHTML = built.map(function (w) { return '<span class="tile">' + w.txt + '</span>'; }).join('');
  q._tiles.forEach(function (w, i) { var b = document.createElement('button'); b.className = 'tile' + (built.some(function (x) { return x.i === i; }) ? ' used' : ''); b.textContent = w; b.onclick = function () { if (locked) return; sfx('click'); built.push({i: i, txt: w}); renderOrder(); }; $('tiles').appendChild(b); });
}
$('undo').onclick = function () { if (!locked) { sfx('click'); built.pop(); renderOrder(); } };
$('check').onclick = function () { if (locked) return; var q = Q[qi]; if (built.map(function (b) { return b.txt; }).join(' ') === q.order.join(' ')) good(); else bad(q, 'Oops! Check the first word!'); };
$('power').onclick = function () { if (locked || !power[turn] || dbl) return; dbl = true; power[turn] = false; sfx('power'); $('power').textContent = '⚡ x2 is ON!'; $('power').classList.add('pink'); drawHill(); };
function choose(btn, txt) { if (locked) return; var q = Q[qi]; if (txt === q.a) { btn.classList.add('ok'); good(); } else { btn.classList.add('no'); btn.disabled = true; bad(q, 'Oops! Look again!'); } }
function good() {
  locked = true; var first = tries === 0, pts = first ? 10 : 5, extra = '';
  if (dbl) { pts *= 2; extra = ' ⚡x2'; }
  if (first) { streak[turn]++; if (streak[turn] === 3) { pts += 5; extra += ' 🔥 streak +5'; streak[turn] = 0; sfx('streak'); } } else streak[turn] = 0;
  scores[turn] += pts; sfx('correct'); confetti(first ? 34 : 16); celebrate(TEAMS[turn].e, '+' + pts + ' ⭐');
  if (Math.random() < 0.45) setTimeout(function () { speak(['Super!', 'Great job!', 'Well done!', 'Brilliant!'][Math.floor(Math.random() * 4)]); }, 500);
  $('bmon').className = 'big cheer';
  $('msg').style.color = '#15803d'; $('msg').textContent = ['Super! ','Great job! ','Brilliant! ','Yes! '][Math.floor(Math.random() * 4)] + '+' + pts + ' ⭐' + extra;
  if (Q[qi].order) $('tiles').innerHTML = '';
  document.querySelectorAll('.opt').forEach(function (b) { if (b.textContent.slice(1) === Q[qi].a) b.classList.add('ok'); });
  drawHill(turn);

}
function mysteryBox() {

  scores[turn] += pr.p; sfx('box'); confetti(40); drawHill(turn);
  $('popbig').textContent = '🎁'; $('poptext').textContent = 'Mystery box for ' + TEAMS[turn].e + ' ' + TEAMS[turn].n + '!  ' + pr.t; $('pop').classList.add('on'); finish();
}
function bad(q, hint) {

  if (tries >= 2) { locked = true; $('msg').style.color = '#c2410c'; $('msg').textContent = 'The answer is: ' + (q.order ? q.order.join(' ') : q.a); document.querySelectorAll('.opt').forEach(function (b) { if (b.textContent.slice(1) === q.a) b.classList.add('ok'); }); finish(); }
  else { $('msg').style.color = '#c2410c'; $('msg').textContent = hint + ' Try again! 💪 (5 stars)'; if (q.order) { built = []; renderOrder(); } }
  drawHill();
}
function finish() { $('next').hidden = false; $('next').textContent = qi + 1 >= Q.length ? '🏆 Finish!' : 'Next team ▶'; }
$('next').onclick = function () { sfx('click'); if (qi + 1 >= Q.length) return end(); qi++; turn = (turn + 1) % cfg.t; ask(); };
$('say').onclick = function () { speak(Q[qi].say); };
$('pick').onclick = function () { sfx('box'); var n = 1 + Math.floor(Math.random() * 6); $('popbig').textContent = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣'][n - 1]; $('poptext').textContent = TEAMS[turn].e + ' ' + TEAMS[turn].n + ' team: pupil number ' + n + ', come to the board!'; $('pop').classList.add('on'); };
$('popok').onclick = function () { sfx('click'); $('pop').classList.remove('on'); };

function end() {
  show('end'); sfx('win'); confetti(70); setTimeout(function () { confetti(50); }, 900);
  var order = scores.map(function (p, i) { return {i: i, p: p}; }).sort(function (a, b) { return b.p - a.p; }), medals = ['🥇','🥈','🥉'];
  $('podium').innerHTML = order.map(function (r, k) { var t = TEAMS[r.i]; return '<div class="p ' + (k === 0 ? 'first' : '') + '" style="background:' + t.c + ';font-size:' + (k === 0 ? '4.4vh' : '3.2vh') + ';animation-delay:' + (k * 0.12) + 's"><span class="em">' + t.e + '</span>' + (medals[k] || '⭐') + ' ' + t.n + '<div style="font-size:1.5em">' + r.p + '</div></div>'; }).join('');
  var keys = Object.keys(asked).sort(function (a, b) { return (missed[b] || 0) / asked[b] - (missed[a] || 0) / asked[a]; });

(function () { var q = (location.search.match(/grade=([34])/) || [])[1]; if (q) { document.querySelectorAll('.chip[data-g]').forEach(function (x) { x.classList.toggle('sel', x.dataset.g === q); }); cfg.g = q; } })();
