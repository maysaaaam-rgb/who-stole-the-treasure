<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice Tea Party: rehearsal lessons</title>
<style>
  :root { --void:#060911; --glass:rgba(15,23,42,.82); --line:rgba(148,163,184,.25); --text:#f8fafc; --muted:#cbd5e1; --cyan:#38bdf8; --cyan-d:#0369a1; --amber:#f59e0b; --amber-d:#b45309; --green:#10b981; --green-d:#047857; --violet:#a855f7; --violet-d:#6b21a8; --rose:#f43f5e; --spring:cubic-bezier(.175,.885,.32,1.275); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(circle at 50% 20%, #1b1440 0%, var(--void) 100%); color: var(--text); font-family: "Trebuchet MS","Segoe UI",system-ui,sans-serif; font-size: 20px; overflow-x: hidden; }
  .app { max-width: 1280px; margin: 0 auto; padding: 14px 18px 40px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-weight: 900; font-size: 1.4rem; } .brand small { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; font: inherit; font-weight: 800; color: #fff; cursor: pointer; border: 0; border-radius: 16px; background: var(--cyan-d); border-bottom: 5px solid #0c4a6e; transition: transform .12s var(--spring), border-bottom-width .12s; text-decoration: none; }
  .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
  .btn.green { background: var(--green); border-bottom-color: var(--green-d); } .btn.amber { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .btn.violet { background: var(--violet); border-bottom-color: var(--violet-d); } .btn.ghost { background: #334155; border-bottom-color: #1e293b; } .btn.on { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .btn.sm { min-height: 44px; padding: 6px 14px; font-size: .9rem; }
  .btn[disabled] { filter: grayscale(.8) brightness(.7); pointer-events: none; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .panel { background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,.4); margin-bottom: 14px; }
  h1, h2 { margin: 0 0 8px; } h2 { font-size: 1.5rem; } .muted { color: var(--muted); }
  details.plan { margin-bottom: 14px; } details.plan summary { cursor: pointer; font-weight: 800; color: var(--cyan); padding: 8px 2px; }
  details.plan ol { margin: 6px 0 0; padding-left: 24px; line-height: 1.6; } .plan li b { color: var(--amber); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; } @media (max-width: 800px) { .cards { grid-template-columns: 1fr; } }
  .pc { text-align: center; padding: 16px; border-radius: 20px; background: rgba(2,6,23,.55); border: 1px solid var(--line); }
  .pc .pic { font-size: 5rem; height: 120px; display: grid; place-items: center; } .pc .pic img { max-height: 120px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(0,0,0,.5)); animation: idleBob 2.6s ease-in-out infinite; }
  @keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .pc .say { font-size: 1.5rem; font-weight: 900; margin: 6px 0; } .pc .tip { color: var(--muted); font-size: .95rem; margin-bottom: 8px; }
  .teams { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .team { flex: 1; min-width: 150px; text-align: center; border-radius: 16px; padding: 10px; background: rgba(2,6,23,.55); border: 2px solid var(--line); }
  .team.now { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.25); } .team b { display: block; font-size: 1.1rem; } .team span { font-size: 2rem; font-weight: 900; color: var(--amber); }
  .q { font-size: 1.9rem; font-weight: 900; text-align: center; margin: 8px 0 16px; } .q small { display: block; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .choices { display: grid; gap: 12px; } .choices.c3 { grid-template-columns: repeat(3, 1fr); } @media (max-width: 800px) { .choices.c3 { grid-template-columns: 1fr; } }
  .choice { font-size: 1.35rem; min-height: 76px; background: #1e293b; border-bottom-color: #0f172a; }
  .choice.right { background: var(--green); border-bottom-color: var(--green-d); } .choice.try { animation: wob .4s; background: #475569; }
  @keyframes wob { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .choice img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; }
  .msg { text-align: center; min-height: 1.8em; font-weight: 800; font-size: 1.2rem; margin-top: 10px; } .msg.ok { color: var(--green); } .msg.no { color: var(--amber); }
  .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .pair { text-align: left; flex-direction: column; align-items: flex-start; gap: 2px; background: #1e293b; border-bottom-color: #0f172a; }
  .pair small { color: var(--muted); font-weight: 600; } .pair.done { border: 2px solid var(--green); }
  .tele { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
  .tl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: rgba(2,6,23,.55); border: 2px solid transparent; font-size: 1.5rem; font-weight: 800; opacity: .55; transition: opacity .2s, border-color .2s; }
  .tl.now { opacity: 1; border-color: var(--cyan); background: rgba(56,189,248,.14); transform: scale(1.01); } .tl.past { opacity: .8; }
  .tl .av { flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.12); display: grid; place-items: center; font-size: 1.7rem; } .tl .av img { width: 100%; height: 100%; object-fit: cover; }
  .tl .w { font-size: .78rem; color: var(--amber); display: block; letter-spacing: .04em; } .tl .hide { filter: blur(9px); user-select: none; }
  .timer { font-size: 3rem; font-weight: 900; text-align: center; color: var(--amber); } .timer.low { color: var(--rose); }
  .chk { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
  .stars { text-align: center; font-size: 2.6rem; letter-spacing: .2em; margin: 6px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .now-big { text-align: center; padding: 18px; } .now-big .names { font-size: 2.4rem; font-weight: 900; } .now-big .roles { color: var(--muted); font-size: 1.2rem; }
  .props { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 10px 0; } .props .pp { width: 120px; text-align: center; font-size: .85rem; } .props img { height: 84px; object-fit: contain; }
  .podium { display: flex; gap: 12px; justify-content: center; align-items: flex-end; margin: 18px 0; } .podium div { text-align: center; padding: 12px 18px; border-radius: 16px; background: rgba(245,158,11,.18); border: 2px solid var(--amber); font-weight: 900; }
  .link-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .hero { display: block; width: 100%; max-height: 210px; object-fit: cover; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .ti { height: 1.5em; width: auto; vertical-align: -0.35em; }
  .plan7 { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin-bottom: 4px; } .plan7 .btn { flex: none; flex-direction: column; gap: 0; min-height: 56px; padding: 6px 12px; font-size: .9rem; } .plan7 small { font-weight: 600; opacity: .8; font-size: .72rem; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🫖 Alice’s Tea Party · Rehearsal<small>4 lessons for the week before the party</small></div>
    <div id="clsbtns" style="display:flex;gap:8px"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="week"></div>
  <div id="stage"></div>
</div>
<script src="../alice-party-home/party-data.js?v=3"></script>
<script src="../js/voice.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
