<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ Baamboozle Arena: Young Inventors | English Adventure Academy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Outfit:wght@800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --arcade-yellow: #facc15;
      --arcade-yellow-deep: #eab308;
      --arcade-blue: #1d4ed8;
      --arcade-blue-light: #3b82f6;
      --arcade-blue-dark: #1e3a8a;
      --arcade-red: #ef4444;
      --arcade-green: #10b981;
      --card-shadow: 0 10px 0 #1e3a8a, 0 16px 20px rgba(0,0,0,0.3);
      --card-shadow-active: 0 4px 0 #1e3a8a, 0 8px 12px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 10%, #fef08a 0%, #facc15 55%, #eab308 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Navigation Bar */
    .arena-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.5rem;
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .arena-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      font-size: 2rem;
      animation: pulse-icon 1.8s infinite ease-in-out;
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(6deg); }
    }
    .brand-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #facc15;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .brand-text p {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 700;
    }
    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .nav-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 2px solid #334155;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      background: #334155;
      border-color: #facc15;
      color: #facc15;
      transform: translateY(-2px);
    }

    /* Scoreboard Header */
    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 2rem;
      padding: 1.2rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .team-box {
      flex: 1;
      background: #ffffff;
      border-radius: 20px;
      padding: 1rem 1.5rem;
      text-align: center;
      border: 4px solid #cbd5e1;
      box-shadow: 0 8px 0 #94a3b8, 0 12px 18px rgba(0,0,0,0.15);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .team-box.team-1 { border-color: #3b82f6; box-shadow: 0 8px 0 #1d4ed8, 0 12px 18px rgba(29, 78, 216, 0.2); }
    .team-box.team-2 { border-color: #ef4444; box-shadow: 0 8px 0 #b91c1c, 0 12px 18px rgba(239, 68, 68, 0.2); }
    .team-box.active-turn {
      transform: translateY(-4px) scale(1.04);
      border-width: 5px;
      box-shadow: 0 12px 0 #0f172a, 0 18px 25px rgba(0,0,0,0.25);
    }
    .team-box.team-1.active-turn { border-color: #2563eb; }
    .team-box.team-2.active-turn { border-color: #dc2626; }
    .turn-pill {
      display: none;
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #facc15;
      padding: 2px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .team-box.active-turn .turn-pill { display: block; }
    .team-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .team-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      margin-top: 4px;
      color: #0f172a;
    }

    /* 16 Interactive Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      padding: 1.5rem;
      max-width: 1050px;
      margin: auto;
      flex: 1;
      width: 100%;
    }
    .arcade-card {
      aspect-ratio: 4/3;
      background: linear-gradient(145deg, var(--arcade-blue-light), var(--arcade-blue));
      border: 4px solid #ffffff;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: all 0.15s ease;
      position: relative;
    }
    .arcade-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 0 #1e3a8a, 0 20px 24px rgba(0,0,0,0.35);
      background: linear-gradient(145deg, #60a5fa, var(--arcade-blue-light));
    }
    .arcade-card:active {
      transform: translateY(6px);
      box-shadow: var(--card-shadow-active);
    }
    .arcade-card.opened {
      background: rgba(30, 41, 59, 0.4);
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      transform: none;
      pointer-events: none;
    }
    .card-pts-pill {
      position: absolute;
      top: 8px;
      right: 10px;
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #facc15;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #ffffff;
      border-radius: 28px;
      padding: 2.2rem 2rem;
      max-width: 580px;
      width: 100%;
      text-align: center;
      border: 6px solid #0f172a;
      box-shadow: 0 20px 0 #0f172a, 0 30px 40px rgba(0,0,0,0.4);
      animation: pop-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-mascot {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .modal-tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
    }
    .tag-riddle { background: #dbeafe; color: #1e40af; border: 2px solid #3b82f6; }
    .tag-twister { background: #fef3c7; color: #92400e; border: 2px solid #f59e0b; }
    .tag-unscramble { background: #e0e7ff; color: #3730a3; border: 2px solid #6366f1; }
    .tag-power { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }

    .modal-timer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 900;
      color: #ef4444;
      background: #fee2e2;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 1rem;
      border: 2px solid #f87171;
    }
    .modal-question {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.35;
      color: #0f172a;
      margin: 0.8rem 0 1.2rem;
    }
    .modal-answer-box {
      background: #f1f5f9;
      border: 3px dashed #3b82f6;
      border-radius: 16px;
      padding: 1rem;
      margin: 1rem 0;
      font-size: 1.4rem;
      font-weight: 900;
      color: #1e40af;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .action-btn {
      padding: 0.85rem 1.6rem;
      border: 3px solid #0f172a;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #0f172a;
      transition: all 0.1s ease;
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #0f172a; }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }
    .btn-check { background: #facc15; color: #0f172a; }
    .btn-pass { background: #10b981; color: #ffffff; }
    .btn-fail { background: #ef4444; color: #ffffff; }
    .btn-power-act { background: #f59e0b; color: #ffffff; font-size: 1.2rem; padding: 1rem 2rem; }

    @media (max-width: 768px) {
      .grid-container { grid-template-columns: repeat(2, 1fr); gap: 0.85rem; padding: 1rem; }
      .scoreboard { gap: 1rem; padding: 0.75rem 1rem; }
      .team-box { padding: 0.6rem 1rem; }
      .team-score { font-size: 1.8rem; }
      .modal-question { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="arena-nav">
    <div class="arena-brand">
      <span class="brand-icon">⚡</span>
      <div class="brand-text">
        <h1>BAAMBOOZLE ARENA</h1>
        <p>YOUNG INVENTORS EDITION • 16 MYSTERY CARDS</p>
      </div>
    </div>
    <div class="nav-actions">
      <button type="button" class="nav-btn" id="btnSoundToggle" onclick="toggleSound()">
        🔊 Sound: ON
      </button>
      <button type="button" class="nav-btn" onclick="resetGame()">
        🔄 Reset Game
      </button>
      <a href="../young-inventor/index.html" class="nav-btn">
        🧑‍🔬 Inventor Lab
      </a>
      <a href="../index.html#library" class="nav-btn">
        📚 Library
      </a>
    </div>
  </nav>

  <!-- Scoreboard Header -->
  <header class="scoreboard">
    <div class="team-box team-1 active-turn" id="team1Box">
      <span class="turn-pill">YOUR TURN</span>
      <div class="team-name" style="color:#1d4ed8;">🚀 Team 1</div>
      <div class="team-score" id="team1Score">0</div>
    </div>
    <div class="team-box team-2" id="team2Box">
      <span class="turn-pill">YOUR TURN</span>
      <div class="team-name" style="color:#b91c1c;">⚡ Team 2</div>
      <div class="team-score" id="team2Score">0</div>
    </div>
  </header>

  <!-- 16 Interactive Cards Grid -->
  <main class="grid-container" id="cardsGrid"></main>

  <!-- Pop-up Modal -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal-content" id="modalBody"></div>
  </div>

  <!-- Sound Engine -->
  <script src="../js/sound-engine.js"></script>
  <script>
    if (!window.academyAudio) {
      window.academyAudio = {
        playChord: function() {},
        playCoin: function() {},
        playWhoosh: function() {},
        playSoftFail: function() {},
        playFanfare: function() {},
        playTimerTick: function() {},
        playTimerAlarm: function() {}
      };
    }

    // 16 Complete Baamboozle Cards (Tongue Twisters, Unscrambles, CLIL Riddles, Mystery Powers)
    const CARDS = [
      {
        id: 1,
        type: "unscramble",
        pts: 20,
        mascot: "🧩",
        timerSec: 20,
        title: "Word Unscramble",
        q: "Unscramble the letters to find the person who creates new things:<br><strong style='color:#4338ca; font-size:2rem; letter-spacing:3px;'>N - E - T - O - R - V - I - N</strong>",
        a: "INVENTOR!"
      },
      {
        id: 2,
        type: "power",
        action: "swap",
        pts: 0,
        mascot: "💥",
        title: "BAMBOOZLE SWAP!",
        q: "🔄 POINT SWAP! Swap your entire score with the opposing team right now!"
      },
      {
        id: 3,
        type: "twister",
        pts: 15,
        mascot: "👅",
        timerSec: 12,
        title: "Tongue Twister Sprint",
        q: "Say this sentence 3 times fast without making a mistake:<br><strong style='color:#b45309; font-size:1.5rem;'>\"Red lorry, yellow lorry!\"</strong>",
        a: "Great pronunciation!"
      },
      {
        id: 4,
        type: "power",
        action: "steal",
        pts: 20,
        mascot: "🦹",
        title: "STEAL 20 PTS!",
        q: "🦹 ROBBER TIME! Steal 20 points from the opposing team!"
      },
      {
        id: 5,
        type: "riddle",
        pts: 15,
        mascot: "✈️",
        timerSec: 15,
        title: "CLIL Science Riddle",
        q: "I have two wings and a powerful engine, but I am not a bird or insect. What invention am I?",
        a: "An Airplane (Aeroplane)!"
      },
      {
        id: 6,
        type: "power",
        action: "double",
        pts: 30,
        mascot: "⚡",
        title: "DOUBLE VAULT!",
        q: "🎉 JACKPOT! Your team unlocks the secret double vault for +30 Bonus Points!"
      },
      {
        id: 7,
        type: "unscramble",
        pts: 20,
        mascot: "📐",
        timerSec: 20,
        title: "Blueprint Scramble",
        q: "Unscramble the drawing engineers make before building:<br><strong style='color:#4338ca; font-size:2rem; letter-spacing:3px;'>B - U - E - P - L - I - N - R - T</strong>",
        a: "BLUEPRINT!"
      },
      {
        id: 8,
        type: "power",
        action: "bankrupt",
        pts: 0,
        mascot: "💣",
        title: "💥 BANKRUPT!",
        q: "😱 OH NO! A glitch in the system wiped out your team's vault! Points reset to 0!"
      },
      {
        id: 9,
        type: "twister",
        pts: 20,
        mascot: "🌊",
        timerSec: 15,
        title: "Seashore Twister",
        q: "Recite this tongue twister cleanly:<br><strong style='color:#b45309; font-size:1.5rem;'>\"She sells seashells by the seashore!\"</strong>",
        a: "Awesome tongue dexterity!"
      },
      {
        id: 10,
        type: "riddle",
        pts: 15,
        mascot: "⏰",
        timerSec: 15,
        title: "Morning Invention Riddle",
        q: "People invented me to wake up on time without sleeping all day. What am I?",
        a: "An Alarm Clock!"
      },
      {
        id: 11,
        type: "power",
        action: "swap",
        pts: 0,
        mascot: "🌀",
        title: "CHAOS SWAP!",
        q: "🌀 TORNADO SWAP! The tables turn! Exchange scores with the other team!"
      },
      {
        id: 12,
        type: "unscramble",
        pts: 15,
        mascot: "☁️",
        timerSec: 20,
        title: "Aviation Scramble",
        q: "Unscramble this word that flies through the sky:<br><strong style='color:#4338ca; font-size:2rem; letter-spacing:3px;'>A - I - R - P - L - A - N - E</strong>",
        a: "AIRPLANE!"
      },
      {
        id: 13,
        type: "power",
        action: "steal",
        pts: 20,
        mascot: "🧲",
        title: "MAGNETIC STEAL 20!",
        q: "🧲 MAGNET BEAM! Pull 20 points from the other team into your bank!"
      },
      {
        id: 14,
        type: "riddle",
        pts: 20,
        mascot: "🌀",
        timerSec: 15,
        title: "Wind Kinetic Riddle",
        q: "I have 4 colorful curved blades and spin when the wind blows. What invention am I?",
        a: "A Pinwheel!"
      },
      {
        id: 15,
        type: "twister",
        pts: 25,
        mascot: "🦢",
        timerSec: 15,
        title: "Master Tongue Twister",
        q: "Challenge: Say 3 times fast:<br><strong style='color:#b45309; font-size:1.45rem;'>\"Six sleek swans swam swiftly southwards!\"</strong>",
        a: "Master speaker certified!"
      },
      {
        id: 16,
        type: "power",
        action: "double",
        pts: 40,
        mascot: "🏆",
        title: "MEGA VAULT +40!",
        q: "🌟 SUPERNOVA! Clean sweep bonus awarded: +40 Points for your team!"
      }
    ];

    let currentTurn = 0; // 0 = Team 1, 1 = Team 2
    let scores = [0, 0];
    let activeCard = null;
    let openedCount = 0;
    let timerInterval = null;
    let timerRemaining = 0;
    let soundEnabled = true;

    const grid = document.getElementById("cardsGrid");
    const modal = document.getElementById("quizModal");
    const modalBody = document.getElementById("modalBody");

    function renderGrid() {
      grid.innerHTML = "";
      openedCount = 0;
      CARDS.forEach((card, idx) => {
        const box = document.createElement("div");
        box.className = "arcade-card";
        box.innerHTML = `
          <span class="card-pts-pill">${card.pts > 0 ? card.pts + ' pts' : '⚡'}</span>
          <span>${idx + 1}</span>
        `;
        box.onclick = () => openCard(card, box);
        grid.appendChild(box);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (window.academyAudio) {
        window.academyAudio.enabled = soundEnabled;
      }
      document.getElementById("btnSoundToggle").innerText = soundEnabled ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    }

    function openCard(card, boxElement) {
      activeCard = card;
      boxElement.classList.add("opened");
      openedCount++;
      modal.style.display = "flex";

      if (card.type === "power") {
        window.academyAudio.playWhoosh();
        modalBody.innerHTML = `
          <div class="modal-mascot">${card.mascot}</div>
          <div><span class="modal-tag tag-power">MYSTERY POWER CARD</span></div>
          <h2 class="modal-question" style="color:#b91c1c;">${card.title}</h2>
          <p style="font-size:1.25rem; font-weight:700; color:#334155; margin-bottom:1.5rem;">${card.q}</p>
          <div class="btn-row">
            <button class="action-btn btn-power-act" onclick="resolvePowerUp()">⚡ ACTIVATE POWER!</button>
          </div>
        `;
      } else {
        window.academyAudio.playCoin();
        let tagClass = "tag-riddle";
        let tagLabel = "CLIL RIDDLE";
        if (card.type === "twister") { tagClass = "tag-twister"; tagLabel = "TONGUE TWISTER"; }
        if (card.type === "unscramble") { tagClass = "tag-unscramble"; tagLabel = "UNSCRAMBLE"; }

        timerRemaining = card.timerSec || 15;
        modalBody.innerHTML = `
          <div class="modal-mascot">${card.mascot}</div>
          <div><span class="modal-tag ${tagClass}">${tagLabel} • ${card.pts} PTS</span></div>
          <div class="modal-timer" id="timerBadge">⏱️ <span id="timerText">${timerRemaining}s</span></div>
          <div class="modal-question">${card.q}</div>
          <div class="modal-answer-box" id="revealedAns" style="display:none;">
            ${card.a}
          </div>
          <div class="btn-row" id="checkBtnRow">
            <button class="action-btn btn-check" onclick="revealAnswer()">🔍 Check Answer</button>
          </div>
          <div class="btn-row" id="evalBtnRow" style="display:none;">
            <button class="action-btn btn-pass" onclick="awardPoints(true)">✔ Okay! (+${card.pts})</button>
            <button class="action-btn btn-fail" onclick="awardPoints(false)">✖ Oops!</button>
          </div>
        `;

        startTimer();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      const timerText = document.getElementById("timerText");
      timerInterval = setInterval(() => {
        timerRemaining--;
        if (timerText) timerText.innerText = `${timerRemaining}s`;
        window.academyAudio.playTimerTick();

        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          window.academyAudio.playTimerAlarm();
          if (timerText) timerText.innerText = "0s (TIME UP!)";
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function revealAnswer() {
      stopTimer();
      document.getElementById("revealedAns").style.display = "block";
      document.getElementById("checkBtnRow").style.display = "none";
      document.getElementById("evalBtnRow").style.display = "flex";
    }

    function awardPoints(success) {
      stopTimer();
      if (success) {
        window.academyAudio.playCoin();
        scores[currentTurn] += activeCard.pts;
      } else {
        window.academyAudio.playSoftFail();
      }
      closeModal();
    }

    function resolvePowerUp() {
      if (activeCard.action === "swap") {
        const temp = scores[0];
        scores[0] = scores[1];
        scores[1] = temp;
      } else if (activeCard.action === "steal") {
        const other = 1 - currentTurn;
        const stolen = Math.min(scores[other], 20);
        scores[other] -= stolen;
        scores[currentTurn] += stolen;
      } else if (activeCard.action === "double") {
        scores[currentTurn] += activeCard.pts;
      } else if (activeCard.action === "bankrupt") {
        scores[currentTurn] = 0;
      }
      closeModal();
    }

    function closeModal() {
      stopTimer();
      modal.style.display = "none";
      updateScoreboard();

      if (openedCount >= CARDS.length) {
        setTimeout(showGameOver, 400);
        return;
      }

      // Switch turn
      currentTurn = 1 - currentTurn;
      document.getElementById("team1Box").classList.toggle("active-turn", currentTurn === 0);
      document.getElementById("team2Box").classList.toggle("active-turn", currentTurn === 1);
    }

    function showGameOver() {
      window.academyAudio.playFanfare();
      let winnerText = "🤝 IT'S A TIE!";
      let winnerDesc = `Both teams finished with ${scores[0]} points! Fantastic game!`;
      let winnerIcon = "🏆";

      if (scores[0] > scores[1]) {
        winnerText = "🚀 TEAM 1 WINS!";
        winnerDesc = `Team 1 victorious with ${scores[0]} points over Team 2's ${scores[1]} points!`;
        winnerIcon = "🚀";
      } else if (scores[1] > scores[0]) {
        winnerText = "⚡ TEAM 2 WINS!";
        winnerDesc = `Team 2 victorious with ${scores[1]} points over Team 1's ${scores[0]} points!`;
        winnerIcon = "⚡";
      }

      modalBody.innerHTML = `
        <div class="modal-mascot">${winnerIcon}</div>
        <div><span class="modal-tag tag-twister">MATCH COMPLETE</span></div>
        <h2 class="modal-question" style="font-size:2.4rem; color:#0f172a;">${winnerText}</h2>
        <p style="font-size:1.15rem; font-weight:700; color:#475569; margin-bottom:1.5rem;">${winnerDesc}</p>
        <div style="display:flex; justify-content:center; gap:1.5rem; margin-bottom:1.5rem;">
          <div style="background:#dbeafe; padding:1rem 1.8rem; border-radius:16px; border:3px solid #2563eb;">
            <div style="font-weight:900; color:#1d4ed8;">🚀 Team 1</div>
            <div style="font-size:2.2rem; font-weight:900; font-family:'JetBrains Mono',monospace;">${scores[0]}</div>
          </div>
          <div style="background:#fee2e2; padding:1rem 1.8rem; border-radius:16px; border:3px solid #dc2626;">
            <div style="font-weight:900; color:#b91c1c;">⚡ Team 2</div>
            <div style="font-size:2.2rem; font-weight:900; font-family:'JetBrains Mono',monospace;">${scores[1]}</div>
          </div>
        </div>
        <div class="btn-row">
          <button class="action-btn btn-check" onclick="resetGame()">🔄 Play Rematch</button>
          <a href="../young-inventor/index.html" class="action-btn btn-pass" style="text-decoration:none;">🧑‍🔬 Inventor Lab</a>
        </div>
      `;
      modal.style.display = "flex";
    }

    function resetGame() {
      stopTimer();
      scores = [0, 0];
      currentTurn = 0;
      updateScoreboard();
      document.getElementById("team1Box").classList.add("active-turn");
      document.getElementById("team2Box").classList.remove("active-turn");
      modal.style.display = "none";
      renderGrid();
    }

    function updateScoreboard() {
      document.getElementById("team1Score").innerText = scores[0];
      document.getElementById("team2Score").innerText = scores[1];
    }

    renderGrid();
  </script>
</body>
</html>
