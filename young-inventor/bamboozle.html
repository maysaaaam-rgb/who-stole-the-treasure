<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ Baamboozle Arena: Young Inventors | English Adventure Academy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --green: #10b981;
      --rose: #f43f5e;
      --purple: #a855f7;
      --indigo: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, var(--bg) 70%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      user-select: none;
    }

    /* Top Navigation & Controls */
    .arena-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
    }
    .arena-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .arena-badge {
      font-size: 1.8rem;
      animation: pulse-glow 2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.8)); }
    }
    .arena-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .arena-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .control-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .control-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Scoreboard Header */
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.2rem 1.5rem;
      background: rgba(17, 24, 39, 0.6);
      border-bottom: 2px solid rgba(51, 65, 85, 0.5);
    }
    .team-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1rem 2rem;
      text-align: center;
      border: 3px solid transparent;
      min-width: 180px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .team-card.team-red {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(244, 63, 94, 0.15));
    }
    .team-card.team-blue {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(56, 189, 248, 0.15));
    }
    .team-card.active-turn {
      border-color: var(--amber);
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.45);
    }
    .team-label {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .team-turn-badge {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--amber);
      color: #0f172a;
      display: none;
      margin-top: 4px;
    }
    .team-card.active-turn .team-turn-badge {
      display: inline-block;
    }
    .team-score {
      font-size: 2.4rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      color: var(--amber);
      margin-top: 4px;
    }

    /* Number Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 1050px;
      margin: auto;
      flex: 1;
      width: 100%;
    }
    .bamboozle-box {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid #475569;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--cyan);
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .bamboozle-box:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--cyan);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.3);
    }
    .bamboozle-box:active {
      transform: scale(0.97);
    }
    .bamboozle-box.opened {
      opacity: 0.25;
      pointer-events: none;
      border-color: #334155;
      background: #0f172a;
      transform: none;
      box-shadow: none;
    }
    .box-corner-pts {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Modal Question & Power-up Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #1e293b;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      border: 2px solid var(--cyan);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.25);
      animation: modal-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modal-pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 4rem;
      margin-bottom: 0.75rem;
      display: inline-block;
    }
    .modal-category-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .badge-question {
      background: rgba(56, 189, 248, 0.2);
      color: var(--cyan);
      border: 1px solid var(--cyan);
    }
    .badge-power {
      background: rgba(245, 158, 11, 0.2);
      color: var(--amber);
      border: 1px solid var(--amber);
    }
    .question-stem {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.4;
      margin: 1.2rem 0;
      color: #ffffff;
    }
    .revealed-box {
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed var(--amber);
      border-radius: 14px;
      padding: 1.2rem;
      margin: 1.2rem 0;
      color: var(--amber);
      font-size: 1.4rem;
      font-weight: 800;
    }
    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.8rem;
    }
    .action-btn {
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn-pass { background: var(--green); color: #022c22; }
    .btn-fail { background: var(--rose); color: #ffffff; }
    .btn-power { background: var(--amber); color: #451a03; }
    .btn-listen { background: #334155; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }

    /* Victory Celebration Modal */
    .victory-modal-content {
      border-color: var(--amber);
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.4);
    }

    @media (max-width: 768px) {
      .grid-container { grid-template-columns: repeat(2, 1fr); gap: 0.85rem; padding: 1rem; }
      .scoreboard { gap: 1rem; padding: 0.75rem 1rem; }
      .team-card { min-width: 130px; padding: 0.6rem 1rem; }
      .team-score { font-size: 1.8rem; }
      .question-stem { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls -->
  <nav class="arena-top-nav">
    <div class="arena-title-wrap">
      <span class="arena-badge">⚡</span>
      <div>
        <div class="arena-title">BAAMBOOZLE ARENA</div>
        <div class="arena-sub">YOUNG INVENTORS SHOWDOWN • WHOLE CLASS TOURNAMENT</div>
      </div>
    </div>
    <div class="top-controls">
      <button type="button" class="control-btn" id="btn-sound-toggle" onclick="toggleSound()" title="Mute/Unmute Audio">
        🔊 Sound: ON
      </button>
      <button type="button" class="control-btn" onclick="resetGame()" title="Reset Scores & Grid">
        🔄 New Game
      </button>
      <a href="../young-inventor/index.html" class="control-btn" title="Back to Young Inventor Academy">
        🧑‍🔬 Inventor Lab
      </a>
      <a href="../index.html#library" class="control-btn" title="Back to Academy Library">
        📚 Library
      </a>
    </div>
  </nav>

  <!-- Team Scoreboard -->
  <header class="scoreboard">
    <div class="team-card team-red active-turn" id="team-0-card">
      <div class="team-label">🚀 Red Team</div>
      <div class="team-turn-badge">ACTIVE TURN</div>
      <div class="team-score" id="team-0-score">0</div>
    </div>
    <div class="team-card team-blue" id="team-1-card">
      <div class="team-label">⚡ Blue Team</div>
      <div class="team-turn-badge">ACTIVE TURN</div>
      <div class="team-score" id="team-1-score">0</div>
    </div>
  </header>

  <!-- Number Mystery Grid -->
  <main class="grid-container" id="cards-grid"></main>

  <!-- Modal Dialog for Questions / Mystery Power-ups -->
  <div class="modal-overlay" id="quiz-modal">
    <div class="modal-content" id="modal-body"></div>
  </div>

  <!-- Sound System -->
  <script src="../js/sound-engine.js"></script>
  <script>
    if (!window.academyAudio) {
      window.academyAudio = {
        playCoin: function() {},
        playWhoosh: function() {},
        playSoftFail: function() {},
        playFanfare: function() {}
      };
    }

    const CARDS = [
      { id: 1, type: "q", pts: 15, icon: "✈️", q: "Why did people invent airplanes?", a: "To fly quickly!" },
      { id: 2, type: "power", action: "swap", icon: "💥", title: "💥 BAMBOOZLE!", text: "Swap points with the other team!" },
      { id: 3, type: "q", pts: 20, icon: "📐", q: "What part helps a paper airplane fly straight?", a: "The wings and the tail!" },
      { id: 4, type: "power", action: "steal", icon: "🦹", title: "🦹 STEAL 15 PTS!", text: "Take 15 points from the opposing team!" },
      { id: 5, type: "q", pts: 10, icon: "⏰", q: "Complete: People invented alarm clocks to _____ on time.", a: "wake up" },
      { id: 6, type: "q", pts: 25, icon: "🌀", q: "Name 3 parts of a pinwheel!", a: "Blades, center pin, and stick!" },
      { id: 7, type: "power", action: "double", icon: "🎉", title: "🎉 LUCKY BONUS!", text: "Free +30 points for your team!" },
      { id: 8, type: "q", pts: 15, icon: "🔥", q: "Which tool melts ice?", a: "A thermal heat ray!" }
    ];

    let currentTurn = 0; // 0 = Red, 1 = Blue
    let scores = [0, 0];
    let activeCard = null;
    let openedCount = 0;
    let soundEnabled = true;

    const grid = document.getElementById("cards-grid");
    const modal = document.getElementById("quiz-modal");
    const modalBody = document.getElementById("modal-body");

    function renderGrid() {
      grid.innerHTML = "";
      openedCount = 0;
      CARDS.forEach((card, idx) => {
        const box = document.createElement("div");
        box.className = "bamboozle-box";
        box.innerHTML = `
          <span class="box-corner-pts">?</span>
          <span>${idx + 1}</span>
        `;
        box.onclick = () => openCard(card, box);
        grid.appendChild(box);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (window.academyAudio) {
        window.academyAudio.enabled = soundEnabled;
      }
      const btn = document.getElementById("btn-sound-toggle");
      btn.innerText = soundEnabled ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    }

    function speakQuestion(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.88;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }

    function openCard(card, boxElement) {
      activeCard = card;
      boxElement.classList.add("opened");
      openedCount++;
      modal.style.display = "flex";

      if (card.type === "power") {
        window.academyAudio.playWhoosh();
        modalBody.innerHTML = `
          <div class="modal-icon">${card.icon}</div>
          <div class="modal-category-badge badge-power">MYSTERY POWER-UP</div>
          <h2 style="color:var(--amber); font-size:2.2rem; margin:0 0 1rem;">${card.title}</h2>
          <p class="question-stem">${card.text}</p>
          <div class="btn-row">
            <button class="action-btn btn-power" onclick="resolvePowerUp()">⚡ ACTIVATE POWER-UP!</button>
          </div>
        `;
      } else {
        window.academyAudio.playCoin();
        modalBody.innerHTML = `
          <div class="modal-icon">${card.icon}</div>
          <div class="modal-category-badge badge-question">QUESTION • ${card.pts} PTS</div>
          <p class="question-stem">${card.q}</p>
          <div class="revealed-box" id="revealed-ans" style="display:none;">
            ${card.a}
          </div>
          <div class="btn-row" id="initial-btn-row">
            <button class="action-btn btn-listen" onclick="speakQuestion('${card.q.replace(/'/g, "\\'")}')">🗣️ Listen</button>
            <button class="action-btn btn-power" id="btn-show-ans" onclick="revealAnswer()">Check Answer</button>
          </div>
          <div class="btn-row" id="verdict-row" style="display:none;">
            <button class="action-btn btn-pass" onclick="awardPoints(true)">✅ Correct (+${card.pts})</button>
            <button class="action-btn btn-fail" onclick="awardPoints(false)">❌ Wrong</button>
          </div>
        `;
      }
    }

    function revealAnswer() {
      document.getElementById("revealed-ans").style.display = "block";
      document.getElementById("initial-btn-row").style.display = "none";
      document.getElementById("verdict-row").style.display = "flex";
    }

    function awardPoints(success) {
      if (success) {
        window.academyAudio.playCoin();
        scores[currentTurn] += activeCard.pts;
      } else {
        window.academyAudio.playSoftFail();
      }
      closeModal();
    }

    function resolvePowerUp() {
      if (activeCard.action === "swap") {
        const temp = scores[0];
        scores[0] = scores[1];
        scores[1] = temp;
      } else if (activeCard.action === "steal") {
        const other = 1 - currentTurn;
        const stolen = Math.min(scores[other], 15);
        scores[other] -= stolen;
        scores[currentTurn] += stolen;
      } else if (activeCard.action === "double") {
        scores[currentTurn] += 30;
      }
      closeModal();
    }

    function closeModal() {
      modal.style.display = "none";
      updateScoreboard();

      if (openedCount >= CARDS.length) {
        setTimeout(showGameOver, 400);
        return;
      }

      // Switch team turn
      currentTurn = 1 - currentTurn;
      document.getElementById("team-0-card").classList.toggle("active-turn", currentTurn === 0);
      document.getElementById("team-1-card").classList.toggle("active-turn", currentTurn === 1);
    }

    function showGameOver() {
      window.academyAudio.playFanfare();
      let winnerMsg = "🤝 It's a Tie!";
      let winnerSub = `Both teams scored ${scores[0]} points! Excellent teamwork!`;
      let winnerIcon = "🏆";

      if (scores[0] > scores[1]) {
        winnerMsg = "🚀 Red Team Wins!";
        winnerSub = `Red Team wins with ${scores[0]} points to ${scores[1]} points!`;
        winnerIcon = "🚀";
      } else if (scores[1] > scores[0]) {
        winnerMsg = "⚡ Blue Team Wins!";
        winnerSub = `Blue Team wins with ${scores[1]} points to ${scores[0]} points!`;
        winnerIcon = "⚡";
      }

      modalBody.innerHTML = `
        <div class="modal-icon">${winnerIcon}</div>
        <div class="modal-category-badge badge-power">TOURNAMENT COMPLETE</div>
        <h2 style="color:var(--amber); font-size:2.4rem; margin:0 0 0.5rem;">${winnerMsg}</h2>
        <p style="color:#e2e8f0; font-size:1.2rem; margin-bottom:1.5rem;">${winnerSub}</p>
        <div style="display:flex; justify-content:center; gap:2rem; margin-bottom:2rem;">
          <div style="background:#0f172a; padding:1rem 2rem; border-radius:12px; border:2px solid var(--rose);">
            <div>🚀 Red Team</div>
            <div style="font-size:2rem; font-weight:900; color:var(--rose); font-family:'JetBrains Mono',monospace;">${scores[0]}</div>
          </div>
          <div style="background:#0f172a; padding:1rem 2rem; border-radius:12px; border:2px solid var(--cyan);">
            <div>⚡ Blue Team</div>
            <div style="font-size:2rem; font-weight:900; color:var(--cyan); font-family:'JetBrains Mono',monospace;">${scores[1]}</div>
          </div>
        </div>
        <div class="btn-row">
          <button class="action-btn btn-power" onclick="resetGame()">🔄 Play Rematch</button>
          <a href="../young-inventor/index.html" class="action-btn btn-pass" style="text-decoration:none;">🧑‍🔬 Inventor Lab</a>
        </div>
      `;
      modal.style.display = "flex";
    }

    function resetGame() {
      scores = [0, 0];
      currentTurn = 0;
      updateScoreboard();
      document.getElementById("team-0-card").classList.add("active-turn");
      document.getElementById("team-1-card").classList.remove("active-turn");
      modal.style.display = "none";
      renderGrid();
    }

    function updateScoreboard() {
      document.getElementById("team-0-score").innerText = scores[0];
      document.getElementById("team-1-score").innerText = scores[1];
    }

    renderGrid();
  </script>
</body>
</html>
