<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚀 Young Inventor Academy — Problem → Idea → Prototype → Expo | Grade 4 A1+</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🚀</text></svg>">
  <link rel="stylesheet" href="css/young-inventor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Fredoka:wght@600;700;800;900&family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fullscreen Shell -->
  <div id="young-inventor-wrapper">

    <!-- Top Persistent HUD -->
    <header id="yi-hud">
      <div class="hud-group-left">
        <button type="button" class="hud-btn primary" onclick="window.youngInventorApp.renderHome()" title="Go to Academy Lab Home">
          🚀 <span>Inventor Lab</span>
        </button>

        <button type="button" class="hud-btn" id="btn-nav-prev" onclick="window.youngInventorApp.prevMission()" title="Previous Step (Left Arrow)">
          ⬅️ <span>Prev</span>
        </button>

        <button type="button" class="hud-btn" id="btn-nav-next" onclick="window.youngInventorApp.nextMission()" title="Next Step (Right Arrow)">
          <span>Next</span> ➡️
        </button>

        <div class="hud-pill hud-mission-pill" id="hud-mission-indicator">
          Mission 1 of 10
        </div>

        <button type="button" class="hud-btn" onclick="window.youngInventorApp.renderMissionMap()" title="View All 10 Missions">
          🗺️ <span>Map</span>
        </button>

        <a href="worksheet.html" target="_blank" class="hud-btn" title="Open 4-Page Printable Dossier &amp; Certificate">
          🖨️ <span>Print Dossier</span>
        </a>

        <a href="../index.html#library" class="hud-btn" title="Return to Educational Library" style="background:#e0f2fe; border-color:#38bdf8; color:#0369a1; text-decoration:none;">
          📚 <span>Library</span>
        </a>
      </div>

      <div class="hud-group-right">
        <!-- XP Pill -->
        <div class="hud-pill hud-xp-pill" id="hud-xp-pill">
          <span id="hud-xp-display">⭐ 0 / 100 XP</span>
        </div>

        <!-- Audio Controls -->
        <button type="button" class="hud-btn" id="btn-toggle-voice" onclick="toggleYiVoice()" title="Toggle Voice Narration">
          🔊 <span>Voice</span>
        </button>
        <button type="button" class="hud-btn" id="btn-toggle-sfx" onclick="toggleYiSfx()" title="Toggle SFX">
          🔔 <span>SFX</span>
        </button>

        <!-- Hidden Teacher Drawer (Key T) -->
        <button type="button" class="hud-btn teacher" onclick="window.youngInventorApp.openTeacherDrawer()" title="Teacher Pedagogical Guide (Press T)">
          🧑‍🏫 <span>Teacher (T)</span>
        </button>
      </div>
    </header>

    <!-- Main Viewport for Missions -->
    <main id="young-inventor-stage-content">
      <!-- Injected dynamically by YoungInventorScenes & App -->
    </main>

    <!-- Floating Feedback Toast -->
    <div id="yi-toast" class="yi-toast"></div>

    <!-- Teacher Guide Modal / Observation Panel -->
    <div id="young-inventor-teacher-modal" class="teacher-modal-overlay" style="display:none;" onclick="if(event.target===this) window.youngInventorApp.closeTeacherDrawer();">
      <div class="teacher-modal-box" id="teacher-modal-body">
        <!-- Injected dynamically by scenes.renderTeacherModal -->
      </div>
    </div>

    <!-- Audience Detective Review Card Modal -->
    <div id="audience-card-modal" class="teacher-modal-overlay" style="display:none;" onclick="if(event.target===this) window.youngInventorApp.closeAudienceCardModal();">
      <div class="teacher-modal-box" style="border-color:#38bdf8; max-width:650px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #38bdf8; padding-bottom:8px;">
          <h3 style="font-size:1.3rem; color:#38bdf8; font-weight:900; margin:0;">
            🔎 INVENTOR DETECTIVE AUDIENCE CARD
          </h3>
          <button type="button" class="hud-btn" onclick="window.youngInventorApp.closeAudienceCardModal()">✕</button>
        </div>
        <p style="font-size:0.9rem; color:#cbd5e1; margin-bottom:14px;">
          Audience classmates: Fill in your detective review for the presenting inventor!
        </p>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div>
            <label style="font-size:0.85rem; font-weight:800; color:#fef08a;">1. Inventor's Name:</label>
            <input type="text" placeholder="e.g. Maya" style="background:#1e293b; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; padding:10px; width:100%; margin-top:4px;" />
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:800; color:#fef08a;">2. Invention Name:</label>
            <input type="text" placeholder="e.g. Super Bag 3000" style="background:#1e293b; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; padding:10px; width:100%; margin-top:4px;" />
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:800; color:#fef08a;">3. Problem it solves:</label>
            <input type="text" placeholder="e.g. Heavy books" style="background:#1e293b; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; padding:10px; width:100%; margin-top:4px;" />
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:800; color:#fef08a;">4. One cool thing it can do:</label>
            <input type="text" placeholder="e.g. It can fly over puddles!" style="background:#1e293b; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; padding:10px; width:100%; margin-top:4px;" />
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:800; color:#fef08a;">5. My question for the inventor:</label>
            <input type="text" placeholder="e.g. How does it charge the battery?" style="background:#1e293b; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; padding:10px; width:100%; margin-top:4px;" />
          </div>
          <button type="button" class="hud-btn primary" style="justify-content:center; margin-top:10px;" onclick="window.youngInventorApp.closeAudienceCardModal(); window.youngInventorApp.showToast('Detective Card saved! Great feedback! ⭐');">
            ✓ Submit Detective Review
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/young-inventor-audio.js"></script>
  <script src="js/young-inventor-data.js"></script>
  <script src="js/young-inventor-scenes.js"></script>
  <script src="js/young-inventor-app.js"></script>

  <script>
    function toggleYiVoice() {
      if (!window.youngInventorAudio) return;
      const enabled = window.youngInventorAudio.toggleSpeech();
      const btn = document.getElementById('btn-toggle-voice');
      if (btn) btn.innerHTML = enabled ? '🔊 <span>Voice</span>' : '🔇 <span>Muted</span>';
    }
    function toggleYiSfx() {
      if (!window.youngInventorAudio) return;
      const enabled = window.youngInventorAudio.toggleSfx();
      const btn = document.getElementById('btn-toggle-sfx');
      if (btn) btn.innerHTML = enabled ? '🔔 <span>SFX</span>' : '🔕 <span>Quiet</span>';
    }
  </script>

</body>
</html>
