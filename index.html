<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Adventure Academy | Modern Digital ESL School Platform</title>
  <meta name="description" content="Complete modern digital ESL school platform for young English learners. Featuring Teacher Dashboard, Class & Student Management, CEFR Progress Tracking, Attendance, Curriculum, 15 Interactive Games, Assignments, Gamification, and Parent Communication.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232563eb%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M22 10v6M2 10l10-5 10 5-10 5z%22/><path d=%22M6 12v5c3 3 9 3 12 0v-5%22/></svg>">

  <!-- School Platform Unified Stylesheet -->
  <link rel="stylesheet" href="css/school-platform.css">
</head>
<body>

  <!-- ========================================================================
       1. GLOBAL TOP HEADER & ROLE SWITCHER
       ======================================================================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo-btn" onclick="switchView('dashboard')" title="English Adventure Academy">
          <div class="brand-icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <span>Adventure Academy</span>
        </div>

        <!-- Role Switcher (Teacher · Student · Parent) -->
        <nav class="role-pill-group" aria-label="Role Switcher">
          <button class="role-pill-btn is-active" data-role="teacher" title="Switch to Teacher Dashboard">
            <span>👩‍🏫</span> <span>Teacher</span>
          </button>
          <button class="role-pill-btn" data-role="student" title="Switch to Student Learning Adventure">
            <span>🧒</span> <span>Student (Emma)</span>
          </button>
          <button class="role-pill-btn" data-role="parent" title="Switch to Parent Portal">
            <span>👨‍👩‍👧</span> <span>Parent</span>
          </button>
        </nav>
      </div>

      <!-- Right Controls -->
      <div class="header-right">
        <!-- Class Selector (Teacher mode) -->
        <select id="header-class-select" class="class-switcher-select" title="Active Class">
          <option value="class-3a">Grade 3A — The Explorers</option>
          <option value="class-4b">Grade 4B — The Adventurers</option>
        </select>

        <button class="icon-circle-btn" onclick="const s = document.getElementById('search-input') || document.getElementById('lib-search-input'); if (s) s.focus();" title="Search shortcut (Press /)" aria-label="Search shortcut">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </button>

        <div class="user-chip" id="header-user-chip">
          <div class="avatar-initials">SJ</div>
          <span>Ms. Sarah</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       2. MAIN APPLICATION LAYOUT (SIDEBAR + DYNAMIC VIEW)
       ======================================================================== -->
  <div class="app-layout">
    <!-- Dynamic Role Sidebar -->
    <aside class="app-sidebar" id="app-sidebar-nav" aria-label="Platform Navigation">
      <!-- Injected dynamically by school-app.js -->
    </aside>

    <!-- Dynamic Sub-view Container -->
    <main class="app-main" id="app-view-container">
      <!-- Injected dynamically by school-app.js -->
    </main>
  </div>

  <!-- ========================================================================
       3. REUSABLE MODALS & DIALOGS
       ======================================================================== -->
  <!-- Student Profile Drilldown Modal -->
  <div class="modal-overlay" id="modal-student-profile">
    <!-- Populated by window.openStudentDetail() -->
  </div>

  <!-- Add Student Modal -->
  <div class="modal-overlay" id="modal-add-student">
    <div class="modal-dialog" style="max-width: 480px;">
      <button class="modal-close-btn" onclick="closeAllModals()">✕</button>
      <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:16px;">Add New Student</h2>
      <form onsubmit="handleCreateStudent(event)" style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">First Name</label>
          <input type="text" id="new-stud-fname" class="filter-select" style="width:100%;" required placeholder="e.g. Leo" />
        </div>
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Last Name</label>
          <input type="text" id="new-stud-lname" class="filter-select" style="width:100%;" required placeholder="e.g. Dupont" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Age</label>
            <input type="number" id="new-stud-age" class="filter-select" style="width:100%;" value="8" min="5" max="14" />
          </div>
          <div>
            <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">CEFR Level</label>
            <select id="new-stud-cefr" class="filter-select" style="width:100%;">
              <option value="Pre-A1">Pre-A1</option>
              <option value="A1" selected>A1</option>
              <option value="A1+">A1+</option>
              <option value="A2">A2</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary-action" style="margin-top:10px; justify-content:center;">Save &amp; Enroll Student</button>
      </form>
    </div>
  </div>

  <!-- Create Assignment Modal -->
  <div class="modal-overlay" id="modal-create-assignment">
    <div class="modal-dialog" style="max-width: 520px;">
      <button class="modal-close-btn" onclick="closeAllModals()">✕</button>
      <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:16px;">Create New Assignment</h2>
      <form onsubmit="handleCreateAssignment(event)" style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Assignment Title</label>
          <input type="text" id="new-asg-title" class="filter-select" style="width:100%;" required placeholder="e.g. Restaurant Polite Ordering" />
        </div>
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Select Game or Activity</label>
          <select id="new-asg-game" class="filter-select" style="width:100%;">
            <option value="restaurant">At the Restaurant (Roleplay)</option>
            <option value="monster-day">Build Your Own Monster (Creature Builder)</option>
            <option value="firefighter">Fire Station Adventure (Interactive Story)</option>
            <option value="neighbourhood">My Neighbourhood (Prepositions)</option>
            <option value="advice">The Crazy Advice Academy (Should/Shouldn't)</option>
            <option value="predictions">What Will Happen Next? (Predictions)</option>
            <option value="city-mouse">The City Mouse &amp; Country Mouse (Story)</option>
            <option value="pokemon">Pokémon Trainer Battle (Action Verbs)</option>
            <option value="jungle">Life in the Jungle (Animal Habitats)</option>
            <option value="treasure">Treasure Mystery (Past Continuous)</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Due Date</label>
          <input type="text" id="new-asg-date" class="filter-select" style="width:100%;" value="Sep 15, 2026" />
        </div>
        <button type="submit" class="btn-primary-action" style="margin-top:10px; justify-content:center;">Publish Assignment</button>
      </form>
    </div>
  </div>

  <!-- Create Class Modal -->
  <div class="modal-overlay" id="modal-add-class">
    <div class="modal-dialog" style="max-width: 460px;">
      <button class="modal-close-btn" onclick="closeAllModals()">✕</button>
      <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:16px;">Create New Class</h2>
      <form onsubmit="event.preventDefault(); const name = document.getElementById('new-cls-name').value; if(name){ window.schoolStore.addClass({name, grade:'Grade 3', cefr:'A1', room:'Room 206', schedule:'Mon, Wed 10:00'}); closeAllModals(); switchView('classes'); }" style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:4px;">Class Name</label>
          <input type="text" id="new-cls-name" class="filter-select" style="width:100%;" required placeholder="e.g. Grade 3C — The Navigators" />
        </div>
        <button type="submit" class="btn-primary-action" style="margin-top:8px; justify-content:center;">Create Class</button>
      </form>
    </div>
  </div>

  <!-- Avatar Customizer Modal (Student Mode) -->
  <div class="modal-overlay" id="modal-avatar-customizer">
    <div class="modal-dialog" style="max-width: 480px; text-align:center;">
      <button class="modal-close-btn" onclick="closeAllModals()">✕</button>
      <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:6px;">🎨 Customize Your Avatar</h2>
      <p style="font-size:0.84rem; color:var(--text-muted); margin-bottom:20px;">Choose your hairstyle, explorer outfit, and lucky badge!</p>

      <div style="font-size:64px; margin-bottom:20px;" id="avatar-preview-box">👧</div>

      <div style="display:flex; flex-direction:column; gap:12px; text-align:left;">
        <div>
          <label style="font-size:0.8rem; font-weight:700;">Hairstyle</label>
          <select id="avatar-hair-select" class="filter-select" style="width:100%;" onchange="document.getElementById('avatar-preview-box').innerText = this.value === 'boy' ? '👦' : this.value === 'star' ? '🦸' : '👧';">
            <option value="girl" selected>Pigtails &amp; Ribbon</option>
            <option value="boy">Spiky Explorer</option>
            <option value="star">Superhero Cape</option>
          </select>
        </div>
        <button class="btn-primary-action" style="justify-content:center; margin-top:8px;" onclick="closeAllModals(); alert('✓ Avatar updated! Keep exploring to unlock more outfits.');">Save My Avatar</button>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       4. SCRIPTS & ARCHITECTURE (GAMES REGISTRY -> STORE -> APP)
       ======================================================================== -->
  <!-- 1. Central 15-game Registry -->
  <script src="js/games-data.js"></script>

  <!-- 2. School Platform Store (Single Source of Truth) -->
  <script src="js/school-store.js"></script>

  <!-- 3. Application Controller & Router -->
  <script src="js/school-app.js"></script>

</body>
</html>
