<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Instructions Challenge · Smartboard Action Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="sb-shell">
    <header class="sb-topbar">
      <div class="sb-brand">
        <div class="sb-brand-badge"><img src="art/cmd_open_book.webp" alt="📢" onerror="this.outerHTML='📢'"></div>
        <div class="sb-title-wrap">
          <h1>📢 Classroom Instructions Challenge</h1>
          <p>Watch, Listen &amp; Do It Now! Normal Speed ➔ Turbo Round ➔ Double Combos ➔ Student Leader!</p>
        </div>
      </div>
      <div class="sb-teams" id="sb-teams"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" class="btn-3d" id="sb-mute-btn" onclick="InstructionsApp.toggleMute()">🔊 Sound</button>
        <a href="worksheet.html" target="_blank" class="btn-3d amber">🖨️ Worksheet</a>
        <a href="../index.html" class="btn-3d cyan">🏠 Platform</a>
      </div>
    </header>

    <nav class="sb-phase-tabs">
      <button type="button" class="sb-phase-tab active" onclick="InstructionsApp.setPhase(1)">1️⃣ Stage 1 · Action Radar (8 Commands)</button>
      <button type="button" class="sb-phase-tab" onclick="InstructionsApp.setPhase(2)">⚡ Stage 2 · Turbo Speed Round</button>
      <button type="button" class="sb-phase-tab" onclick="InstructionsApp.setPhase(3)">🔗 Stage 3 · Double Combo Challenge</button>
      <button type="button" class="sb-phase-tab" onclick="InstructionsApp.setPhase(4)">👑 Stage 4 · Student Leader Console</button>
    </nav>

    <main class="sb-stage" id="sb-stage"></main>
  </div>
  <div class="sb-toast" id="sb-toast" style="opacity:0"></div>

  <script src="js/data.js?v=2"></script>
  <script src="js/audio.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
