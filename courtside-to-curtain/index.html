<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5cb8ff">
  <title>Courtside to Curtain Call 3D · The Full 3-Zone Festival Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261126-3d2">
</head>
<body>
  <!-- FULL-SCREEN 3D SUNNY ADVENTURE PARK: COURT -> FESTIVAL PARK -> GRAND THEATRE -->
  <canvas id="scene"></canvas>

  <!-- FLOATING 3D WORLD PINS (projected cleanly from 3D anchors) -->
  <div class="world-pins" id="world-pins" aria-hidden="true"></div>

  <!-- ULTRA-CLEAN CINEMA HUD (90%+ Pure Full-Bleed 3D World) -->
  <div class="hud" id="hud">
    <!-- Minimal Floating Top Bar -->
    <header class="top-bar">
      <div class="top-left-nav">
        <button type="button" class="pill-btn sky" id="btn-map" title="3D World Map (M)">🗺️ Map</button>
        <div class="stage-pills" id="stage-pills" role="tablist" aria-label="Adventure Stages"></div>
      </div>

      <div class="round-chip" id="round-chip" aria-live="polite">3D Adventure Park · Choose Your Zone</div>

      <div class="top-right-nav">
        <button type="button" class="pill-btn yellow" id="btn-slow" title="Slow Studio Voice (0.78x)">🐢 Slow</button>
        <button type="button" class="pill-btn round" id="btn-bgm" title="Toggle Music">🎵</button>
        <button type="button" class="pill-btn round" id="btn-sfx" title="Mute / Unmute All Audio">🔊</button>
        <a class="pill-btn round" href="worksheet.html" target="_blank" title="Printable Worksheet">🖨️</a>
        <button type="button" class="pill-btn round" id="btn-fs" title="Fullscreen Smartboard">⛶</button>
        <a class="pill-btn round" href="../index.html#home" title="Back to Academy" onclick="try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'eaa:closeOverlay'},'*');return false;}}catch(e){}">✕</a>
      </div>
    </header>

    <!-- MAP MODE FLOATING HERO (Bottom-center so 3D Park Map stays 100% clear!) -->
    <section class="map-hero" id="map-hero">
      <div class="map-badge">GRADE 4 · UNIT 4 · 3-ZONE 3D ADVENTURE</div>
      <h1 class="map-title">Courtside to Curtain Call</h1>
      <div class="map-cta-row">
        <button type="button" class="launch-btn coral" id="btn-enter-z1">🏀 Zone 1: Court</button>
        <button type="button" class="launch-btn green" id="btn-enter-z2">🚂 Zone 2: Park</button>
        <button type="button" class="launch-btn primary" id="btn-enter-z3">🎭 Zone 3: Theatre</button>
      </div>
    </section>

    <!-- TOP-LEFT FLOATING BRAND-NEW PIXAR PICTURE CUE CARD -->
    <aside class="cue-card hidden" id="cue-card">
      <div class="cue-img-wrap">
        <img id="cue-img" src="assets/art/card_basket.webp" alt="Target card">
        <button type="button" class="cue-voice-btn" id="btn-cue-voice" title="Hear Studio Voice">🔊</button>
      </div>
      <div class="cue-word" id="cue-word">B A S _ E T</div>
      <div class="cue-hint" id="cue-hint">🗣️ Say a full sentence!</div>
    </aside>

    <!-- STAGE 5 BROKEN-TRACK SENTENCE STRIP (Compact floating wooden track slots above bottom dock) -->
    <div class="track-strip hidden" id="track-strip"></div>

    <!-- BIG CINEMATIC POPUP BANNER -->
    <div class="cinema-toast" id="cinema-toast" aria-live="polite"></div>

    <!-- ZONE COMPLETE / GRAND FINALE OVERLAY (Over live 3D fireworks & bowing monsters) -->
    <div class="victory-banner hidden" id="victory-banner">
      <div class="victory-crown" id="victory-crown">🏆</div>
      <h2 class="victory-title" id="victory-title">Grand Curtain Call!</h2>
      <p class="victory-sub" id="victory-sub">Bravo! Standing ovation for the whole class!</p>
      <div class="victory-scores" id="victory-scores"></div>
      <div class="victory-actions" id="victory-actions"></div>
    </div>

    <!-- BOTTOM SAFE-ZONE DOCK (Strictly inside bottom 16% — zero obstruction of 3D stage!) -->
    <footer class="bottom-dock hidden" id="bottom-dock">
      <div class="team-strip" id="team-strip"></div>
      <div class="choice-tray" id="choice-tray"></div>
      <button type="button" class="launch-btn shoot" id="btn-launch" disabled title="Student speaks a full sentence aloud, then press Space or tap!">
        <span class="launch-icon" id="launch-icon">🏀</span>
        <span class="launch-txt" id="launch-txt">PICK A CHOICE</span>
      </button>
    </footer>
  </div>

  <!-- 100% Offline Three.js 0.169 + Commercial GameQualityCore -->
  <script src="../games/engine3d/vendor/engine3d-deps.min.js?v=20261121d"></script>
  <script src="../games/engine3d/SceneAtmosphere.js?v=20261123hd"></script>
  <script src="../games/engine3d/JuiceManager.js?v=20261122n"></script>

  <!-- Courtside to Curtain Call 3D Scripts -->
  <script src="js/data.js?v=20261126-3d2"></script>
  <script src="js/audio.js?v=20261126-3d2"></script>
  <script src="js/app.js?v=20261126-3d2"></script>
  <script src="../games/kit3d/pupil-picker.js?v=20261127a"></script>
</body>
</html>
