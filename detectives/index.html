<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🕵️ THE MYSTERY OF YESTERDAY: A Past Simple Detective Adventure | Grade 3–4 English Lesson</title>
  <link rel="stylesheet" href="css/detectives.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fullscreen Responsive Shell -->
  <div id="detectives-screen-wrapper">
    <div id="detectives-stage">

      <!-- Top Persistent HUD -->
      <header id="detectives-hud">
        <div class="hud-left">
          <button type="button" class="hud-btn primary" onclick="window.detectivesApp.renderStage(1)" title="Go to Level 1">
            🕵️ <span>Mystery of Yesterday</span>
          </button>

          <button type="button" class="hud-btn" onclick="window.detectivesApp.prevStage()" title="Previous Level (Left Arrow)">
            ⬅️ <span>Prev</span>
          </button>

          <button type="button" class="hud-btn" onclick="window.detectivesApp.nextStage()" title="Next Level (Right Arrow)">
            <span>Next</span> ➡️
          </button>

          <!-- Stage Tracker Indicator -->
          <div class="stage-tracker-pill" id="hud-stage-name">
            1. 📦 The Mystery Begins (5m)
          </div>

          <!-- Printable Worksheets Link -->
          <a href="worksheet.html" target="_blank" class="hud-btn" title="Open Printable Detective Dossier">
            🖨️ <span>Worksheet</span>
          </a>

          <!-- Return to Library Hub -->
          <a href="../index.html#library" class="hud-btn" title="Return to ESL Library" style="background:#e0f2fe; border-color:#38bdf8; color:#0369a1; text-decoration:none; font-weight:800;">
            📚 <span>Library</span>
          </a>
        </div>

        <div class="hud-right">
          <!-- Classroom Team Scoreboard -->
          <div class="team-scoreboard">
            <div class="team-box team-a" title="Team A Points" onclick="window.detectivesApp.addScore('teamA', 1)">
              <span>🔵 Team A:</span>
              <span class="team-pts" id="score-teamA">0</span>
              <button type="button" class="team-btn-add" onclick="event.stopPropagation(); window.detectivesApp.addScore('teamA', 1)">+1</button>
            </div>
            <div class="team-box team-b" title="Team B Points" onclick="window.detectivesApp.addScore('teamB', 1)">
              <span>🔴 Team B:</span>
              <span class="team-pts" id="score-teamB">0</span>
              <button type="button" class="team-btn-add" onclick="event.stopPropagation(); window.detectivesApp.addScore('teamB', 1)">+1</button>
            </div>
          </div>

          <!-- XP & Streak Indicators -->
          <div class="hud-xp-pill" id="hud-xp-pts">0 XP</div>
          <div class="hud-streak-pill" id="hud-streak-pill" style="display:none;">🔥 0 Streak!</div>

          <!-- Audio Controls -->
          <button type="button" class="hud-btn" id="det-voice-btn" onclick="toggleDetectivesSpeech()" title="Toggle Voice Narration">
            🔊 <span>Voice</span>
          </button>
          <button type="button" class="hud-btn" id="det-sfx-btn" onclick="toggleDetectivesSfx()" title="Toggle Sound Effects">
            🔔 <span>SFX</span>
          </button>

          <!-- Teacher HUD Guide Modal Trigger -->
          <button type="button" class="hud-btn" onclick="window.detectivesApp.openTeacherModal()" title="Teacher Pedagogical Guide (Press T)" style="background:rgba(245,158,11,0.2); border-color:#f59e0b; color:#fbbf24;">
            🧑‍🏫 <span>Teacher Guide</span>
          </button>
        </div>
      </header>

      <!-- Main Stage Viewport -->
      <main id="detectives-stage-content" class="detectives-viewport">
        <!-- Injected dynamically by DetectivesScenes -->
      </main>

      <!-- Toast Feedback -->
      <div id="detectives-toast"></div>

      <!-- Teacher Guide Modal -->
      <div id="detectives-modal" class="detectives-modal-overlay" style="display:none;" onclick="if(event.target===this) window.detectivesApp.closeModal();">
        <div class="detectives-modal-box">
          <button type="button" class="modal-close-btn" onclick="window.detectivesApp.closeModal()" title="Close Guide">✕</button>
          <div id="modal-content-area"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/detectives-audio.js"></script>
  <script src="js/detectives-data.js"></script>
  <script src="js/detectives-scenes.js"></script>
  <script src="js/detectives-app.js"></script>

  <script>
    function toggleDetectivesSpeech() {
      const enabled = window.detectivesSound.toggleSpeech();
      const btn = document.getElementById('det-voice-btn');
      if (btn) {
        btn.innerHTML = enabled ? '🔊 <span>Voice</span>' : '🔇 <span>Muted</span>';
      }
    }

    function toggleDetectivesSfx() {
      const enabled = window.detectivesSound.toggleSfx();
      const btn = document.getElementById('det-sfx-btn');
      if (btn) {
        btn.innerHTML = enabled ? '🔔 <span>SFX</span>' : '🔕 <span>Quiet</span>';
      }
    }
  </script>
</body>
</html>
