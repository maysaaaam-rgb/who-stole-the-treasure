<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⏰ The Wonderland Time Machine — Lesson 2 | Past Simple Adventure | Grade 3 A1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>⏰</text></svg>">
  <link rel="stylesheet" href="css/time-machine.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fullscreen Shell -->
  <div id="time-machine-wrapper">

    <!-- Top Persistent HUD -->
    <header id="tm-hud">
      <div class="hud-group-left">
        <button type="button" class="hud-btn primary" onclick="window.timeMachineApp.renderScreen(1)" title="Go to Time Machine Start">
          ⏰ <span>Time Machine</span>
        </button>

        <button type="button" class="hud-btn" onclick="window.timeMachineApp.prevScreen()" title="Previous Screen (Left Arrow)">
          ⬅️ <span>Prev</span>
        </button>

        <button type="button" class="hud-btn" onclick="window.timeMachineApp.nextScreen()" title="Next Screen (Right Arrow)">
          <span>Next</span> ➡️
        </button>

        <div class="hud-pill hud-screen-pill" id="hud-screen-tracker">
          Screen 1 of 14
        </div>

        <button type="button" class="hud-btn level-toggle" id="hud-diff-btn" onclick="window.timeMachineApp.toggleDifficulty()" title="Toggle Differentiation Level A (Support) vs B (Challenge)">
          Level A (Support)
        </button>

        <a href="worksheet.html" target="_blank" class="hud-btn" title="Open 4-Page Printable Time Machine Dossier">
          🖨️ <span>Time Dossier</span>
        </a>

        <a href="../index.html#library" class="hud-btn" title="Return to Educational Library" style="background:#e0f2fe; border-color:#38bdf8; color:#0369a1; text-decoration:none;">
          📚 <span>Library</span>
        </a>
      </div>

      <div class="hud-group-right">
        <!-- XP Pill with Bounce Micro-Animation -->
        <div class="hud-pill hud-xp-pill" id="hud-xp-pill">
          <span id="hud-xp-display">⭐ 0 XP</span>
        </div>

        <!-- Audio Controls -->
        <button type="button" class="hud-btn" id="btn-toggle-voice" onclick="toggleTmVoice()" title="Toggle Voice Narration">
          🔊 <span>Voice</span>
        </button>
        <button type="button" class="hud-btn" id="btn-toggle-sfx" onclick="toggleTmSfx()" title="Toggle Sound Effects">
          🔔 <span>SFX</span>
        </button>

        <!-- Hidden Teacher Drawer (Key T) -->
        <button type="button" class="hud-btn" onclick="window.timeMachineApp.openTeacherDrawer()" title="Teacher Pedagogical Guide (Press T)" style="background:rgba(245,158,11,0.2); border-color:#f59e0b; color:#fbbf24;">
          🧑‍🏫 <span>Teacher Mode (T)</span>
        </button>
      </div>
    </header>

    <!-- Main Stage Viewport -->
    <main id="time-machine-stage-content">
      <!-- Injected dynamically by TimeMachineScenes -->
    </main>

    <!-- Toast Feedback -->
    <div id="time-machine-toast"></div>

    <!-- Teacher Guide Modal / Observation Panel -->
    <div id="wonderland-teacher-modal" class="teacher-modal-overlay" style="display:none;" onclick="if(event.target===this) window.timeMachineApp.closeTeacherDrawer();">
      <div class="teacher-modal-box" id="teacher-modal-body">
        <!-- Injected dynamically by TimeMachineScenes.renderTeacherModal -->
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/time-machine-audio.js"></script>
  <script src="js/time-machine-data.js"></script>
  <script src="js/time-machine-scenes.js"></script>
  <script src="js/time-machine-app.js"></script>

  <script>
    function toggleTmVoice() {
      const enabled = window.timeMachineAudio.toggleSpeech();
      const btn = document.getElementById('btn-toggle-voice');
      if (btn) {
        btn.innerHTML = enabled ? '🔊 <span>Voice</span>' : '🔇 <span>Muted</span>';
      }
    }

    function toggleTmSfx() {
      const enabled = window.timeMachineAudio.toggleSfx();
      const btn = document.getElementById('btn-toggle-sfx');
      if (btn) {
        btn.innerHTML = enabled ? '🔔 <span>SFX</span>' : '🔕 <span>SFX Off</span>';
      }
    }
  </script>
</body>
</html>
