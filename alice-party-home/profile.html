<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Alice Profile • English Adventure Academy</title>
<style>
  :root { --void: #060911; --amber: #f59e0b; --amber-d: #b45309; --cyan-d: #0369a1; --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 10%, #fff7d6 0%, #fde8f1 55%, #efe7ff 100%); color: #1e1b4b;
         font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-size: 18px; line-height: 1.45; padding: 14px 14px 50px; }
  .app { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .brand { font-weight: 900; font-size: 1.25rem; color: #7c2d12; }
  .brand small { display: block; font-weight: 700; color: #92400e; font-size: .8rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 18px; font: inherit; font-weight: 800; color: #fff;
         text-decoration: none; cursor: pointer; border: 0; border-radius: 14px; background: var(--cyan-d); border-bottom: 5px solid #0c4a6e; transition: transform .12s var(--spring), border-bottom-width .12s; }
  .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
  .btn.amber { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .btn.ghost { background: #475569; border-bottom-color: #334155; }
  .btn-sm-secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 14px; font: inherit; font-weight: 800; color: #fff; background: var(--amber); border: 0; border-bottom: 4px solid var(--amber-d); border-radius: 12px; text-decoration: none; cursor: pointer; }
  .panel { background: rgba(255,255,255,.7); border: 1px solid rgba(124,45,18,.15); border-radius: 22px; padding: 16px; box-shadow: 0 4px 20px -2px rgba(0,0,0,.12); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs .btn { flex: 1; } .tabs .on { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stu { flex-direction: column; gap: 0; background: #7c3aed; border-bottom-color: #4c1d95; min-height: 62px; }
  .stu small { font-size: .78rem; font-weight: 600; opacity: .9; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; color: #7c2d12; }
  .goal { margin: 0 0 14px; color: #92400e; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🫖 My Alice Profile<small id="sub">Alice in Wonderland · Tea Party</small></div>
    <a class="btn ghost" id="back" href="profile.html" style="display:none">◀ All names</a>
  </div>
  <main id="stage"></main>
</div>

<script src="config.js"></script>
<script src="party-data.js"></script>
<script src="../js/monster-renderer.js?v=1"></script>
<script src="monsters.js?v=1"></script>
<script src="../js/alice-profile.js?v=16"></script>
<script>
(function () {
  'use strict';
  var P = window.PARTY, stage = document.getElementById('stage');
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var q = new URLSearchParams(location.search), id = q.get('s');
  if (id && P.find(id)) {
    var me = P.find(id);
    document.getElementById('sub').textContent = me.name + ' · ' + me.role.short;
    document.getElementById('back').style.display = 'inline-flex';
    document.title = me.name + ' • My Alice Profile';
    stage.innerHTML = window.AliceProfile.pupilPage(id);
    window.AliceProfile.wire(stage, id);
    window.AliceProfile.loadStatus(function () { stage.innerHTML = window.AliceProfile.pupilPage(id); window.AliceProfile.wire(stage, id); });
    return;
  }
  var keys = Object.keys(P.classes), cur = keys[0];
  try { cur = localStorage.getItem('eaa_party_class') || cur; } catch (e) { /* default */ }
  var want = (q.get('class') || '').toLowerCase(); if (P.classes[want]) cur = want;
  function draw() {
    stage.innerHTML = '<section class="panel"><h1>Who are you?</h1><p class="goal">Choose your class. Then tap your name.</p>' +
      '<div class="tabs">' + keys.map(function (k) { return '<button type="button" class="btn ghost ' + (k === cur ? 'on' : '') + '" data-k="' + k + '">' + esc(P.classes[k].label) + '</button>'; }).join('') + '</div>' +
      '<div class="grid">' + P.classes[cur].students.map(function (s) { return '<a class="btn stu" href="?s=' + esc(s.id) + '">' + esc(s.name) + '<small>' + esc(P.roles[s.role].short) + '</small></a>'; }).join('') + '</div></section>';
    stage.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { cur = b.dataset.k; try { localStorage.setItem('eaa_party_class', cur); } catch (e) { /* ignore */ } draw(); }); });
  }
  draw();
})();
</script>
</body>
</html>
