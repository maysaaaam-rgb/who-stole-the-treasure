<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Party Ready cards • Alice in Wonderland</title>
  <style>
    :root { --gold: #f59e0b; --ink: #1e1b4b; --rose: #be185d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1020; color: #f8fafc; }
    .bar { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .bar h1 { margin: 0; font-size: 1.3rem; }
    .btn { font: inherit; font-weight: 800; color: #2b1700; background: var(--gold); border: 0; border-bottom: 5px solid #b45309; border-radius: 14px; padding: 10px 20px; cursor: pointer; transition: transform .12s cubic-bezier(.175, .885, .32, 1.275); }
    .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
    .hint { max-width: 1000px; margin: 0 auto 8px; padding: 0 16px; color: #94a3b8; font-size: .95rem; }
    .sheet { width: 210mm; margin: 0 auto 12px; background: #fff; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 66mm; gap: 4mm; padding: 10mm; }
    .card { position: relative; border: 2.2mm double #b45309; border-radius: 6mm; background: radial-gradient(circle at 50% 20%, #fff7d6 0%, #fde8b0 100%); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3mm 4mm; overflow: hidden; }
    .card::before, .card::after { content: '♠'; position: absolute; top: 2mm; font-size: 6mm; color: var(--rose); }
    .card::before { left: 3mm; } .card::after { right: 3mm; content: '♥'; }
    .medal { height: 15mm; width: auto; margin-bottom: 1mm; }
    .tag { font-size: 4.2mm; letter-spacing: .12em; text-transform: uppercase; color: #92400e; font-weight: 700; }
    .big { font-size: 8.4mm; font-weight: 900; color: var(--rose); margin: 0.5mm 0; line-height: 1.05; }
    .name { font-size: 7mm; font-weight: 800; border-bottom: .5mm solid #92400e; min-width: 48mm; padding: 0 2mm 0.5mm; margin-top: 1.5mm; }
    .role { font-size: 4.4mm; margin-top: 1mm; color: #4c1d95; font-weight: 700; }
    .sub { font-size: 3.8mm; margin-top: 1mm; color: #92400e; }
    @media print {
      body { background: #fff; }
      .bar, .hint { display: none; }
      .sheet { margin: 0; page-break-after: always; box-shadow: none; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="bar"><h1>🎩 Tea Party Ready cards</h1><button class="btn" type="button" onclick="window.print()">🖨️ Print (A4, 8 per page)</button></div>
  <p class="hint">Cut along the cards. The last 5 are blank, for pupils who finish later: write the name by hand.</p>
  <div id="sheets"></div>
  <script>
    (function () {
      var P = [
        ['Alya', 'the Cheshire Cat', '4A'], ['Belis', "Alice's Sister", '4A'], ['İpek', 'Alice', '4A'], ['Sühan', 'the Little Oyster', '4A'],
        ['Ali', 'the Dragon', '4B'], ['Derin', 'Alice', '4B'], ['Egehan', 'Tweedledum', '4B'], ['Elif A.', "Alice's Sister", '4B'],
        ['Kerem', 'the Hare', '4B'], ['Ozan T.', 'Bayard', '4B'], ['Utku', 'Hamish', '4B']
      ];
      for (var i = 0; i < 5; i++) P.push(['', '', '']);
      var host = document.getElementById('sheets');
      function card(p) {
        var c = document.createElement('div'); c.className = 'card';
        c.innerHTML = '<img class="medal" src="../platform-art/r_medal.webp" alt="">' +
          '<div class="tag">Alice in Wonderland</div><div class="big">Tea Party Ready!</div>' +
          '<div class="name">' + (p[0] || '&nbsp;') + '</div>' +
          '<div class="role">' + (p[1] ? 'Character: ' + p[1] : '&nbsp;') + '</div>' +
          '<div class="sub">I practised at home. ' + (p[2] ? 'Class ' + p[2] : '') + '</div>';
        return c;
      }
      for (var s = 0; s < P.length; s += 8) {
        var sheet = document.createElement('div'); sheet.className = 'sheet';
        P.slice(s, s + 8).forEach(function (p) { sheet.appendChild(card(p)); });
        host.appendChild(sheet);
      }
    })();
  </script>
</body>
</html>
