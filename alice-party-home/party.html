<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Alice's Tea Party · my part</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#24124a; --ink2:#5b4a85; --card:#ffffff; --line:rgba(76,29,149,.12); --violet:#7c3aed; --violet-d:#5b21b6; --amber:#f59e0b; --amber-d:#b45309; --green:#10b981; --green-d:#047857; --teal:#0d9488; --teal-d:#0f766e; --spring:cubic-bezier(.34,1.56,.64,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; font: 19px/1.45 Fredoka, 'Segoe UI', system-ui, sans-serif; color: var(--ink); padding: 14px 14px 60px;
    background: radial-gradient(circle at 10% 0%, #ffe4f1 0%, transparent 38%), radial-gradient(circle at 95% 8%, #dff7f2 0%, transparent 36%), linear-gradient(180deg, #f6f0ff, #efe7ff 60%, #e9f6ff); }
  .app { max-width: 620px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .brand { font-weight: 700; font-size: 1.1rem; color: var(--violet-d); }
  .pill { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; color: var(--amber-d); white-space: nowrap; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 18px; margin-bottom: 14px; box-shadow: 0 12px 26px -16px rgba(76,29,149,.45); animation: pop .45s var(--spring) both; }
  @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } }
  h1 { font-size: 1.7rem; margin: 0; line-height: 1.1; } h2 { margin: 0 0 10px; font-size: 1.3rem; } .muted { color: var(--ink2); }
  /* hero */
  .hero { background: linear-gradient(135deg, #4c1d95, #7c3aed 55%, #db2777); color: #fff; border: 0; display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
  .hero .av { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff 0%, #f3e8ff 70%); border: 4px solid rgba(255,255,255,.85); overflow: hidden; box-shadow: 0 10px 22px rgba(0,0,0,.3); animation: bob 3s ease-in-out infinite; }
  .hero .av img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .hero .you { margin: 4px 0 8px; font-size: 1.05rem; opacity: .95; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 3px 11px; font-size: .88rem; font-weight: 600; margin: 3px 4px 0 0; }
  /* steps */
  .ring { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar { flex: 1; height: 14px; border-radius: 999px; background: #ede5ff; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #34d399); border-radius: 999px; transition: width .5s var(--spring); }
  .step { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 18px; background: #fbf8ff; margin-top: 8px; border: 2px solid transparent; }
  .step.done { background: #ecfdf5; border-color: #a7f3d0; }
  .step .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 1.6rem; background: #fff; box-shadow: 0 3px 0 rgba(76,29,149,.12); }
  .step.done .ic { background: var(--green); color: #fff; }
  .step b { display: block; } .step small { display: block; color: var(--ink2); font-size: .9rem; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .btn { --c: var(--violet); --d: var(--violet-d); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 8px 16px; font: 700 1rem Fredoka, system-ui, sans-serif; color: #fff; text-decoration: none; cursor: pointer; border: 0; border-bottom: 5px solid var(--d); border-radius: 16px; background: var(--c); touch-action: manipulation; transition: transform .12s var(--spring); }
  .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
  .btn.amber { --c: var(--amber); --d: var(--amber-d); color: #2a1700; } .btn.green { --c: var(--green); --d: var(--green-d); } .btn.teal { --c: var(--teal); --d: var(--teal-d); } .btn.ghost { --c: #fff; --d: #ddd0f7; color: var(--violet-d); border-top: 1px solid var(--line); }
  .btn.big { min-height: 62px; font-size: 1.2rem; width: 100%; }
  /* dialogue bubbles */
  .chat { display: grid; gap: 8px; }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
  .msg .mini { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none; background: #f3e8ff; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.15); } .msg .mini img { width: 100%; height: 100%; object-fit: cover; }
  .bub { background: #f3f0fa; border-radius: 18px 18px 18px 6px; padding: 8px 12px; cursor: pointer; } .bub small { display: block; font-size: .78rem; font-weight: 700; color: var(--ink2); }
  .msg.me { margin-left: auto; flex-direction: row-reverse; } .msg.me .bub { background: linear-gradient(135deg, #fde68a, #fbbf24); border-radius: 18px 18px 6px 18px; font-weight: 700; }
  .guest { background: #ecfeff; border: 2px dashed #67e8f9; border-radius: 18px; padding: 12px; }
  /* props */
  .props { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .prop { background: #fbf8ff; border-radius: 18px; padding: 10px; text-align: center; }
  .prop img { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); } .prop .e { font-size: 3rem; line-height: 84px; }
  .prop b { display: block; } .tag { display: inline-block; margin-top: 4px; padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 600; } .tag.bp { background: #ede9fe; color: #5b21b6; } .tag.home { background: #ccfbf1; color: #115e59; }
  /* picker */
  .seg { display: flex; gap: 6px; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px; margin: 10px 0 14px; }
  .seg button { flex: 1; font: 700 1rem Fredoka, system-ui, sans-serif; border: 0; border-radius: 999px; padding: 10px; background: transparent; color: var(--ink2); cursor: pointer; } .seg button.on { background: var(--violet); color: #fff; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .name { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-bottom: 5px solid #ddd0f7; border-radius: 20px; padding: 10px 6px; transition: transform .12s var(--spring); }
  .name:active { transform: translateY(4px); border-bottom-width: 1px; }
  .name .mini { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #f3e8ff; } .name .mini img { width: 100%; height: 100%; object-fit: cover; }
  .name b { font-size: 1.05rem; } .name small { color: var(--ink2); font-size: .8rem; text-align: center; }
  .name .ok { position: absolute; top: 6px; right: 8px; background: var(--green); color: #fff; border-radius: 999px; font-size: .75rem; font-weight: 700; padding: 1px 7px; }
  details.older summary { cursor: pointer; font-weight: 700; color: var(--violet-d); } .wk { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); } .wk:last-child { border-bottom: 0; } .wk .no { font-size: 1.6rem; text-align: center; }
  .note { color: var(--ink2); font-size: .88rem; text-align: center; margin-top: 8px; }
  .conf { position: fixed; top: -30px; font-size: 26px; pointer-events: none; animation: fall linear forwards; z-index: 50; } @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @media (max-width: 420px) { .hero { grid-template-columns: 92px 1fr; } .hero .av { width: 92px; height: 92px; } h1 { font-size: 1.45rem; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">🫖 Alice’s Tea Party</div><div class="pill" id="pill"></div></div>
  <main id="stage"></main>
  <p class="note" id="note"></p>
</div>
<script src="config.js?v=2"></script>
<script src="party-data.js?v=3"></script>
<script src="../alice-party-print/props-map.js?v=2"></script>
<script src="../js/voice.js"></script>
<script src="party.js?v=4"></script>
</body>
</html>
