<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Party – Home Practice 2 (A1+)</title>
<style>
  :root {
    --void: #060911; --glass: rgba(15, 23, 42, 0.82); --line: rgba(148, 163, 184, 0.25);
    --text: #f8fafc; --muted: #cbd5e1;
    --cyan: #38bdf8; --cyan-d: #0369a1; --amber: #f59e0b; --amber-d: #b45309;
    --green: #10b981; --green-d: #047857; --violet: #a855f7;
    --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: radial-gradient(circle at 50% 20%, #0d1527 0%, var(--void) 100%); color: var(--text);
         font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-size: 20px; line-height: 1.45; padding: 16px 16px 40px; }
  .app { max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand { font-weight: 800; font-size: 1.05rem; }
  .brand small { display: block; font-weight: 600; color: var(--muted); font-size: .8rem; }
  .xp-pill { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--amber); white-space: nowrap; }
  .steps { display: flex; gap: 8px; margin-bottom: 16px; }
  .step { flex: 1; height: 12px; border-radius: 999px; background: rgba(148,163,184,.25); transition: background .3s; }
  .step.done { background: var(--green); } .step.now { background: var(--cyan); }

  .panel { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line);
           border-radius: 22px; padding: 20px; box-shadow: 0 4px 20px -2px rgba(0,0,0,.4); animation: pop .4s var(--spring); }
  @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  h1 { font-size: 1.7rem; margin: 0 0 6px; line-height: 1.15; }
  .goal { color: var(--muted); margin: 0 0 16px; font-size: 1.05rem; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; font: inherit; font-weight: 800; color: #fff;
         cursor: pointer; border: 0; border-radius: 16px; background: var(--cyan-d); border-bottom: 5px solid #0c4a6e;
         transition: transform .12s var(--spring), border-bottom-width .12s, filter .15s; }
  .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
  .btn.green { background: var(--green); border-bottom-color: var(--green-d); }
  .btn.amber { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .btn.ghost { background: #334155; border-bottom-color: #1e293b; }
  .btn.wide { width: 100%; }
  .btn[disabled] { filter: grayscale(.8) brightness(.7); pointer-events: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* picker */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; } .tabs .on { background: var(--cyan-d); border-bottom-color: #0c4a6e; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stu { min-height: 64px; flex-direction: column; gap: 0; font-size: 1.15rem; background: #1e293b; border-bottom-color: #0f172a; }
  .stu small { font-size: .78rem; font-weight: 600; color: var(--muted); text-align: center; }
  .stu.done { border: 2px solid var(--green); }

  /* meet */
  .hero { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #1b1410; }
  .hero img { display: block; width: 100%; height: 300px; object-fit: cover; object-position: 50% 14%; }
  .partner { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(168,85,247,.15); border: 1px solid rgba(168,85,247,.5); font-weight: 700; }
  .lines { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .line { display: flex; align-items: center; gap: 12px; background: rgba(2,6,23,.55); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 18px; font-size: 1.35rem; font-weight: 800; }
  .line .t { flex: 1; } .speak { flex: none; width: 56px; height: 56px; padding: 0; font-size: 1.4rem; }
  .line.playing { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,189,248,.25); }

  /* words */
  .big-pic { text-align: center; font-size: 7rem; line-height: 1.1; margin: 4px 0 8px; animation: idleBob 2.4s ease-in-out infinite; filter: drop-shadow(0 12px 10px rgba(0,0,0,.5)); }
  @keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .pedestal { height: 18px; width: 60%; margin: 0 auto 18px; background: radial-gradient(ellipse at center, rgba(56,189,248,.45), transparent 70%); }
  .choices { display: grid; gap: 12px; } .choice { font-size: 1.4rem; min-height: 64px; text-align: center; }
  .choices.pics { grid-template-columns: repeat(3, 1fr); } .choices.pics .choice { font-size: 3.2rem; min-height: 96px; padding: 4px; }
  .choice.right { background: var(--green); border-bottom-color: var(--green-d); }
  .choice.try { background: #475569; border-bottom-color: #334155; animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .count { color: var(--muted); font-weight: 700; margin-bottom: 4px; }

  /* order */
  .slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 76px; padding: 12px; border: 2px dashed var(--line); border-radius: 16px; background: rgba(2,6,23,.45); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .chip { font-size: 1.35rem; min-height: 52px; padding: 8px 16px; } .chip.used { visibility: hidden; }
  .slots .chip { background: var(--violet); border-bottom-color: #6b21a8; }
  .msg { min-height: 1.6em; margin-top: 12px; font-weight: 800; font-size: 1.15rem; }
  .msg.ok { color: var(--green); } .msg.no { color: var(--amber); }

  /* say / party */
  .say-card { text-align: center; } .say-sentence { font-size: 1.9rem; font-weight: 800; margin: 8px 0 16px; }
  .say-actions { display: grid; gap: 12px; } .heard { color: var(--muted); font-size: 1rem; min-height: 1.4em; margin-top: 10px; }
  .bubble { border-radius: 18px; padding: 14px 16px; margin: 6px 0 12px; border: 1px solid var(--line); }
  .bubble.them { background: rgba(2,6,23,.55); border-left: 6px solid var(--violet); }
  .bubble b { color: var(--muted); font-size: .95rem; } .bubble .bt { font-size: 1.4rem; font-weight: 800; margin-top: 4px; }
  .reply { font-size: 1.2rem; text-align: left; justify-content: flex-start; }

  /* win */
  .card { width: min(100%, 340px); margin: 0 auto; border-radius: 18px; overflow: hidden; background: #1e1b18; border: 3px solid var(--amber);
          box-shadow: 0 0 40px rgba(245,158,11,.35), 0 12px 28px rgba(0,0,0,.6); animation: reveal .9s var(--spring); }
  @keyframes reveal { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .card img { display: block; width: 100%; height: 280px; object-fit: cover; object-position: 50% 14%; }
  .card .tray { padding: 12px 14px 16px; background: linear-gradient(180deg, #2a241e, #15120e); }
  .card .nm { font-size: 1.5rem; font-weight: 800; color: #fde68a; } .card .who { color: var(--muted); font-size: .95rem; }
  .card ul { margin: 6px 0 0; padding-left: 22px; font-size: 1.05rem; }
  .xp-big { text-align: center; font-size: 2.2rem; font-weight: 900; color: var(--amber); margin: 18px 0 4px; }
  .stars { text-align: center; font-size: 2rem; letter-spacing: .3em; }
  .proof { text-align: center; color: var(--muted); font-size: .95rem; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* week 2 */
  .plan-hd { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .plan-hd img { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; object-position: 50% 14%; border: 2px solid var(--amber); flex: none; }
  .plan-hd h1 { font-size: 1.4rem; margin: 0; }
  .task { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 20px -2px rgba(0,0,0,.4); }
  .task.done { border-color: var(--green); background: rgba(16,185,129,.1); }
  .task .th { display: flex; gap: 12px; align-items: center; }
  .task .ico { width: 64px; height: 64px; flex: none; display: grid; place-items: center; font-size: 2.6rem; }
  .task .ico img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
  .task h2 { margin: 0; font-size: 1.25rem; line-height: 1.15; }
  .task .tn { color: var(--amber); font-weight: 800; font-size: .85rem; }
  .task p { margin: 8px 0; color: var(--muted); font-size: 1.02rem; }
  .line .av { flex: none; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; font-size: 1.7rem; overflow: hidden; margin-left: -6px; }
  .line .av img { width: 100%; height: 100%; object-fit: cover; }
  .line.mine .av { border-color: var(--amber); }
  .line.mine { border-color: var(--amber); background: rgba(245,158,11,.12); }
  .line .w { font-size: .78rem; font-weight: 800; color: var(--muted); display: block; }
  .line.mine .w { color: var(--amber); }
  .bonus { margin-top: 14px; font-weight: 800; color: var(--cyan); }
  .lv { display: grid; gap: 8px; margin: 10px 0; }
  .lv .btn { justify-content: flex-start; font-size: 1.05rem; min-height: 50px; text-align: left; }
  .lv .btn.on { background: var(--amber); border-bottom-color: var(--amber-d); color: #1c1203; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(2,6,23,.45); margin: 6px 0; font-weight: 700; cursor: pointer; }
  .chk input { width: 24px; height: 24px; accent-color: var(--green); flex: none; }
  .propbox { display: flex; gap: 12px; align-items: center; background: rgba(2,6,23,.45); border-radius: 16px; padding: 10px; margin: 8px 0; }
  .propbox .pi { width: 76px; height: 76px; flex: none; display: grid; place-items: center; font-size: 2.6rem; }
  .propbox .pi img { width: 100%; height: 100%; object-fit: contain; }
  .craft { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .craft span { background: rgba(56,189,248,.15); border: 1px solid rgba(56,189,248,.5); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .95rem; }
  .safe { background: rgba(245,158,11,.15); border: 1px solid var(--amber); border-radius: 14px; padding: 8px 12px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🫖 Alice's Tea Party<small id="sub">Home practice 2 · 3 short tasks</small></div>
    <div class="xp-pill" id="xp">⭐ 0 XP</div>
  </div>
  <div class="steps" id="steps" aria-hidden="true"></div>
  <main id="stage"></main>
</div>

<script src="config.js"></script>
<script src="../js/voice.js"></script>
<script src="party-data.js?v=2"></script>
<script src="week2.js?v=3"></script>
</body>
</html>
