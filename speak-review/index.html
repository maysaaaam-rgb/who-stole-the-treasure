<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#78c4ff">
  <title>Talk Time Review · Units 1–5 · English Adventure Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261125a">
</head>
<body>
  <header class="sr-head">
    <button type="button" class="sr-hbtn" id="sr-home" title="Lesson plan">🏝️ <span class="sr-hide-sm">Talk Time</span></button>
    <button type="button" class="sr-hbtn blue" id="sr-grade" title="Switch Grade 3 / Grade 4">Grade 3</button>
    <button type="button" class="sr-hbtn yellow" id="sr-lesson" title="Switch Lesson 1 / Lesson 2">Lesson 1</button>
    <nav class="sr-steps" id="sr-steps" aria-label="Lesson steps"></nav>
    <span class="sr-clock" id="sr-clock" title="Lesson time">⏱ 0:00</span>
    <button type="button" class="sr-hbtn round" id="sr-snd" title="Sound on / off">🔊</button>
    <button type="button" class="sr-hbtn round" id="sr-fs" title="Full screen">⛶</button>
    <a class="sr-hbtn round" href="../index.html#home" title="Back to the platform" onclick="try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'eaa:closeOverlay'},'*');return false;}}catch(e){}">✕</a>
  </header>
  <main class="sr-stage" id="sr-stage"></main>
  <footer class="sr-teams" id="sr-teams" aria-label="Team points"></footer>
  <div class="sr-fx" id="sr-fx" aria-hidden="true"></div>

  <script src="js/data.js?v=20261125a"></script>
  <script src="js/audio.js?v=20261125a"></script>
  <script src="js/app.js?v=20261125a"></script>
</body>
</html>
