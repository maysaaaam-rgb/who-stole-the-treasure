<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Party: running order</title>
<link rel="stylesheet" href="print.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: 13pt; }
  th { text-align: left; color: var(--violet); border-bottom: 0.6mm solid var(--violet); padding: 2mm; }
  td { padding: 2.5mm 2mm; border-bottom: 0.3mm solid #e2e8f0; vertical-align: middle; }
  td.t { font-weight: 800; white-space: nowrap; }
  .mv button { font: inherit; border: 0; background: #e2e8f0; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .bar label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  .bar input { font: inherit; padding: 6px 8px; border-radius: 10px; border: 0; width: 80px; }
</style>
</head>
<body>
<div class="bar"><h1>📋 Running order</h1><select id="cls"></select>
  <label>Start <input id="start" type="time" value="10:00"></label><label>Minutes each <input id="mins" type="number" min="1" max="6" value="2"></label>
  <button id="reset">Reset order</button><button onclick="window.print()">Print</button>
  <span class="hint">Use ↑ ↓ to change the order. It is saved on this computer and the rehearsal screen uses the same order.</span></div>
<section class="sheet"><h2 id="ttl"></h2><table><thead><tr><th>#</th><th>Time</th><th>Pair / trio</th><th>Characters</th><th class="noprint"></th></tr></thead><tbody id="rows"></tbody></table>
  <p class="small" style="margin-top:6mm">Every performance is about one minute. The rest is for changing places and applause. Prop check before we begin!</p></section>
<script src="../alice-party-home/party-data.js"></script>
<script>
(function () {
  'use strict';
  var P = window.PARTY, KEY = 'eaa_party_order_v1';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var cls = document.getElementById('cls'), keys = Object.keys(P.classes);
  cls.innerHTML = keys.map(function (k) { return '<option value="' + k + '">' + esc(P.classes[k].label) + '</option>'; }).join('');
  function groups(k) { var seen = [], map = {}; P.classes[k].students.forEach(function (s) { if (!map[s.pair]) { map[s.pair] = []; seen.push(s.pair); } map[s.pair].push(s); }); return { order: seen, map: map }; }
  function load(k) { var g = groups(k), saved = []; try { saved = (JSON.parse(localStorage.getItem(KEY) || '{}') || {})[k] || []; } catch (e) { saved = []; }
    var o = saved.filter(function (p) { return g.map[p]; }); g.order.forEach(function (p) { if (o.indexOf(p) < 0) o.push(p); }); return { order: o, map: g.map }; }
  function store(k, o) { var all = {}; try { all = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { all = {}; } all[k] = o; try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { /* not remembered */ } }
  function draw() {
    var k = cls.value, g = load(k), start = document.getElementById('start').value || '10:00', mins = Math.max(1, parseInt(document.getElementById('mins').value, 10) || 2);
    var p = start.split(':'), t = (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    document.getElementById('ttl').textContent = '🫖 Alice’s Tea Party · ' + P.classes[k].label + ' · running order';
    document.getElementById('rows').innerHTML = g.order.map(function (pair, i) {
      var st = g.map[pair], hh = String(Math.floor((t + i * mins) / 60) % 24).padStart(2, '0'), mm = String((t + i * mins) % 60).padStart(2, '0');
      return '<tr><td>' + (i + 1) + '</td><td class="t">' + hh + ':' + mm + '</td><td>' + st.map(function (s) { return esc(s.name); }).join(' + ') + '</td><td>' + st.map(function (s) { return esc(P.roles[s.role].short); }).join(' + ') +
        '</td><td class="mv noprint"><button data-i="' + i + '" data-d="-1">↑</button> <button data-i="' + i + '" data-d="1">↓</button></td></tr>';
    }).join('');
    [].forEach.call(document.querySelectorAll('.mv button'), function (b) {
      b.onclick = function () { var i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= g.order.length) return; var x = g.order[i]; g.order[i] = g.order[j]; g.order[j] = x; store(k, g.order); draw(); };
    });
  }
  cls.onchange = draw; document.getElementById('start').oninput = draw; document.getElementById('mins').oninput = draw;
  document.getElementById('reset').onclick = function () { store(cls.value, []); draw(); };
  draw();
})();
</script>
</body>
</html>
