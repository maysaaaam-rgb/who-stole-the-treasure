<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fff8e1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="550" rx="20" fill="url(#certBg)" stroke="#fbc02d" stroke-width="12"/>
  <rect x="25" y="25" width="750" height="500" rx="14" fill="none" stroke="#d32f2f" stroke-width="4" stroke-dasharray="8 6"/>

  <polygon points="30,30 110,30 30,110" fill="#d32f2f"/>
  <polygon points="770,30 690,30 770,110" fill="#d32f2f"/>
  <polygon points="30,520 110,520 30,440" fill="#d32f2f"/>
  <polygon points="770,520 690,520 770,440" fill="#d32f2f"/>

  <text x="400" y="100" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="36" font-weight="900" fill="#b71c1c" text-anchor="middle" letter-spacing="2">🚒 FIREFIGHTER ACADEMY 🚒</text>
  <text x="400" y="140" font-family="'Comic Sans MS', sans-serif" font-size="24" font-weight="bold" fill="#f57f17" text-anchor="middle">CERTIFICATE OF EXCELLENCE</text>
  <line x1="200" y1="160" x2="600" y2="160" stroke="#fbc02d" stroke-width="4"/>

  <text x="400" y="210" font-family="'Comic Sans MS', sans-serif" font-size="20" fill="#555" text-anchor="middle">This certifies that</text>
  <text x="400" y="260" font-family="'Comic Sans MS', sans-serif" font-size="34" font-weight="bold" fill="#0d47a1" text-anchor="middle">SUPER FIREFIGHTER OF TULIP CLASS</text>
  <line x1="160" y1="275" x2="640" y2="275" stroke="#0d47a1" stroke-width="2"/>

  <text x="400" y="320" font-family="'Comic Sans MS', sans-serif" font-size="20" fill="#333" text-anchor="middle">has completed the Fire Station Training Adventure and learned:</text>
  <text x="400" y="360" font-family="'Comic Sans MS', sans-serif" font-size="22" font-weight="bold" fill="#d32f2f" text-anchor="middle">"A firefighter can help people, rescue animals &amp; put out fires!"</text>
  <text x="400" y="395" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#2e7d32" text-anchor="middle">"The best thing you can be is yourself!" ❤️</text>

  <g transform="translate(180, 430)">
    <line x1="0" y1="50" x2="160" y2="50" stroke="#333" stroke-width="2"/>
    <text x="80" y="75" font-family="'Comic Sans MS', sans-serif" font-size="16" fill="#666" text-anchor="middle">Mr Clark (Teacher)</text>
  </g>

  <g transform="translate(460, 430)">
    <line x1="0" y1="50" x2="160" y2="50" stroke="#333" stroke-width="2"/>
    <text x="80" y="75" font-family="'Comic Sans MS', sans-serif" font-size="16" fill="#666" text-anchor="middle">Charlie (Firefighter)</text>
  </g>
</svg>