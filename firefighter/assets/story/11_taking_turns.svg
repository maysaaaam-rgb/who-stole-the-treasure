<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cabBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cabBg)"/>

  <rect x="150" y="25" width="500" height="70" rx="20" fill="#43a047" stroke="#2e7d32" stroke-width="4"/>
  <text x="400" y="70" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">TAKING TURNS! 🤝</text>

  <g transform="translate(100, 120)">
    <rect width="600" height="340" rx="24" fill="#d32f2f" stroke="#b71c1c" stroke-width="8"/>
    <rect x="30" y="30" width="540" height="230" rx="16" fill="#b3e5fc" stroke="#0288d1" stroke-width="4"/>

    <!-- Child 1 Sitting at Steering Wheel -->
    <g transform="translate(180, 150)">
      <circle cx="0" cy="0" r="38" fill="#ffcc80"/>
      <path d="M -45,-12 Q 0,-60 45,-12 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <circle cx="-12" cy="-4" r="4" fill="#333"/>
      <circle cx="12" cy="-4" r="4" fill="#333"/>
      <path d="M -15,12 Q 0,26 15,12" stroke="#b71c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="70" r="45" stroke="#212121" stroke-width="12" fill="none"/>
      <line x1="-45" y1="70" x2="45" y2="70" stroke="#212121" stroke-width="10"/>
      <circle cx="0" cy="70" r="14" fill="#ffeb3b"/>
      <circle cx="45" cy="10" r="12" fill="#ffcc80"/>
    </g>

    <!-- Child 2 Waiting politely -->
    <g transform="translate(420, 160)">
      <circle cx="0" cy="0" r="35" fill="#8d6e63"/>
      <circle cx="0" cy="-2" r="34" fill="#5d4037"/>
      <circle cx="0" cy="0" r="32" fill="#a1887f"/>
      <circle cx="-10" cy="-4" r="4" fill="#333"/>
      <circle cx="10" cy="-4" r="4" fill="#333"/>
      <path d="M -12,12 Q 0,24 12,12" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 35,30 L 65,0" stroke="#a1887f" stroke-width="12" stroke-linecap="round"/>
      <text x="65" y="-5" font-size="28">👋</text>
    </g>
  </g>

  <g transform="translate(100, 480)">
    <rect width="600" height="90" rx="16" fill="#ffffff" stroke="#43a047" stroke-width="3"/>
    <text x="300" y="38" font-family="'Comic Sans MS', sans-serif" font-size="22" font-weight="bold" fill="#1b5e20" text-anchor="middle">Do they all go at the same time? NO!</text>
    <text x="300" y="70" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#d84315" text-anchor="middle">They TAKE TURNS! That is great teamwork! ⭐</text>
  </g>
</svg>