<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="uniformGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff6f00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="300" r="280" fill="#ffffff" opacity="0.6"/>

  <!-- Station doors in background -->
  <rect x="50" y="100" width="700" height="480" rx="20" fill="#ffebee" stroke="#ef5350" stroke-width="6" opacity="0.5"/>

  <!-- Charlie the Firefighter -->
  <g transform="translate(400, 60)" filter="url(#cardGlow)">
    <!-- Heavy Boots -->
    <rect x="-65" y="440" width="45" height="70" rx="8" fill="#212121"/>
    <rect x="20" y="440" width="45" height="70" rx="8" fill="#212121"/>
    <ellipse cx="-45" cy="505" rx="30" ry="12" fill="#000000"/>
    <ellipse cx="45" cy="505" rx="30" ry="12" fill="#000000"/>

    <!-- Trousers with Neon Strips -->
    <rect x="-60" y="320" width="45" height="135" fill="url(#uniformGrad)"/>
    <rect x="15" y="320" width="45" height="135" fill="url(#uniformGrad)"/>
    <rect x="-60" y="390" width="45" height="14" fill="#ffee58"/>
    <rect x="-60" y="404" width="45" height="6" fill="#e0e0e0"/>
    <rect x="15" y="390" width="45" height="14" fill="#ffee58"/>
    <rect x="15" y="404" width="45" height="6" fill="#e0e0e0"/>

    <!-- Protective Jacket Body -->
    <path d="M -80,180 L 80,180 L 70,335 L -70,335 Z" fill="url(#uniformGrad)" stroke="#0d47a1" stroke-width="4"/>
    <rect x="-76" y="240" width="152" height="18" fill="#ffee58"/>
    <rect x="-76" y="246" width="152" height="6" fill="#e0e0e0"/>
    <rect x="-70" y="305" width="140" height="16" fill="#ffee58"/>
    <!-- Badge -->
    <polygon points="35,200 45,212 55,200 50,225 35,225" fill="#ffd54f" stroke="#ff8f00" stroke-width="2"/>

    <!-- Arms / Hands on Hips -->
    <path d="M -75,190 L -120,255 L -70,270" stroke="url(#uniformGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-68" cy="270" r="15" fill="#212121"/>
    <line x1="-105" y1="230" x2="-95" y2="245" stroke="#ffee58" stroke-width="8"/>

    <path d="M 75,190 L 125,230 L 140,165" stroke="url(#uniformGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="105" y1="205" x2="115" y2="195" stroke="#ffee58" stroke-width="8"/>
    <circle cx="145" cy="155" r="16" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
    <path d="M 140,142 Q 148,130 156,142" stroke="#e65100" stroke-width="3" fill="none"/>

    <!-- Neck -->
    <rect x="-16" y="150" width="32" height="35" rx="6" fill="#ffcc80"/>

    <!-- Charlie's Head -->
    <ellipse cx="0" cy="130" rx="42" ry="46" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
    <path d="M -42,120 Q -45,155 -30,165 Q -20,130 -30,105 Z" fill="#5d4037"/>
    <path d="M 42,120 Q 45,155 30,165 Q 20,130 30,105 Z" fill="#5d4037"/>
    <path d="M -40,110 Q 0,85 40,110 Z" fill="#5d4037"/>

    <!-- Eyes & Big warm smile -->
    <ellipse cx="-16" cy="125" rx="5" ry="6" fill="#3e2723"/>
    <circle cx="-14" cy="123" r="2" fill="#ffffff"/>
    <ellipse cx="16" cy="125" rx="5" ry="6" fill="#3e2723"/>
    <circle cx="18" cy="123" r="2" fill="#ffffff"/>
    <circle cx="-28" cy="138" r="8" fill="#ff8a80" opacity="0.6"/>
    <circle cx="28" cy="138" r="8" fill="#ff8a80" opacity="0.6"/>
    <path d="M -16,145 Q 0,165 16,145" stroke="#b71c1c" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Yellow Firefighter Helmet -->
    <path d="M -58,95 Q 0,35 58,95 Q 70,105 0,105 Q -70,105 -58,95 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="4"/>
    <ellipse cx="0" cy="65" rx="35" ry="24" fill="#fdd835"/>
    <polygon points="-8,72 8,72 0,55" fill="#d32f2f"/>
    <path d="M -45,95 Q 0,112 45,95" stroke="#81d4fa" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Speech Banner -->
  <g transform="translate(130, 480)">
    <rect x="0" y="0" width="540" height="90" rx="20" fill="#ffffff" stroke="#ff9800" stroke-width="4" filter="url(#cardGlow)"/>
    <text x="270" y="40" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="24" font-weight="bold" fill="#d84315" text-anchor="middle">"Hello Tulip Class! I am Charlie!" 👩‍🚒</text>
    <text x="270" y="72" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="20" font-weight="bold" fill="#1565c0" text-anchor="middle">"Welcome to the fire station!"</text>
  </g>
</svg>