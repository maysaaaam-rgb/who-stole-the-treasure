<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#e8f5e9"/>

  <rect x="100" y="20" width="600" height="65" rx="16" fill="#d32f2f" stroke="#b71c1c" stroke-width="3"/>
  <text x="400" y="62" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">A FIREFIGHTER CAN... 🚒</text>

  <!-- Panel 1: Put out fires -->
  <g transform="translate(40, 105)" filter="url(#panelShadow)">
    <rect width="220" height="395" rx="16" fill="url(#panelBg)" stroke="#f44336" stroke-width="4"/>
    <rect x="0" y="0" width="220" height="50" rx="16" fill="#ffebee"/>
    <text x="110" y="35" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#c62828" text-anchor="middle">🔥 Put out fires</text>
    
    <!-- Fire -->
    <g transform="translate(110, 210)">
      <path d="M 0,30 Q -40,-30 -20,-70 Q 0,-15 20,-70 Q 40,-30 0,30 Z" fill="#ff3d00"/>
      <path d="M 0,30 Q -25,-20 -10,-50 Q 0,-10 10,-50 Q 25,-20 0,30 Z" fill="#ff9100"/>
      <path d="M 0,30 Q -12,-10 0,-30 Q 12,-10 0,30 Z" fill="#ffea00"/>
    </g>
    <!-- Water stream -->
    <path d="M 20,290 Q 70,220 105,180" stroke="#00e5ff" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 20,290 Q 70,220 105,180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <polygon points="10,295 25,285 30,295 15,305" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>

    <rect x="15" y="330" width="190" height="50" rx="10" fill="#ffffff" stroke="#ffcdd2" stroke-width="2"/>
    <text x="110" y="355" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">"A firefighter can</text>
    <text x="110" y="372" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">put out fires."</text>
  </g>

  <!-- Panel 2: Help people -->
  <g transform="translate(290, 105)" filter="url(#panelShadow)">
    <rect width="220" height="395" rx="16" fill="url(#panelBg)" stroke="#1976d2" stroke-width="4"/>
    <rect x="0" y="0" width="220" height="50" rx="16" fill="#e3f2fd"/>
    <text x="110" y="35" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#0d47a1" text-anchor="middle">👨‍👩‍👧 Help people</text>

    <!-- Firefighter guiding child safely -->
    <g transform="translate(110, 160)">
      <circle cx="-25" cy="0" r="22" fill="#ffcc80"/>
      <path d="M -45,-5 Q -25,-30 -5,-5 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/>
      <rect x="-42" y="22" width="34" height="60" rx="8" fill="#1a237e"/>
      <rect x="-42" y="50" width="34" height="10" fill="#ffee58"/>

      <circle cx="28" cy="25" r="16" fill="#ffcc80"/>
      <rect x="16" y="42" width="24" height="40" rx="6" fill="#e91e63"/>
      <path d="M -15,40 Q 5,48 20,45" stroke="#ffcc80" stroke-width="8" stroke-linecap="round"/>

      <g transform="translate(0, -10)">
        <path d="M 0,0 C -10,-10 -20,5 0,20 C 20,5 10,-10 0,0 Z" fill="#e91e63"/>
      </g>
    </g>

    <rect x="15" y="330" width="190" height="50" rx="10" fill="#ffffff" stroke="#bbdefb" stroke-width="2"/>
    <text x="110" y="355" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">"A firefighter can</text>
    <text x="110" y="372" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">help people."</text>
  </g>

  <!-- Panel 3: Rescue animals -->
  <g transform="translate(540, 105)" filter="url(#panelShadow)">
    <rect width="220" height="395" rx="16" fill="url(#panelBg)" stroke="#388e3c" stroke-width="4"/>
    <rect x="0" y="0" width="220" height="50" rx="16" fill="#e8f8f5"/>
    <text x="110" y="35" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#1b5e20" text-anchor="middle">🐱 Rescue animals</text>

    <!-- Tree + Kitten + Ladder -->
    <g transform="translate(110, 150)">
      <path d="M -70,30 Q -10,10 60,30 L 80,60 Q 0,40 -70,50 Z" fill="#795548"/>
      <circle cx="-50" cy="15" r="30" fill="#4caf50" opacity="0.8"/>
      <circle cx="70" cy="15" r="25" fill="#4caf50" opacity="0.8"/>
      
      <g transform="translate(20, -10)">
        <ellipse cx="0" cy="15" rx="16" ry="12" fill="#ff9800"/>
        <circle cx="0" cy="0" r="14" fill="#ff9800"/>
        <polygon points="-12,-8 -6,-22 -2,-6" fill="#ff9800"/>
        <polygon points="12,-8 6,-22 2,-6" fill="#ff9800"/>
        <circle cx="-4" cy="-2" r="2" fill="#333"/>
        <circle cx="4" cy="-2" r="2" fill="#333"/>
        <polygon points="-2,3 2,3 0,5" fill="#e91e63"/>
        <path d="M 14,18 Q 28,10 24,0" stroke="#ff9800" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <line x1="-50" y1="130" x2="-5" y2="35" stroke="#9e9e9e" stroke-width="6"/>
      <line x1="-30" y1="130" x2="15" y2="35" stroke="#9e9e9e" stroke-width="6"/>
      <line x1="-42" y1="105" x2="-22" y2="105" stroke="#757575" stroke-width="4"/>
      <line x1="-32" y1="80" x2="-12" y2="80" stroke="#757575" stroke-width="4"/>
      <line x1="-22" y1="55" x2="-2" y2="55" stroke="#757575" stroke-width="4"/>
    </g>

    <rect x="15" y="330" width="190" height="50" rx="10" fill="#ffffff" stroke="#c8e6c9" stroke-width="2"/>
    <text x="110" y="355" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">"A firefighter can</text>
    <text x="110" y="372" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">rescue animals."</text>
  </g>

  <text x="400" y="555" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#d84315" text-anchor="middle">👉 Oral practice: "A firefighter can..."</text>
</svg>