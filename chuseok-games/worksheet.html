<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖨️ Chuseok Game Master Quest | Printable A4 Student Workbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .a4-student-page {
      width: 210mm;
      min-height: 297mm;
      padding: 8mm 12mm;
      margin: 0 auto 20px auto;
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      position: relative;
    }

    .print-box {
      border: 1.2pt solid #1f2937;
      border-radius: 4.5pt;
      padding: 5pt 7pt;
      margin-bottom: 5pt;
      background: #ffffff;
    }

    .print-box-header {
      background: #f3f4f6;
      font-weight: 800;
      font-size: 8pt;
      border-bottom: 1pt solid #1f2937;
      padding: 2.5pt 5pt;
      margin: -5pt -7pt 3.5pt -7pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .handwriting-line {
      border-bottom: 1pt dashed #9ca3af;
      min-height: 19pt;
      display: flex;
      align-items: flex-end;
      padding-bottom: 1.5pt;
      margin-bottom: 3.5pt;
      font-size: 8.5pt;
      color: #334155;
    }

    .checkbox-square {
      display: inline-block;
      width: 10pt;
      height: 10pt;
      border: 1.2pt solid #1f2937;
      border-radius: 2pt;
      margin-right: 3pt;
      vertical-align: middle;
      background: #ffffff;
    }

    .pocket-script-box {
      border: 1.5pt dashed #b45309;
      background: #fffbeb;
      border-radius: 5pt;
      padding: 4.5pt 6.5pt;
      margin-bottom: 5pt;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-student-page {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 4mm 2mm !important;
        width: 100% !important;
        max-height: 275mm !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .a4-student-page:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }
      .pocket-script-box {
        background: #fffbeb !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-box-header {
        background: #f3f4f6 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Bar (Screen Only) -->
  <div class="no-print max-w-4xl mx-auto mb-5 p-4 bg-slate-900 text-white rounded-2xl flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs flex items-center gap-1 transition">
        <span>←</span> Back to Game Portal
      </a>
      <div>
        <h1 class="text-sm font-black text-white">Chuseok Game Master Printable A4 Workbooks</h1>
        <p class="text-[11px] text-slate-400">Classes 3A (17) &amp; 3B (16) • CEFR A1+ • Due: Tuesday, Oct 6</p>
      </div>
    </div>

    <!-- Filter & Batch Controls -->
    <div class="flex flex-wrap items-center gap-2">
      <select id="class-select" onchange="onClassChange()" class="bg-slate-800 text-amber-300 font-bold text-xs px-3 py-1.5 rounded-xl border border-white/10 focus:outline-none">
        <option value="3A">Class 3A (17 Students)</option>
        <option value="3B">Class 3B (16 Students)</option>
      </select>

      <select id="student-filter" onchange="renderWorksheets()" class="bg-slate-800 text-white font-bold text-xs px-3 py-1.5 rounded-xl border border-white/10 focus:outline-none max-w-[180px]">
        <option value="ALL">🖨️ All Students (Batch)</option>
        <option value="BLANK">📝 Blank Template</option>
      </select>

      <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-lg shadow-amber-500/25 transition">
        <span>🖨️</span> Print 1-Page A4 Sheet
      </button>
    </div>
  </div>

  <!-- A4 Worksheets Container -->
  <div id="sheets-container"></div>

  <script>
    const CLASS_ROSTERS = {
      "3A": [
        "Aslıhan Akın",
        "Ateş Özenci",
        "Ayça Koca",
        "Ayşe Mila Yılmaz",
        "Batı Mustafa Kır",
        "Beren Umur",
        "Beste Aksu",
        "Cemre Özbay",
        "Ege Taş",
        "Fatih Yetkin Yılmaz",
        "Gurur Ürek",
        "Gökçe Duman",
        "Gülce Çalışkan",
        "Güneş Nisa Aydın",
        "Mavi Nil Bozkurt",
        "Melis Ayşen Şentürk",
        "Melodi Karaca"
      ],
      "3B": [
        "Ahmet Alhasan",
        "Ayaz Kahraman",
        "Begüm Eren",
        "Buğlem Arıöz",
        "Demir Susatar",
        "Deniz Akıncı",
        "Deniz Kavasoğlu",
        "Ece Aras",
        "Ece Yaşar",
        "Ecem Naz Yaman",
        "Elif Miray Ata",
        "İlker Mete Kırsaç",
        "Mila Topçu",
        "Rüzgar Sarp Kutlu",
        "Sena Varaş",
        "Ülkü Sancaklı"
      ]
    };

    const GAMES = [
      { id: "ddakji", title: "Ddakji (딱지)" },
      { id: "paengi", title: "Paengi (팽이)" },
      { id: "gonggi", title: "Gonggi (공기놀이)" },
      { id: "jegichagi", title: "Jegichagi (제기차기)" },
      { id: "yutnori", title: "Yut Nori (윷놀이)" }
    ];

    function getStudentGame(studentName, className) {
      const savedDraw = localStorage.getItem(`chuseok_draw_${className}`);
      if (savedDraw) {
        try {
          const parsed = JSON.parse(savedDraw);
          for (let gameId in parsed) {
            if (parsed[gameId].includes(studentName)) {
              const g = GAMES.find(x => x.id === gameId);
              return g ? g.title : gameId;
            }
          }
        } catch(e) {}
      }
      const roster = CLASS_ROSTERS[className];
      const idx = roster.indexOf(studentName);
      if (idx >= 0) {
        return GAMES[idx % GAMES.length].title;
      }
      return "[ Selected Game ]";
    }

    function createA4PageHTML(studentName, className, gameTitle) {
      return `
        <div class="a4-student-page">
          <!-- Compact Header -->
          <div class="border-b-2 border-slate-900 pb-1.5 mb-1.5 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-sm">🌕</span>
                <span class="text-[9.5pt] font-black uppercase tracking-tight text-slate-950">ENGLISH ADVENTURE ACADEMY — CHUSEOK QUEST</span>
              </div>
              <p class="text-[7.5pt] text-slate-600 font-semibold leading-tight">Traditional Folk Game Master Workbook (CEFR Level A1+ | Week 1: Games &amp; Crafting)</p>
            </div>
            <div class="text-right border border-slate-900 rounded p-1 bg-amber-50/90 leading-tight">
              <div class="text-[6.5pt] font-bold uppercase text-slate-600">Due Date:</div>
              <div class="text-[8.5pt] font-black text-rose-700">Tuesday, Oct 6</div>
            </div>
          </div>

          <!-- Student Fill-in Line -->
          <div class="flex items-center justify-between text-[8pt] p-1 bg-slate-50 border border-slate-300 rounded mb-1">
            <div class="flex items-center gap-1 flex-1">
              <span class="font-bold text-slate-800">Name:</span>
              <span class="font-bold border-b border-slate-900 px-1 flex-1">${studentName || '________________________'}</span>
            </div>
            <div class="flex items-center gap-3 px-3">
              <span class="font-bold text-slate-800">Class:</span>
              <label class="flex items-center gap-0.5"><span class="checkbox-square">${className === '3A' ? '✓' : ''}</span> 3A</label>
              <label class="flex items-center gap-0.5"><span class="checkbox-square">${className === '3B' ? '✓' : ''}</span> 3B</label>
            </div>
            <div class="text-[7pt] text-slate-500 font-bold">Bring crafted game to school!</div>
          </div>

          <!-- Assigned Game Checkbox Line -->
          <div class="flex items-center justify-between text-[7.5pt] p-1 bg-amber-50/70 border border-amber-300/80 rounded mb-1.5 font-semibold text-slate-900">
            <span class="font-bold text-amber-900">My Assigned Game:</span>
            <label class="flex items-center gap-0.5"><span class="checkbox-square">${gameTitle.includes('Ddakji') ? '✓' : ''}</span> Ddakji</label>
            <label class="flex items-center gap-0.5"><span class="checkbox-square">${gameTitle.includes('Paengi') ? '✓' : ''}</span> Paengi</label>
            <label class="flex items-center gap-0.5"><span class="checkbox-square">${gameTitle.includes('Gonggi') ? '✓' : ''}</span> Gonggi</label>
            <label class="flex items-center gap-0.5"><span class="checkbox-square">${gameTitle.includes('Jegichagi') ? '✓' : ''}</span> Jegichagi</label>
            <label class="flex items-center gap-0.5"><span class="checkbox-square">${gameTitle.includes('Yut') ? '✓' : ''}</span> Yut Nori</label>
          </div>

          <!-- Task 1: The Maker's Story (2 lines) -->
          <div class="print-box">
            <div class="print-box-header">
              <span>✂️ 1. THE MAKER'S STORY (CRAFTING &amp; MATERIALS)</span>
              <span class="text-[7pt] text-slate-500 italic">"I made it using..." | "First, I..." | "It was easy/hard because..."</span>
            </div>
            <div class="font-bold text-slate-800 text-[7.5pt] mb-0.5">What materials did you find at home, and how did you build your game?</div>
            <div class="handwriting-line"></div>
            <div class="handwriting-line"></div>
          </div>

          <!-- Task 2: The Rulebook (2 lines) -->
          <div class="print-box">
            <div class="print-box-header">
              <span>🎯 2. THE RULEBOOK (GAME INSTRUCTIONS)</span>
              <span class="text-[7pt] text-slate-500 italic">"Players must stand..." | "To play, you need to..." | "The winner is..."</span>
            </div>
            <div class="font-bold text-slate-800 text-[7.5pt] mb-0.5">How do players play your game, and how does someone win?</div>
            <div class="handwriting-line"></div>
            <div class="handwriting-line"></div>
          </div>

          <!-- Task 3: Cut-Out Host Pocket Script (Dashed Border Box) -->
          <div class="pocket-script-box">
            <div class="font-black text-amber-950 flex items-center justify-between text-[7.5pt] border-b border-amber-300 pb-0.5 mb-1">
              <span>✂️ CUT-OUT HOST SCRIPT (Hold in your hand while hosting peers on Tuesday):</span>
              <span class="text-[6.5pt] text-amber-800 uppercase tracking-wider">English Adventure Academy</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-[7.5pt] text-slate-900 leading-tight">
              <div class="bg-white/90 p-1.5 rounded border border-amber-200">
                <span class="font-bold text-amber-900 block text-[6.5pt] uppercase">1. Welcome Phrase</span>
                "Welcome! My game is called: ____________________"
              </div>
              <div class="bg-white/90 p-1.5 rounded border border-amber-200">
                <span class="font-bold text-amber-900 block text-[6.5pt] uppercase">2. Turn Taking</span>
                "Your turn! Try your best to: ____________________!"
              </div>
              <div class="bg-white/90 p-1.5 rounded border border-amber-200">
                <span class="font-bold text-amber-900 block text-[6.5pt] uppercase">3. Cheering Phrases</span>
                "Awesome shot! / Great job playing!"
              </div>
            </div>
          </div>

          <!-- Task 4: Classroom Arcade Host Visitor Log & XP Stamp Box -->
          <div class="grid grid-cols-12 gap-2 text-[7pt]">
            <div class="col-span-8 border border-slate-400 rounded p-1.5 bg-slate-50">
              <div class="font-black text-slate-900 text-[7.5pt] mb-0.5 flex items-center justify-between">
                <span>🎪 TASK 4: CLASSROOM ARCADE HOST VISITOR LOG</span>
                <span class="text-amber-800 font-bold">[ 3 Peer Signatures ]</span>
              </div>
              <table class="w-full text-left border-collapse border border-slate-300 bg-white">
                <thead>
                  <tr class="bg-slate-100 text-[6.5pt] uppercase text-slate-700">
                    <th class="p-0.5 px-1 border border-slate-300">Visitor</th>
                    <th class="p-0.5 px-1 border border-slate-300">Classmate Name</th>
                    <th class="p-0.5 px-1 border border-slate-300">Score</th>
                    <th class="p-0.5 px-1 border border-slate-300 text-center">Spoke English!</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="p-0.5 px-1 border border-slate-300 font-bold text-blue-900">Peer 1</td>
                    <td class="p-0.5 px-1 border border-slate-300">Name: _________________</td>
                    <td class="p-0.5 px-1 border border-slate-300">Score: _____</td>
                    <td class="p-0.5 px-1 border border-slate-300 text-center"><span class="checkbox-square"></span> Spoke English!</td>
                  </tr>
                  <tr>
                    <td class="p-0.5 px-1 border border-slate-300 font-bold text-rose-900">Peer 2</td>
                    <td class="p-0.5 px-1 border border-slate-300">Name: _________________</td>
                    <td class="p-0.5 px-1 border border-slate-300">Score: _____</td>
                    <td class="p-0.5 px-1 border border-slate-300 text-center"><span class="checkbox-square"></span> Spoke English!</td>
                  </tr>
                  <tr>
                    <td class="p-0.5 px-1 border border-slate-300 font-bold text-emerald-900">Peer 3</td>
                    <td class="p-0.5 px-1 border border-slate-300">Name: _________________</td>
                    <td class="p-0.5 px-1 border border-slate-300">Score: _____</td>
                    <td class="p-0.5 px-1 border border-slate-300 text-center"><span class="checkbox-square"></span> Spoke English!</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- XP Stamp Box -->
            <div class="col-span-4 border border-slate-400 rounded p-1.5 bg-slate-50 flex flex-col justify-between">
              <div>
                <strong class="text-slate-900 block font-black text-[7.5pt]">Teacher XP Stamp Box:</strong>
                <div class="mt-0.5 space-y-0.5 text-[7pt]">
                  <div class="flex items-center gap-1"><span class="checkbox-square"></span> 50 XP Craft Master</div>
                  <div class="flex items-center gap-1"><span class="checkbox-square"></span> 30 XP English Rulebook</div>
                  <div class="flex items-center gap-1"><span class="checkbox-square"></span> 20 XP Arcade Host</div>
                </div>
              </div>
              <div class="font-black text-amber-900 text-right border-t border-slate-300 pt-0.5 text-[7.5pt]">
                Total: 100 XP Stamp
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function onClassChange() {
      const classSelect = document.getElementById('class-select');
      const cls = classSelect.value;
      const studentFilter = document.getElementById('student-filter');

      studentFilter.innerHTML = `
        <option value="ALL">🖨️ All Students (Batch: ${CLASS_ROSTERS[cls].length} Sheets)</option>
        <option value="BLANK">📝 Blank Template</option>
      `;

      CLASS_ROSTERS[cls].forEach(st => {
        const opt = document.createElement('option');
        opt.value = st;
        opt.textContent = st;
        studentFilter.appendChild(opt);
      });

      renderWorksheets();
    }

    function renderWorksheets() {
      const cls = document.getElementById('class-select').value;
      const filter = document.getElementById('student-filter').value;
      const container = document.getElementById('sheets-container');
      container.innerHTML = '';

      if (filter === 'BLANK') {
        container.innerHTML = createA4PageHTML('', cls, '[ Selected Game ]');
      } else if (filter === 'ALL') {
        CLASS_ROSTERS[cls].forEach(st => {
          const game = getStudentGame(st, cls);
          container.innerHTML += createA4PageHTML(st, cls, game);
        });
      } else {
        const game = getStudentGame(filter, cls);
        container.innerHTML = createA4PageHTML(filter, cls, game);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      onClassChange();
    });
  </script>
</body>
</html>
