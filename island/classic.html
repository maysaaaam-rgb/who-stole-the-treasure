<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#78c4ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="art/real/icon-192.png">
  <link rel="apple-touch-icon" href="art/real/icon-192.png">
  <title>Practice Island • Global Readings Adventure (Chapters 1 &amp; 2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/map.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/story.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/games.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/adventure.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/wall.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/shop.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/world.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/chapter1.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/harbour.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/chapter2.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/unity-feel.css?v=rg-20261114d">
  <link rel="stylesheet" href="css/realgame.css?v=w1-20261114b">
  <link rel="stylesheet" href="css/bright.css?v=20261122p">
</head>
<body class="w-page">
  <!-- Practice Island 2D Adventure World (unified entry point). -->
  <header class="isl-topbar" id="isl-topbar"></header>
  <main class="isl-main" id="isl-main"></main>
  <div id="world"></div>

  <!-- Treasure Island HUD (Focused on Chapter 1: Admiral Benbow Harbour) -->
  <div id="w-top">
    <div class="w-hud-left">
      <button type="button" class="w-btn w-icon-btn" id="w-back" aria-label="Sea Chart"><img src="art/flat/o_compass.webp" alt=""><span>Sea Chart</span></button>
      <button type="button" class="w-btn w-status-chip" id="w-status" aria-label="Captain Level & Gold" title="Captain Progress">
        <span class="w-lvl-badge" id="w-lvl-txt">Lv.3</span>
        <span class="w-xp-track"><span class="w-xp-fill" id="w-xp-fill" style="width:35%"></span></span>
        <span class="w-coin-val" id="w-coin-txt">🪙 130</span>
      </button>
      <button type="button" class="w-btn w-energy-chip" id="w-energy" style="display:none"><img src="art/flat/i_energy.webp" alt=""><b id="w-energy-val">100</b></button>
    </div>
    <div id="w-goal"></div>
    <div id="w-tools">
      <a class="w-btn w-tool w-icon-btn" href="index.html?demo=1" onclick="this.href='index.html'+(location.search||'?demo=1')" aria-label="3D Treasure Island" style="text-decoration:none"><span>🌴 3D World</span></a>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-story" aria-label="Story Cutscene"><img src="art/flat/o_map_scroll.webp" alt=""><span>Story</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-sports" style="display:none" aria-label="Crew Sports"><img src="art/flat/o_compass.webp" alt=""><span>Sports</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-dress" style="display:none" aria-label="Costumes"><img src="art/flat/u_dress.webp" alt=""><span>Look</span></button>
      <button type="button" class="w-btn w-tool w-mute-btn" id="w-mute" aria-label="Sound On/Off" title="Sound On/Off">🔊</button>
    </div>
    <div id="w-fps"></div>
  </div>
  <button type="button" class="w-btn" id="w-compass" hidden></button>

  <div id="w-joy"><div id="w-knob"></div></div>

  <!-- Live In-World Talk Panel -->
  <div id="w-talk">
    <img id="w-face" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
    <div id="w-line"></div>
    <button type="button" class="w-btn" id="w-next">OK ▶</button>
  </div>

  <!-- Live In-World Decorator Dock (My Home Island) -->
  <div id="w-decor-dock" aria-label="Live Home Decorator">
    <div class="w-dd-head">
      <div class="w-dd-title">🪑 Live Yard &amp; Veranda Decorator <small id="w-dd-hint">Tap an item below or on the ground, then tap where to place it!</small></div>
      <div class="w-dd-actions">
        <button type="button" class="w-btn w-dd-btn cyan" id="w-dd-flip" onclick="WORLD.flipDecor()">↔ Flip</button>
        <button type="button" class="w-btn w-dd-btn amber" id="w-dd-craft" onclick="WorldGame.openWorkshop('craft')">🔨 Craft More</button>
        <button type="button" class="w-btn w-dd-btn coral" id="w-dd-store" onclick="WORLD.putAwayDecor()">📥 Put in Bag</button>
        <button type="button" class="w-btn w-dd-btn emerald" id="w-dd-done" onclick="WORLD.closeDecorDock()">✓ Done</button>
      </div>
    </div>
    <div class="w-dd-tray" id="w-dd-tray"></div>
  </div>

  <div id="w-bag" style="display:none"></div>
  <div id="w-vignette"></div>
  <div id="w-fade"></div>
  <div id="w-load">⛵ Sailing to Treasure Island...<small id="w-load-small"></small></div>
  <div id="isl-modal-root"></div>
  <div id="bp-turn" aria-live="polite">
    <img src="art/c_benbow_happy.webp" alt="">
    <span class="bp-phone">📱</span>
    <b>Turn your phone sideways — or play right here!</b>
    <small>Landscape gives the widest view of Admiral Benbow Harbour.</small>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      <button type="button" class="uf-btn emerald" style="padding:11px 22px;border-radius:999px;font:800 1rem inherit;cursor:pointer" onclick="document.body.classList.add('bp-allow-portrait')">▶ Play on Phone Now</button>
      <a class="uf-btn cyan" href="../game-maker/index.html" style="padding:11px 18px;border-radius:999px;font:800 .95rem inherit;text-decoration:none">🎮 All Games</a>
    </div>
  </div>


  <!-- Lightweight core boot scripts (heavy engine & content scripts lazy-load on Play!) -->
  <script src="js/config.js?v=rg-20261114e"></script>
  <script src="js/data.js?v=rg-20261114e"></script>
  <script src="js/core/audio.js?v=rg-20261114e"></script>
  <script src="js/audio.js?v=rg-20261114e"></script>
  <script src="js/core/progress.js?v=rg-20261114e"></script>
  <script src="js/core/feedback.js?v=rg-20261114e"></script>
  <script src="js/story.js?v=rg-20261114e"></script>
  <script src="js/sync.js?v=rg-20261114e"></script>
  <script src="js/app.js?v=20261122p"></script>
</body>
</html>
