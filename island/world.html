<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#060911">
  <title>Island World • Practice Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=w1">
  <link rel="stylesheet" href="css/games.css?v=w1">
  <link rel="stylesheet" href="css/adventure.css?v=w1">
  <link rel="stylesheet" href="css/wall.css?v=w1">
  <link rel="stylesheet" href="css/shop.css?v=5">
  <link rel="stylesheet" href="css/world.css?v=8">
</head>
<body class="w-page">
  <!-- The Island's walking world. Missions, stars, XP and saving all go through the normal Island code (js/app.js); this page only adds the world around them. -->
  <header class="isl-topbar" id="isl-topbar"></header>
  <main class="isl-main" id="isl-main"></main>
  <div id="world"></div>
  <div id="w-top">
    <button type="button" class="w-btn w-icon-btn" id="w-back" aria-label="World Map"><img src="art/flat/u_map.webp" alt=""><span>Map</span></button>
    <div id="w-goal"></div>
    <button type="button" class="w-btn w-energy-chip" id="w-energy" aria-label="Monster Energy"><img src="art/flat/i_energy.webp" alt=""><b id="w-energy-val">35</b></button>
    <div id="w-tools">
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-home" aria-label="Home & Workshop"><img src="art/flat/u_build.webp" alt=""><span>Home</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-jobs" aria-label="Villager Jobs"><img src="art/flat/u_jobs.webp" alt=""><span>Jobs</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-wall" aria-label="Class Plaza"><img src="art/flat/u_friends.webp" alt=""><span>Plaza</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-dress" aria-label="Dress up"><img src="art/flat/u_dress.webp" alt=""><span>Look</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-shop" aria-label="Store"><img src="art/flat/u_store.webp" alt=""><span>Store</span></button>
      <button type="button" class="w-btn w-tool" id="w-book" aria-label="Sticker book">📒</button>
    </div>
    <div id="w-fps"></div>
  </div>
  <div id="w-joy"><div id="w-knob"></div></div>
  <div id="w-talk">
    <img id="w-face" src="" alt="">
    <div id="w-line"></div>
    <button type="button" class="w-btn" id="w-next">OK ▶</button>
  </div>
  <div id="w-bag"></div>
  <div id="w-vignette"></div>
  <div id="w-fade"></div>
  <div id="w-load">🏝️ Going to the island...<small id="w-load-small"></small></div>
  <div id="isl-modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=2.3"></script>
  <script src="../js/supabase-client.js?v=3.1"></script>
  <script src="../js/voice.js?v=1"></script>
  <script src="../js/evolution-levels.js?v=1"></script>
  <script src="../js/monster-costumes.js?v=5"></script>
  <script src="../js/monster-costumes2.js?v=3"></script>
  <script src="../js/monster-costumes3.js?v=2"></script>
  <script src="../js/monster-costumes4.js?v=1"></script>
  <script src="../js/monster-pets.js?v=3"></script>
  <script src="../js/monster-renderer.js?v=4.13"></script>
  <script>window.GM = window.GM || {};</script>
  <script src="../bamboozle/data.js?v=1"></script>
  <script src="../unit2-arcade/data.js?v=1"></script>
  <script src="../unit3-data/data.js?v=1"></script>
  <script src="../game-maker/js/data.js?v=4"></script>
  <script src="../game-maker/js/sets-unit4.js?v=1"></script>
  <script src="../game-maker/js/sets-units14.js?v=1"></script>
  <script src="../game-maker/js/bank.js?v=1"></script>
  <script src="js/data.js?v=w4"></script>
  <script src="js/audio.js?v=w1"></script>
  <script src="js/story.js?v=w1"></script>
  <script src="js/games.js?v=w1"></script>
  <script src="js/adventure.js?v=w1"></script>
  <script src="js/wall.js?v=w1"></script>
  <script src="js/rewards.js?v=w1"></script>
  <script src="js/sync.js?v=w2"></script>
  <script src="js/app.js?v=w3"></script>
  <script src="js/shop.js?v=6"></script>
  <script src="lib/phaser.min.js"></script>
  <script src="js/world-game.js?v=1"></script>
  <script src="js/world.js?v=18"></script>
</body>
</html>
