<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#060911">
  <title>Beach World Test • Practice Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --spring: cubic-bezier(.175,.885,.32,1.275); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060911; color: #fff; font-family: Fredoka, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    #world { position: fixed; inset: 0; }
    #world canvas { display: block; }
    .w-btn { font: 700 18px Fredoka, sans-serif; color: #fff; background: #38bdf8; border: 0; border-bottom: 5px solid #0369a1; border-radius: 16px; min-width: 50px; min-height: 50px; padding: 8px 16px; cursor: pointer; transition: transform .12s var(--spring), border-bottom-width .12s; }
    .w-btn:active { transform: translateY(4px); border-bottom-width: 1px; }
    #w-top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 5; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    #w-top > * { pointer-events: auto; }
    #w-back { background: rgba(15,23,42,.9); border-bottom-color: #020617; }
    #w-goal { flex: 0 1 auto; background: rgba(15,23,42,.85); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 16px; padding: 7px 14px; font-weight: 700; font-size: clamp(14px, 2.2vw, 22px); line-height: 1.15; box-shadow: 0 4px 20px -2px rgba(0,0,0,.4); }
    #w-shells { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
    #w-shells img { width: 26px; height: 26px; filter: grayscale(1) brightness(.6); transition: filter .3s, transform .4s var(--spring); }
    #w-shells img.on { filter: none; transform: scale(1.2); }
    #w-fps { margin-left: auto; background: rgba(15,23,42,.85); border-radius: 10px; padding: 4px 9px; font-size: 14px; display: none; }
    #w-joy { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%; background: rgba(15,23,42,.35); border: 3px solid rgba(255,255,255,.55); z-index: 4; display: none; }
    #w-knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #fff, #bae6fd); border-bottom: 4px solid #0369a1; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
    body.touch #w-joy { display: block; }
    #w-talk { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 720px); z-index: 6; display: none; align-items: center; gap: 12px; background: rgba(15,23,42,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 2px solid rgba(255,255,255,.18); border-radius: 22px; padding: 10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: wPop .35s var(--spring); }
    #w-talk.on { display: flex; flex-wrap: wrap; }
    #w-talk > img { width: clamp(58px, 11vw, 96px); height: clamp(58px, 11vw, 96px); object-fit: contain; flex: none; }
    #w-line { flex: 1 1 200px; min-width: 0; font-weight: 600; font-size: clamp(18px, 2.8vw, 27px); line-height: 1.2; }
    #w-line b { display: block; color: #fda4af; font-size: .72em; }
    #w-next { background: #10b981; border-bottom-color: #047857; }
    #w-cards { flex-basis: 100%; display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    #w-cards.on { display: grid; }
    .w-card { display: block; padding: 6px; background: #fff7e6; border: 0; border-bottom: 6px solid #b45309; border-radius: 16px; cursor: pointer; transition: transform .12s var(--spring); }
    .w-card:active { transform: translateY(4px); border-bottom-width: 2px; }
    .w-card img { display: block; width: 100%; aspect-ratio: 1; max-height: 30vh; object-fit: contain; pointer-events: none; }
    .w-card.no { animation: wBoing .5s; }
    @keyframes wPop { from { transform: translateX(-50%) scale(.8); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
    @keyframes wBoing { 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
    #w-load { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(circle at 50% 30%, #0d1527 0%, #060911 100%); font-size: 26px; font-weight: 700; text-align: center; padding: 20px; }
    #w-load small { font-size: 16px; color: #94a3b8; font-weight: 500; }
  </style>
</head>
<body>
  <!-- A test of the walking world. Nothing here reads or changes pupils' data: no cloud scripts are loaded and nothing is saved. -->
  <div id="world"></div>
  <div id="w-top">
    <button type="button" class="w-btn" id="w-back" aria-label="Back to the island">✕</button>
    <div id="w-goal"></div>
    <div id="w-fps"></div>
  </div>
  <div id="w-joy"><div id="w-knob"></div></div>
  <div id="w-talk">
    <img src="art/z2/c_lulu.webp" alt="">
    <div id="w-line"></div>
    <button type="button" class="w-btn" id="w-next">OK ▶</button>
    <div id="w-cards"></div>
  </div>
  <div id="w-load">🏖️ Going to the beach...<small id="w-load-small"></small></div>

  <script src="../js/evolution-levels.js?v=1"></script>
  <script src="../js/monster-costumes.js?v=4"></script>
  <script src="../js/monster-costumes2.js?v=3"></script>
  <script src="../js/monster-costumes3.js?v=2"></script>
  <script src="../js/monster-renderer.js?v=4.12"></script>
  <script src="js/audio.js?v=3"></script>
  <script src="lib/phaser.min.js"></script>
  <script src="js/world.js?v=2"></script>
</body>
</html>
