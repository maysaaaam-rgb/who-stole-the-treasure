<body class="w-page">
  <!-- Practice Island 2D Adventure World (unified entry point). -->
  <header class="isl-topbar" id="isl-topbar"></header>
  <main class="isl-main" id="isl-main"></main>
  <div id="world"></div>

  <!-- Treasure Island HUD (Focused on Chapter 1: Admiral Benbow Harbour) -->
  <div id="w-top">
    <div class="w-hud-left">
      <button type="button" class="w-btn w-icon-btn" id="w-back" aria-label="Sea Chart"><img src="art/flat/o_compass.webp" alt=""><span>Sea Chart</span></button>
      <button type="button" class="w-btn w-status-chip" id="w-status" aria-label="Captain Level & Gold" title="Captain Progress">
        <span class="w-lvl-badge" id="w-lvl-txt">Lv.3</span>
        <span class="w-xp-track"><span class="w-xp-fill" id="w-xp-fill" style="width:35%"></span></span>
        <span class="w-coin-val" id="w-coin-txt">🪙 130</span>
      </button>
      <button type="button" class="w-btn w-energy-chip" id="w-energy" style="display:none"><img src="art/flat/i_energy.webp" alt=""><b id="w-energy-val">100</b></button>
    </div>
    <div id="w-goal"></div>
    <div id="w-tools">
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-story" aria-label="Story Cutscene"><img src="art/flat/o_map_scroll.webp" alt=""><span>Story</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-sports" style="display:none" aria-label="Crew Sports"><img src="art/flat/o_compass.webp" alt=""><span>Sports</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-dress" style="display:none" aria-label="Costumes"><img src="art/flat/u_dress.webp" alt=""><span>Look</span></button>
      <button type="button" class="w-btn w-tool w-mute-btn" id="w-mute" aria-label="Sound On/Off" title="Sound On/Off">🔊</button>
    </div>
    <div id="w-fps"></div>
  </div>
  <button type="button" class="w-btn" id="w-compass" hidden></button>

  <div id="w-joy"><div id="w-knob"></div></div>

  <!-- Live In-World Talk Panel -->
  <div id="w-talk">
    <img id="w-face" src="" alt="">
    <div id="w-line"></div>
    <button type="button" class="w-btn" id="w-next">OK ▶</button>
  </div>

  <!-- Live In-World Decorator Dock (My Home Island) -->
  <div id="w-decor-dock" aria-label="Live Home Decorator">
    <div class="w-dd-head">
      <div class="w-dd-title">🪑 Live Yard &amp; Veranda Decorator <small id="w-dd-hint">Tap an item below or on the ground, then tap where to place it!</small></div>
      <div class="w-dd-actions">
        <button type="button" class="w-btn w-dd-btn cyan" id="w-dd-flip" onclick="WORLD.flipDecor()">↔ Flip</button>
        <button type="button" class="w-btn w-dd-btn amber" id="w-dd-craft" onclick="WorldGame.openWorkshop('craft')">🔨 Craft More</button>
        <button type="button" class="w-btn w-dd-btn coral" id="w-dd-store" onclick="WORLD.putAwayDecor()">📥 Put in Bag</button>
        <button type="button" class="w-btn w-dd-btn emerald" id="w-dd-done" onclick="WORLD.closeDecorDock()">✓ Done</button>
      </div>
    </div>
    <div class="w-dd-tray" id="w-dd-tray"></div>
  </div>

  <div id="w-bag" style="display:none"></div>
  <div id="w-vignette"></div>
  <div id="w-fade"></div>
  <div id="w-load">⛵ Sailing to Treasure Island...<small id="w-load-small"></small></div>
  <div id="isl-modal-root"></div>
