<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#060911">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Practice Island • English Adventure Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=w3">
  <link rel="stylesheet" href="css/games.css?v=w3">
  <link rel="stylesheet" href="css/adventure.css?v=w3">
  <link rel="stylesheet" href="css/wall.css?v=w3">
  <link rel="stylesheet" href="css/shop.css?v=7">
  <link rel="stylesheet" href="css/world.css?v=22">
</head>
<body class="w-page">
  <!-- Practice Island 2D Adventure World (unified entry point). -->
  <header class="isl-topbar" id="isl-topbar"></header>
  <main class="isl-main" id="isl-main"></main>
  <div id="world"></div>

  <!-- Clean 3-Point Game HUD -->
  <div id="w-top">
    <div class="w-hud-left">
      <button type="button" class="w-btn w-icon-btn" id="w-back" aria-label="World Map"><img src="art/flat/u_map.webp" alt=""><span>Map</span></button>
      <button type="button" class="w-btn w-energy-chip" id="w-energy" aria-label="Monster Energy" title="Tap to charge +30 Energy!"><img src="art/flat/i_energy.webp" alt=""><b id="w-energy-val">35</b></button>
    </div>
    <div id="w-goal"></div>
    <div id="w-tools">
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-home" aria-label="Home & Workshop"><img src="art/flat/u_build.webp" alt=""><span>Home</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-decor" aria-label="Decorate Yard" style="display:none"><img src="art/flat/o_workbench.webp" alt=""><span>Decorate</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-jobs" aria-label="Villager Quests"><img src="art/flat/u_jobs.webp" alt=""><span>Quests</span><em class="w-badge" id="w-jobs-badge" hidden>0</em></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-dress" aria-label="Dress up"><img src="art/flat/u_dress.webp" alt=""><span>Look</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-shop" aria-label="Store"><img src="art/flat/u_store.webp" alt=""><span>Store</span></button>
      <button type="button" class="w-btn w-tool w-icon-btn" id="w-wall" aria-label="Class Plaza"><img src="art/flat/u_friends.webp" alt=""><span>Plaza</span></button>
    </div>
    <div id="w-fps"></div>
  </div>

  <div id="w-joy"><div id="w-knob"></div></div>

  <!-- Live In-World Talk Panel -->
  <div id="w-talk">
    <img id="w-face" src="" alt="">
    <div id="w-line"></div>
    <button type="button" class="w-btn" id="w-next">OK ▶</button>
  </div>

  <!-- Live In-World Decorator Dock (My Home Island) -->
  <div id="w-decor-dock" aria-label="Live Home Decorator">
    <div class="w-dd-head">
      <div class="w-dd-title">🪑 Live Yard &amp; Veranda Decorator <small id="w-dd-hint">Tap an item below or on the ground, then tap where to place it!</small></div>
      <div class="w-dd-actions">
        <button type="button" class="w-btn w-dd-btn cyan" id="w-dd-flip" onclick="WORLD.flipDecor()">↔ Flip</button>
        <button type="button" class="w-btn w-dd-btn amber" id="w-dd-craft" onclick="WorldGame.openWorkshop('craft')">🔨 Craft More</button>
        <button type="button" class="w-btn w-dd-btn coral" id="w-dd-store" onclick="WORLD.putAwayDecor()">📥 Put in Bag</button>
        <button type="button" class="w-btn w-dd-btn emerald" id="w-dd-done" onclick="WORLD.closeDecorDock()">✓ Done</button>
      </div>
    </div>
    <div class="w-dd-tray" id="w-dd-tray"></div>
  </div>

  <div id="w-bag"></div>
  <div id="w-vignette"></div>
  <div id="w-fade"></div>
  <div id="w-load">🏝️ Going to the island...<small id="w-load-small"></small></div>
  <div id="isl-modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=2.3"></script>
  <script src="../js/supabase-client.js?v=3.1"></script>
  <script src="../js/voice.js?v=1"></script>
  <script src="../js/evolution-levels.js?v=1"></script>
  <script src="../js/monster-costumes.js?v=5"></script>
  <script src="../js/monster-costumes2.js?v=3"></script>
  <script src="../js/monster-costumes3.js?v=2"></script>
  <script src="../js/monster-costumes4.js?v=1"></script>
  <script src="../js/monster-pets.js?v=3"></script>
  <script src="../js/monster-renderer.js?v=4.13"></script>
  <script>window.GM = window.GM || {};</script>
  <script src="../bamboozle/data.js?v=1"></script>
  <script src="../unit2-arcade/data.js?v=1"></script>
  <script src="../unit3-data/data.js?v=1"></script>
  <script src="../game-maker/js/data.js?v=4"></script>
  <script src="../game-maker/js/sets-unit4.js?v=1"></script>
  <script src="../game-maker/js/sets-units14.js?v=1"></script>
  <script src="../game-maker/js/bank.js?v=1"></script>
  <script src="js/data.js?v=w5"></script>
  <script src="js/audio.js?v=w1"></script>
  <script src="js/story.js?v=w1"></script>
  <script src="js/games.js?v=w1"></script>
  <script src="js/adventure.js?v=w1"></script>
  <script src="js/wall.js?v=w3"></script>
  <script src="js/rewards.js?v=w1"></script>
  <script src="js/sync.js?v=w3"></script>
  <script src="js/app.js?v=w4"></script>
  <script src="js/shop.js?v=6"></script>
  <script src="lib/phaser.min.js"></script>
  <script src="js/world-game.js?v=22"></script>
  <script src="js/world.js?v=22"></script>
</body>
</html>
