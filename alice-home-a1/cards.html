<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Party Cards – print (A5, double-sided)</title>
<style>
  @page { size: A5 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #1e293b; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; color: #1c1917; }

  /* ---------- screen toolbar (hidden when printing) ---------- */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
         padding: 10px 16px; background: #0f172a; color: #f8fafc; border-bottom: 1px solid #334155; }
  .bar button { font: inherit; font-weight: 800; padding: 10px 18px; border: 0; border-bottom: 4px solid #b45309; border-radius: 12px; background: #f59e0b; color: #1c1203; cursor: pointer; }
  .bar span { font-size: 14px; color: #cbd5e1; }
  .sheets { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 24px 12px 48px; }

  /* ---------- one A5 page ---------- */
  .page { width: 148mm; height: 210mm; background: #fffaf0; position: relative; overflow: hidden;
          border: 0; box-shadow: 0 8px 30px rgba(0,0,0,.5); page-break-after: always; break-after: page; }
  .frame { position: absolute; inset: 6mm; border: 1.2mm solid var(--c); border-radius: 5mm; padding: 4mm; display: flex; flex-direction: column; }
  .frame::after { content: ""; position: absolute; inset: 1.4mm; border: .3mm solid var(--c); border-radius: 3.6mm; pointer-events: none; }

  /* ---------- FRONT ---------- */
  .tag { text-align: center; font-weight: 800; letter-spacing: .12em; font-size: 10pt; color: var(--c); margin: 0 0 2mm; }
  .pic { flex: none; height: 108mm; border-radius: 3mm; overflow: hidden; border: .5mm solid var(--c); background: #ddd; }
  .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .name { text-align: center; font-weight: 900; font-size: 26pt; line-height: 1.05; margin: 3mm 0 1mm; color: var(--c); }
  .sents { list-style: none; padding: 0; margin: 1mm 0 0; text-align: center; }
  .sents li { font-size: 17pt; font-weight: 800; line-height: 1.35; }
  .words { margin-top: auto; display: flex; justify-content: space-between; gap: 1mm; padding-top: 2mm; border-top: .4mm dashed var(--c); }
  .words div { text-align: center; font-size: 8.5pt; font-weight: 700; flex: 1; }
  .words b { display: block; font-size: 18pt; line-height: 1.1; }

  /* ---------- BACK ---------- */
  .head { text-align: center; margin-bottom: 2mm; }
  .head .t { font-weight: 900; font-size: 17pt; color: var(--c); }
  .head .s { font-size: 10pt; font-weight: 700; color: #57534e; }
  .script { display: grid; gap: 1.6mm; }
  .ln { padding: 1.6mm 3mm; border-radius: 2.5mm; font-size: 12.5pt; line-height: 1.25; }
  .ln small { display: block; font-size: 8pt; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .ln.them { background: #f5f5f4; color: #57534e; border: .3mm solid #d6d3d1; }
  .ln.me { background: #fff; color: #111; font-weight: 800; border: .7mm solid var(--c); font-size: 13.5pt; }
  .ln.me small { color: var(--c); }
  .box { margin-top: 2.5mm; border: .4mm solid var(--c); border-radius: 3mm; padding: 2mm 3mm; font-size: 10.5pt; line-height: 1.3; }
  .box h4 { margin: 0 0 1mm; font-size: 9pt; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
  .box .qa b { font-weight: 800; }
  .practice { margin-top: auto; text-align: center; font-size: 10.5pt; font-weight: 800; }
  .practice span { font-size: 17pt; letter-spacing: 1.5mm; vertical-align: middle; }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheets { display: block; padding: 0; }
    .page { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <button onclick="window.print()">🖨️ Print</button>
  <span><b>Print settings:</b> A5 · both sides (duplex) · flip on the <b>long edge</b> · scale 100% · turn on “background graphics”. Page 1 = front, page 2 = back.</span>
</div>
<div class="sheets" id="sheets"></div>

<script src="party-data.js"></script>
<script>
(function () {
  var P = window.PARTY;
  var want = (new URLSearchParams(location.search).get('c') || Object.keys(P.characters).join(',')).split(',');
  var out = [];
  want.forEach(function (id) {
    var c = P.characters[id.trim()]; if (!c) return;
    var partner = P.characters[c.partner], script = P.dialogues[c.pair];

    out.push(
      '<section class="page" style="--c:' + c.color + '"><div class="frame">' +
        '<div class="tag">TEA PARTY CARD</div>' +
        '<div class="pic"><img src="' + c.image + '" alt=""></div>' +
        '<div class="name">' + c.name + '</div>' +
        '<ul class="sents">' + c.sentences.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>' +
        '<div class="words">' + c.words.map(function (w) { return '<div><b>' + w.p + '</b>' + w.w + '</div>'; }).join('') + '</div>' +
      '</div></section>'
    );

    out.push(
      '<section class="page" style="--c:' + c.color + '"><div class="frame">' +
        '<div class="head"><div class="t">' + c.name + ' · MY TEA PARTY</div>' +
        '<div class="s">My partner: ' + partner.name + ' · Practise! Then talk for 1 minute.</div></div>' +
        '<div class="script">' + script.map(function (l) {
          var me = l.who === c.id;
          return '<div class="ln ' + (me ? 'me' : 'them') + '"><small>' + (me ? '✋ I say' : '👂 ' + partner.short + ' says') + '</small>' + l.text + '</div>';
        }).join('') + '</div>' +
        '<div class="box"><h4>Ask me! (talk to other students)</h4>' +
          c.askMe.map(function (qa) { return '<div class="qa"><b>' + qa[0] + '</b> → ' + qa[1] + '</div>'; }).join('') + '</div>' +
        '<div class="box"><h4>Bring to the party</h4>' + c.props.join(' · ') + '</div>' +
        '<div class="practice">I practised: <span>☐ ☐ ☐ ☐ ☐</span></div>' +
      '</div></section>'
    );
  });
  document.getElementById('sheets').innerHTML = out.join('');
})();
</script>
</body>
</html>
