<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="podGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="hologramGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tubeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Back Wall -->
  <rect x="0" y="0" width="1920" height="700" fill="url(#wallGrad)"/>

  <!-- High-Tech Wall Grid & Panels -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="380" x2="1920" y2="380"/>
    <line x1="0" y1="520" x2="1920" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="700"/>
    <line x1="640" y1="0" x2="640" y2="700"/>
    <line x1="960" y1="0" x2="960" y2="700"/>
    <line x1="1280" y1="0" x2="1280" y2="700"/>
    <line x1="1600" y1="0" x2="1600" y2="700"/>
  </g>

  <!-- Center Panoramic Window looking out to Pallet Town / Green Hills -->
  <rect x="520" y="80" width="880" height="420" rx="20" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="6"/>
  <g opacity="0.65">
    <rect x="530" y="90" width="860" height="400" rx="16" fill="#67e8f9"/>
    <!-- Sun & Sky -->
    <circle cx="960" cy="180" r="80" fill="#fef08a" opacity="0.8"/>
    <!-- Distant Mountains -->
    <polygon points="530,490 750,260 980,490" fill="#93c5fd"/>
    <polygon points="860,490 1120,280 1390,490" fill="#60a5fa"/>
    <!-- Lush Green Rolling Hills -->
    <path d="M 530 420 Q 750 340 960 410 T 1390 390 L 1390 490 L 530 490 Z" fill="#4ade80"/>
    <path d="M 530 450 Q 820 400 1100 460 T 1390 440 L 1390 490 L 530 490 Z" fill="#22c55e"/>
  </g>
  <!-- Window Pillars -->
  <line x1="820" y1="80" x2="820" y2="500" stroke="#1e293b" stroke-width="12"/>
  <line x1="1100" y1="80" x2="1100" y2="500" stroke="#1e293b" stroke-width="12"/>

  <!-- Left Holographic Specimen Tube -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="120" height="460" rx="30" fill="url(#podGlass)" stroke="#38bdf8" stroke-width="4"/>
    <ellipse cx="60" cy="15" rx="55" ry="12" fill="#64748b"/>
    <ellipse cx="60" cy="445" rx="55" ry="12" fill="#475569"/>
    <!-- Bubbles -->
    <circle cx="45" cy="380" r="8" fill="#a5f3fc" opacity="0.7"/>
    <circle cx="75" cy="320" r="12" fill="#a5f3fc" opacity="0.6"/>
    <circle cx="50" cy="240" r="6" fill="#a5f3fc" opacity="0.7"/>
    <circle cx="70" cy="160" r="10" fill="#a5f3fc" opacity="0.8"/>
    <!-- Energy Core -->
    <line x1="60" y1="40" x2="60" y2="420" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10,15"/>
  </g>

  <!-- Right Holographic Specimen Tube -->
  <g transform="translate(1660, 160)">
    <rect x="0" y="0" width="120" height="460" rx="30" fill="url(#podGlass)" stroke="#38bdf8" stroke-width="4"/>
    <ellipse cx="60" cy="15" rx="55" ry="12" fill="#64748b"/>
    <ellipse cx="60" cy="445" rx="55" ry="12" fill="#475569"/>
    <!-- Bubbles -->
    <circle cx="55" cy="360" r="10" fill="#a5f3fc" opacity="0.7"/>
    <circle cx="70" cy="280" r="7" fill="#a5f3fc" opacity="0.6"/>
    <circle cx="45" cy="190" r="11" fill="#a5f3fc" opacity="0.7"/>
    <line x1="60" y1="40" x2="60" y2="420" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10,15"/>
  </g>

  <!-- High-Tech Laboratory Floor -->
  <polygon points="0,680 1920,680 1920,1080 0,1080" fill="url(#floorGrad)"/>

  <!-- Perspective Floor Grid -->
  <g stroke="#0284c7" stroke-opacity="0.3" stroke-width="2">
    <line x1="0" y1="680" x2="1920" y2="680" stroke-width="4" stroke="#38bdf8"/>
    <line x1="960" y1="680" x2="960" y2="1080"/>
    <line x1="800" y1="680" x2="600" y2="1080"/>
    <line x1="640" y1="680" x2="200" y2="1080"/>
    <line x1="480" y1="680" x2="-200" y2="1080"/>
    <line x1="1120" y1="680" x2="1320" y2="1080"/>
    <line x1="1280" y1="680" x2="1720" y2="1080"/>
    <line x1="1440" y1="680" x2="2120" y2="1080"/>

    <line x1="0" y1="740" x2="1920" y2="740"/>
    <line x1="0" y1="820" x2="1920" y2="820"/>
    <line x1="0" y1="930" x2="1920" y2="930"/>
  </g>

  <!-- Central Battle/Creation Hologram Ring on Floor -->
  <ellipse cx="960" cy="880" rx="550" ry="160" fill="url(#hologramGlow)"/>
  <ellipse cx="960" cy="880" rx="520" ry="150" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="25,12"/>
  <ellipse cx="960" cy="880" rx="420" ry="120" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <ellipse cx="960" cy="880" rx="280" ry="80" fill="none" stroke="#67e8f9" stroke-width="4"/>
  <ellipse cx="960" cy="880" rx="100" ry="30" fill="#38bdf8" fill-opacity="0.3"/>

  <!-- Futuristic Workbenches on Left and Right -->
  <polygon points="0,640 280,640 360,780 0,820" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="1920,640 1640,640 1560,780 1920,820" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Glowing Pokéball pedestals on consoles -->
  <circle cx="160" cy="625" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <circle cx="220" cy="625" r="16" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1700" cy="625" r="16" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1760" cy="625" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
</svg>
