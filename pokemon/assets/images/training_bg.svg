<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Hill Gradient Far -->
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Hill Gradient Near -->
    <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1920" height="700" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="1600" cy="180" r="90" fill="#fef08a" opacity="0.9"/>
  <circle cx="1600" cy="180" r="130" fill="#fef08a" opacity="0.3"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Cloud 1 -->
    <ellipse cx="320" cy="180" rx="90" ry="40"/>
    <ellipse cx="390" cy="160" rx="70" ry="50"/>
    <ellipse cx="270" cy="190" rx="60" ry="35"/>
    <!-- Cloud 2 -->
    <ellipse cx="980" cy="220" rx="120" ry="50"/>
    <ellipse cx="1060" cy="190" rx="80" ry="60"/>
    <ellipse cx="910" cy="230" rx="70" ry="40"/>
  </g>

  <!-- Distant Mountains -->
  <polygon points="0,520 280,310 580,520" fill="url(#mtnGrad)" opacity="0.7"/>
  <polygon points="420,520 780,260 1150,520" fill="url(#mtnGrad)" opacity="0.8"/>
  <polygon points="1020,520 1380,290 1740,520" fill="url(#mtnGrad)" opacity="0.6"/>

  <!-- Distant Rolling Hills -->
  <path d="M 0 520 Q 480 430 960 500 T 1920 480 L 1920 700 L 0 700 Z" fill="url(#hillFar)"/>

  <!-- Foreground Training Meadow -->
  <path d="M 0 620 Q 560 560 1120 630 T 1920 590 L 1920 1080 L 0 1080 Z" fill="url(#hillNear)"/>

  <!-- Training Ring Track on Meadow -->
  <ellipse cx="960" cy="850" rx="640" ry="180" fill="#16a34a" opacity="0.5"/>
  <ellipse cx="960" cy="850" rx="600" ry="170" fill="none" stroke="#fef08a" stroke-width="8" stroke-dasharray="30,20"/>
  <ellipse cx="960" cy="850" rx="420" ry="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="15,15" opacity="0.7"/>

  <!-- Cheerful Wild Flowers -->
  <circle cx="280" cy="740" r="12" fill="#f43f5e"/>
  <circle cx="280" cy="740" r="5" fill="#fef08a"/>
  <circle cx="340" cy="810" r="14" fill="#38bdf8"/>
  <circle cx="340" cy="810" r="6" fill="#ffffff"/>
  <circle cx="1650" cy="760" r="14" fill="#ec4899"/>
  <circle cx="1650" cy="760" r="6" fill="#fef08a"/>
  <circle cx="1740" cy="830" r="12" fill="#eab308"/>
  <circle cx="1740" cy="830" r="5" fill="#ffffff"/>
</svg>
