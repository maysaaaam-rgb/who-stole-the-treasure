<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="goldRadial" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <radialGradient id="redRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="blueGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#facc15" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#badgeGlow)">
    <!-- Starburst Points Outer Rim -->
    <polygon points="150,15 185,85 260,60 225,130 290,175 215,195 230,270 160,230 110,285 90,210 15,200 65,145 10,85 85,90 100,18" fill="url(#goldRadial)" stroke="#78350f" stroke-width="4"/>

    <!-- Outer Gold Ring -->
    <circle cx="150" cy="150" r="95" fill="url(#goldRadial)" stroke="#a16207" stroke-width="5"/>
    <circle cx="150" cy="150" r="82" fill="#1e293b" stroke="#ca8a04" stroke-width="4"/>

    <!-- Wing Flairs -->
    <path d="M 60 150 C 30 120, 40 80, 80 95 C 65 115, 60 135, 60 150 Z" fill="url(#wingGrad)" stroke="#854d0e" stroke-width="2"/>
    <path d="M 240 150 C 270 120, 260 80, 220 95 C 235 115, 240 135, 240 150 Z" fill="url(#wingGrad)" stroke="#854d0e" stroke-width="2"/>

    <!-- Center Pokéball Emblem -->
    <!-- Top Half (Ruby Red) -->
    <path d="M 80 150 A 70 70 0 0 1 220 150 Z" fill="url(#redRuby)"/>
    <!-- Bottom Half (Pure Pearl White) -->
    <path d="M 80 150 A 70 70 0 0 0 220 150 Z" fill="#f8fafc"/>
    <!-- Center Dividing Band -->
    <rect x="75" y="143" width="150" height="14" fill="#0f172a"/>
    <!-- Center Button Outer Ring -->
    <circle cx="150" cy="150" r="26" fill="#0f172a"/>
    <circle cx="150" cy="150" r="19" fill="#f8fafc"/>
    <circle cx="150" cy="150" r="11" fill="url(#goldRadial)" stroke="#78350f" stroke-width="2"/>

    <!-- Lightning Bolt Crest atop Pokeball -->
    <polygon points="150,75 160,105 148,105 158,130 136,110 148,110" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

    <!-- Sparkle Stars -->
    <polygon points="90,75 93,85 103,88 93,91 90,101 87,91 77,88 87,85" fill="#ffffff"/>
    <polygon points="210,75 213,85 223,88 213,91 210,101 207,91 197,88 207,85" fill="#ffffff"/>
  </g>
</svg>
