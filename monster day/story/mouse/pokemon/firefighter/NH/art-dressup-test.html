<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dress-up test (offline)</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font:600 12px system-ui,sans-serif;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cell{background:linear-gradient(#f3ecff,#e6f0ff);border-radius:14px;padding:6px;color:#223}
.cell .t{text-align:center;margin-top:2px;font-size:11px}
</style></head><body>
<h2 style="margin:0 0 8px">Dress-up test: red/green lines are not drawn here, items are the real pictures</h2>
<div class="grid" id="g"></div>
<script src="js/monster-renderer.js"></script>
<script src="js/monster-anchors.js"></script>
<script src="js/monster-dressup.js"></script>
<script>
var sets = [
  {color:'blue',stage:'baby',equipped:{hat:'hat-crown',glasses:'glasses-round',accessory:'neck-star'}},
  {color:'blue',stage:'adventurer',equipped:{hat:'hat-wizard',accessory:'acc-wand',backpack:'bp-explorer'}},
  {color:'green',stage:'baby',equipped:{hat:'hat-explorer',glasses:'glasses-goggles',clothing:'clothing-scarf'}},
  {color:'green',stage:'advanced',equipped:{hat:'hat-bow',accessory:'neck-medal',clothing:'clothing-cape'}},
  {color:'purple',stage:'baby',equipped:{hat:'hat-scholar',glasses:'glasses-round',clothing:'clothing-vest'}},
  {color:'purple',stage:'growing',equipped:{hat:'hat-flower',accessory:'acc-book',clothing:'clothing-hoodie'}},
  {color:'orange',stage:'baby',equipped:{hat:'hat-headband',glasses:'glasses-goggles',accessory:'neck-pendant'}},
  {color:'orange',stage:'adventurer',equipped:{hat:'hat-star-clip',accessory:'acc-trophy',backpack:'bp-book'}},
  {color:'gold',stage:'baby',equipped:{hat:'hat-crown',glasses:'glasses-round',accessory:'neck-badge'}},
  {color:'gold',stage:'growing',equipped:{hat:'hat-wizard',accessory:'acc-microphone',clothing:'clothing-vest'}},
  {color:'blue',stage:'ultimate',equipped:{glasses:'glasses-round',accessory:'acc-compass',aura:'aura-sparkle',background:'bg-castle'},bg:true},
  {color:'pink',stage:'growing',equipped:{hat:'hat-explorer',backpack:'bp-mini-wings',aura:'aura-rainbow',background:'bg-meadow'},bg:true}
];
document.getElementById('g').innerHTML = sets.map(function(s){
  return '<div class="cell">'+MonsterDressUp.render({color:s.color,stage:s.stage,equipped:s.equipped,size:240,showBackground:!!s.bg,animated:false})+
   '<div class="t">'+s.color+' / '+s.stage+'<br>'+Object.values(s.equipped).join(', ')+'</div></div>';
}).join('');
</script></body></html>
