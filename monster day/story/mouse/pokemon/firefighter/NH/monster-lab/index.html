<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Lab — English Adventure Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/monster-lab.css">
</head>
<body>

<div id="lab-shell">

  <!-- ============================================================
       HEADER
  ============================================================= -->
  <header id="lab-header">
    <div class="lab-logo">
      <span class="lab-logo-icon">🧪</span>
      <div class="lab-logo-text">
        <h1>ENGLISH ADVENTURE — MONSTER LAB</h1>
        <p>CHARACTER DEVELOPMENT ENVIRONMENT · LUMIFOX v1.0</p>
      </div>
    </div>
    <div class="lab-status">
      <span class="lab-status-badge badge-isolated">ISOLATED</span>
      <span class="lab-status-badge badge-safe">ACADEMY UNTOUCHED</span>
    </div>
  </header>

  <!-- ============================================================
       MAIN: Showcase + Customization Panel
  ============================================================= -->
  <div id="lab-main">

    <!-- LEFT — Monster showcase -->
    <section id="showcase-panel">

      <!-- Nameplate -->
      <div id="monster-nameplate">
        <span id="monster-name">Lumifox</span>
        <span id="monster-stage">YOUNG</span>
        <span id="monster-xp-badge">700 XP</span>
      </div>

      <!-- Canvas mount point -->
      <div id="monster-showcase"></div>

      <!-- Animation preview buttons -->
      <div id="anim-preview">
        <h3>🎬 Animation Preview</h3>
        <button class="anim-btn" data-anim="idle">😌 Idle</button>
        <button class="anim-btn" data-anim="happy">😊 Happy</button>
        <button class="anim-btn" data-anim="excited">🤩 Excited</button>
        <button class="anim-btn" data-anim="wave">👋 Wave</button>
        <button class="anim-btn" data-anim="jump">🦘 Jump</button>
        <button class="anim-btn" data-anim="celebrate">🎉 Celebrate</button>
        <button class="anim-btn" data-anim="evolution">⭐ Evolution</button>
      </div>

    </section>

    <!-- RIGHT — Customization panel -->
    <aside id="right-panel">
      <h2>⚙ Customization</h2>
      <div id="customization-panel">
        <!-- Generated by CustomizationPanel.render() -->
      </div>
    </aside>

  </div><!-- /#lab-main -->

  <!-- ============================================================
       BOTTOM: XP Slider + Evolution Timeline
  ============================================================= -->
  <section id="lab-bottom">
    <div id="xp-display">
      <!-- Generated by EvolutionManager.renderXPDisplay() -->
    </div>
    <input
      id="xp-slider"
      type="range"
      min="0"
      max="6000"
      value="700"
      step="10"
      aria-label="XP slider"
    >
    <div id="evo-timeline">
      <!-- Generated by EvolutionManager.renderTimeline() -->
    </div>
  </section>

  <!-- ============================================================
       DEV BAR
  ============================================================= -->
  <section id="dev-bar">
    <h3>🔧 Dev Panel</h3>
    <button id="dev-toggle">Show / Hide State</button>

    <div class="dev-btns">
      <button id="btn-reset"      class="dev-action-btn">🔄 Reset</button>
      <button id="btn-randomize"  class="dev-action-btn">🎲 Randomize</button>
    </div>

    <div id="dev-panel" class="hidden">
      <pre id="dev-state"></pre>
    </div>
  </section>

</div><!-- /#lab-shell -->

<!-- Scripts — load order matters (dependencies first) -->
<script src="js/monster-data.js"></script>
<script src="js/monster-renderer.js"></script>
<script src="js/animation.js"></script>
<script src="js/evolution.js"></script>
<script src="js/customization.js"></script>
<script src="js/app.js"></script>

</body>
</html>
