<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It Keeps Changing · Monster Review</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div id="stage">
    <div class="bg" id="bg"></div>
    <div class="topbar">
      <button class="btn round glass" id="btn-map" type="button" title="Journey map" aria-label="Journey map">🗺️</button>
      <div class="title" id="title">It Keeps Changing · Review</div>
      <div class="stars" id="stars">⭐ 0</div>
      <button class="btn round glass" id="btn-cc" type="button" title="Show or hide the words" aria-label="Words on or off">CC</button>
      <button class="btn round glass" id="btn-sound" type="button" title="Sound on or off" aria-label="Sound on or off">🔊</button>
      <button class="btn round glass" id="btn-full" type="button" title="Full screen" aria-label="Full screen">⛶</button>
    </div>
    <div id="start">
      <div class="card">
        <div class="cast-row" id="cast-row"></div>
        <h1>It Keeps Changing</h1>
        <p>A monster journey through Unit 3</p>
        <button class="btn big" id="go" type="button" style="--c:#10b981;--cd:#047857">▶ Let's go!</button>
      </div>
    </div>
  </div>
  <script src="js/data.js?v=1"></script>
  <script src="js/audio.js?v=1"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
