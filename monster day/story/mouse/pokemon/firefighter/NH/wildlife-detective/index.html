<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Detective: TikTok vs. Nature</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --accent-green: #52b788;
      --sand: #ffb703;
      --alert-red: #e63946;
      --bg-cream: #f8f9fa;
      --card-white: #ffffff;
      --text-dark: #081c15;
      --border-radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; }
    body { background-color: #d8f3dc; color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

    #app {
      background: var(--card-white);
      width: 100%;
      max-width: 900px;
      min-height: 720px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(8, 28, 21, 0.15);
      border: 5px solid var(--primary-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top HUD */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-title { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .hud-stats { display: flex; gap: 18px; font-size: 1.1rem; font-weight: bold; align-items: center; }
    .star-pill { background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; }

    /* Progress bar */
    .progress-bar-container { background: #b7e4c7; height: 10px; width: 100%; }
    .progress-fill { background: var(--sand); height: 100%; width: 25%; transition: width 0.4s ease; }

    /* Main Content Area */
    main { padding: 28px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .stage-header { text-align: center; margin-bottom: 20px; }
    .stage-title { font-size: 1.7rem; color: var(--primary); margin-bottom: 6px; }
    .stage-subtitle { font-size: 1.1rem; color: #40916c; font-weight: 700; }

    /* Media Lounge (Mission 1) */
    .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .video-card { background: #f8faf8; border: 3px solid #b7e4c7; border-radius: var(--border-radius); padding: 14px; text-align: center; }
    .video-card iframe { width: 100%; height: 190px; border-radius: 14px; border: none; }
    .tiktok-link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
    .tiktok-btn {
      background: #ffffff;
      border: 3px solid #95d5b2;
      border-radius: 14px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tiktok-btn:hover { background: #e8f5e9; border-color: var(--primary); transform: translateY(-2px); }

    /* Cards & Grids */
    .card-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .card-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .interactive-card {
      background: #ffffff;
      border: 3px solid #b7e4c7;
      border-radius: var(--border-radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .interactive-card:hover { transform: translateY(-4px); border-color: var(--primary-light); box-shadow: 0 8px 18px rgba(0,0,0,0.06); }
    .interactive-card.selected { border-color: var(--sand); background: #fffdf0; }
    .interactive-card.disabled { opacity: 0.5; pointer-events: none; border-color: #ccc; }
    .card-emoji { font-size: 2.8rem; }
    .card-heading { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .card-text { font-size: 0.95rem; color: #555; }

    /* Minigame 3: Capy Living Room vs Wetland */
    .room-stage {
      background: #fdf0d5;
      border: 4px dashed #c6ac8f;
      border-radius: var(--border-radius);
      padding: 24px;
      text-align: center;
      position: relative;
      transition: background 0.6s ease, border-color 0.6s ease;
    }
    .room-stage.wetland { background: #b7e4c7; border-color: var(--primary); }
    .capy-actor { font-size: 5rem; display: inline-block; transition: transform 0.5s ease; }
    .status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      background: var(--alert-red);
      color: white;
      font-weight: 800;
      border-radius: 30px;
      font-size: 1rem;
    }
    .status-badge.safe { background: var(--primary); }

    /* Action Buttons */
    .btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 34px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      align-self: center;
      margin-top: 20px;
    }
    .btn-main:hover { background: #081c15; transform: scale(1.04); }

    /* Audio Speaker Button */
    .speak-btn {
      background: #e8f5e9;
      border: 2px solid #52b788;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 1rem;
      cursor: pointer;
      margin-left: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Feedback Banner */
    .banner {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      display: none;
    }
    .banner.good { background: #d8f3dc; color: #1b4332; border: 3px solid #74c69d; display: block; }
    .banner.bad { background: #ffe3e3; color: var(--alert-red); border: 3px solid #ffa8a8; display: block; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="hud-title">🐾 Wildlife Detective Academy</div>
    <div class="hud-stats">
      <span>Mission: <span id="mission-indicator">1</span>/4</span>
      <span class="star-pill">⭐ <span id="score">0</span></span>
    </div>
  </header>
  <div class="progress-bar-container">
    <div id="progress" class="progress-fill"></div>
  </div>

  <main id="game-stage"></main>
</div>

<script>
  // Web Audio Sound Generator (No external MP3s needed)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'good') {
      osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'cheer') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.09);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (idx + 1) * 0.12);
        o.start(audioCtx.currentTime + idx * 0.09);
        o.stop(audioCtx.currentTime + (idx + 1) * 0.12);
      });
    }
  }

  // Web Speech Text-to-Speech for A1+ Learners
  function speakSentence(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.85; // deliberate, clear speed for ESL kids
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }

  // Global State
  const state = {
    mission: 1,
    score: 0,
    capyKeysUnlocked: 0
  };

  const stage = document.getElementById('game-stage');
  const missionInd = document.getElementById('mission-indicator');
  const scoreInd = document.getElementById('score');
  const progFill = document.getElementById('progress');

  function addScore(points) {
    state.score += points;
    scoreInd.innerText = state.score;
  }

  function setProgress(pct) {
    progFill.style.width = pct + '%';
  }

  // ==========================================
  // MISSION 1: VIDEO INVESTIGATION LOUNGE (Notes 2 & 3)
  // ==========================================
  function loadMission1() {
    state.mission = 1;
    missionInd.innerText = "1";
    setProgress(25);

    stage.innerHTML = `
      <div class="stage-header">
        <h2 class="stage-title">Mission 1: Video Investigation Lounge</h2>
        <p class="stage-subtitle">Watch the clips and tap the correct detective truth!</p>
      </div>

      <div class="media-grid">
        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/xKSdsIEMvmo" allowfullscreen></iframe>
          <p style="margin: 8px 0; font-weight: bold;">Can Capy Live in a Flat?</p>
          <button class="tiktok-btn" onclick="checkM1('chew')">📺 It chews the sofa!</button>
          <button class="tiktok-btn" onclick="checkM1('quiet')">📺 It sleeps quietly in bed</button>
        </div>

        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/koEK7cabn2s" allowfullscreen></iframe>
          <p style="margin: 8px 0; font-weight: bold;">Wild Wetlands of Brazil</p>
          <button class="tiktok-btn" onclick="checkM1('wild')">🌿 It swims in a wild herd!</button>
          <button class="tiktok-btn" onclick="checkM1('alone')">🌿 It lives alone in a cage</button>
        </div>
      </div>

      <div style="margin-top: 15px; text-align: center;">
        <p style="font-weight: 800; color: var(--primary-light);">Tap to view the 4 TikTok Evidence Clips:</p>
        <div class="tiktok-link-grid">
          <a class="tiktok-btn" href="https://www.tiktok.com/@unrealcapy/video/7623963592139803925" target="_blank">🎬 1. AI Cartoon Capy</a>
          <a class="tiktok-btn" href="https://www.tiktok.com/@bellebuys/video/7660873127269797142" target="_blank">💡 2. Axolotl Nightlight</a>
          <a class="tiktok-btn" href="https://www.tiktok.com/@zoolotse/video/7677693192040467745" target="_blank">🩺 3. Dortmund Zoo Check</a>
          <a class="tiktok-btn" href="https://www.tiktok.com/@of.lovepp/video/7457089572070001951" target="_blank">🦙 4. Capy & Alpacas</a>
        </div>
      </div>

      <div id="m1-banner" class="banner"></div>
    `;
  }

  let m1Done = { chew: false, wild: false };
  function checkM1(choice) {
    const banner = document.getElementById('m1-banner');
    if (choice === 'chew') {
      m1Done.chew = true;
      playSound('good');
      speakSentence("Correct! Its front teeth chew the furniture!");
      banner.className = "banner good";
      banner.innerText = "⭐ Yes! The 60kg rodent chews wooden doors and sofas!";
      addScore(10);
    } else if (choice === 'wild') {
      m1Done.wild = true;
      playSound('good');
      speakSentence("Correct! Wild capybaras live in herds of 20!");
      banner.className = "banner good";
      banner.innerText = "⭐ Great! Wild capybaras need open rivers and friends!";
      addScore(10);
    } else {
      playSound('wrong');
      speakSentence("Try again, detective!");
      banner.className = "banner bad";
      banner.innerText = "❌ Incorrect! Check the video clues again!";
    }

    if (m1Done.chew && m1Done.wild) {
      setTimeout(loadMission2, 1800);
    }
  }

  // ==========================================
  // MISSION 2: THE 5 ANIMAL CARE MATCHER (Note 1)
  // ==========================================
  const animalNeeds = [
    { name: "Axolotl", emoji: "🦎", need: "Cold, clean water filter in Mexico", match: "water" },
    { name: "Bearded Dragon", emoji: "🐲", need: "UV sun lamp & live crickets", match: "lamp" },
    { name: "Ball Python", emoji: "🐍", need: "Warm, humid tank & frozen mice", match: "heat" },
    { name: "Black Widow", emoji: "🕷️", need: "Nature web (Dangerous venom!)", match: "wild" },
    { name: "Capybara", emoji: "🦫", need: "Big river pool & a herd of friends", match: "river" }
  ];

  function loadMission2() {
    state.mission = 2;
    missionInd.innerText = "2";
    setProgress(50);

    stage.innerHTML = `
      <div class="stage-header">
        <h2 class="stage-title">Mission 2: The Care Matcher</h2>
        <p class="stage-subtitle">What does the animal REALLY need? Tap the right habitat!</p>
      </div>

      <div style="text-align: center; margin-bottom: 12px;">
        <span style="font-size: 1.3rem; font-weight: 800; color: var(--primary);" id="target-animal-name">
          🦎 Axolotl
        </span>
        <button class="speak-btn" onclick="speakCurrentTarget()">🔊</button>
      </div>

      <div class="card-grid-3" id="care-grid">
        <div class="interactive-card" onclick="checkM2('lamp', this)">
          <div class="card-emoji">☀️</div>
          <div class="card-heading">UV Sun Lamp</div>
          <div class="card-text">Desert warmth & bugs</div>
        </div>
        <div class="interactive-card" onclick="checkM2('water', this)">
          <div class="card-emoji">❄️💧</div>
          <div class="card-heading">Cold Clean Water</div>
          <div class="card-text">Mexican lake habitat</div>
        </div>
        <div class="interactive-card" onclick="checkM2('river', this)">
          <div class="card-emoji">🌊🦙</div>
          <div class="card-heading">River & Big Herd</div>
          <div class="card-text">Needs 10-20 friends</div>
        </div>
      </div>

      <div id="m2-banner" class="banner"></div>
    `;
  }

  function speakCurrentTarget() {
    speakSentence("An axolotl is critically endangered in Mexico. What does it need?");
  }

  function checkM2(ans, el) {
    const banner = document.getElementById('m2-banner');
    if (ans === 'water') {
      playSound('good');
      el.classList.add('selected');
      banner.className = "banner good";
      banner.innerText = "🎉 Match! Axolotls need cold, clean water filters, not a bedroom tank!";
      speakSentence("Axolotls need cold clean water!");
      addScore(15);
      setTimeout(loadMission3, 1800);
    } else {
      playSound('wrong');
      banner.className = "banner bad";
      banner.innerText = "❌ Incorrect! That belongs to a different animal.";
    }
  }

  // ==========================================
  // MISSION 3: SCREEN VS. REALITY (Note 2)
  // ==========================================
  function loadMission3() {
    state.mission = 3;
    missionInd.innerText = "3";
    setProgress(75);

    stage.innerHTML = `
      <div class="stage-header">
        <h2 class="stage-title">Mission 3: Screen vs. Reality</h2>
        <p class="stage-subtitle">You saw a Capybara with 6.8 Billion views on TikTok. What is your decision?</p>
      </div>

      <div class="card-grid-3">
        <div class="interactive-card" onclick="checkM3('buy')">
          <div class="card-emoji">📦🏠</div>
          <div class="card-heading">Buy It Online</div>
          <div class="card-text">Put it in your flat bedroom</div>
        </div>
        <div class="interactive-card" onclick="checkM3('toy')">
          <div class="card-emoji">💡✨</div>
          <div class="card-heading">Buy the Nightlight</div>
          <div class="card-text">Cute glowing toy! No furniture chewed!</div>
        </div>
        <div class="interactive-card" onclick="checkM3('cage')">
          <div class="card-emoji">🪤❌</div>
          <div class="card-heading">Put It in a Cage</div>
          <div class="card-text">Keep it like a little hamster</div>
        </div>
      </div>

      <div id="m3-banner" class="banner"></div>
    `;
  }

  function checkM3(ans) {
    const banner = document.getElementById('m3-banner');
    if (ans === 'toy') {
      playSound('good');
      banner.className = "banner good";
      banner.innerText = "⭐ Perfect Wildlife Detective choice! Enjoy the toy, leave the animal in the wild!";
      speakSentence("Buy the glowing nightlight! Keep the wild animal in nature!");
      addScore(20);
      setTimeout(loadMission4, 1800);
    } else {
      playSound('wrong');
      banner.className = "banner bad";
      banner.innerText = "❌ Uh oh! An adult capybara is 50 kilos and needs a river! It breaks cages and chews beds.";
      speakSentence("No! A capybara is a 50 kilo giant rodent!");
    }
  }

  // ==========================================
  // MISSION 4: CAPY'S LIVING ROOM ESCAPE (Note 3)
  // ==========================================
  function loadMission4() {
    state.mission = 4;
    missionInd.innerText = "4";
    setProgress(95);

    stage.innerHTML = `
      <div class="stage-header">
        <h2 class="stage-title">Mission 4: Send Capy to the Wetland!</h2>
        <p class="stage-subtitle">Unlock 3 wild adaptations to teleport Capy from the destroyed sofa back to Brazil!</p>
      </div>

      <div class="room-stage" id="escape-room">
        <div id="capy-sprite" class="capy-actor">🦫🛋️</div>
        <div><span id="room-tag" class="status-badge">Living Room Alert: Chewing Wooden Chairs!</span></div>
      </div>

      <div class="card-grid-3" style="margin-top: 18px;">
        <button class="interactive-card" id="adapt-1" onclick="unlockCapy(1, 'Snorkel Face', '👀👃')">
          <div class="card-emoji">👀</div>
          <div class="card-heading">Snorkel Face</div>
          <div class="card-text">Eyes & nose on top of head</div>
        </button>

        <button class="interactive-card" id="adapt-2" onclick="unlockCapy(2, 'Webbed Feet', '🐾🌊')">
          <div class="card-emoji">🐾</div>
          <div class="card-heading">Webbed Feet</div>
          <div class="card-text">Paddles to escape jaguars</div>
        </button>

        <button class="interactive-card" id="adapt-3" onclick="unlockCapy(3, 'Herd of 20', '🌿🦙')">
          <div class="card-emoji">👥</div>
          <div class="card-heading">Herd Life</div>
          <div class="card-text">Pups protected together</div>
        </button>
      </div>

      <div id="m4-banner" class="banner"></div>
    `;
  }

  const unlocked = [false, false, false];
  function unlockCapy(index, name, emojiIcon) {
    if (unlocked[index - 1]) return;
    unlocked[index - 1] = true;
    playSound('good');

    const btn = document.getElementById(`adapt-${index}`);
    btn.classList.add('disabled');

    state.capyKeysUnlocked++;
    addScore(15);
    speakSentence(`Unlocked adaptation: ${name}!`);

    const banner = document.getElementById('m4-banner');
    banner.className = "banner good";
    banner.innerText = `✨ Unlocked: ${name}!`;

    if (state.capyKeysUnlocked === 1) {
      document.getElementById('capy-sprite').innerText = "🦫💧";
      document.getElementById('room-tag').innerText = "Diving into water!";
    } else if (state.capyKeysUnlocked === 2) {
      document.getElementById('capy-sprite').innerText = "🦫🏊‍♂️";
      document.getElementById('room-tag').innerText = "Paddling with webbed feet!";
    } else if (state.capyKeysUnlocked === 3) {
      playSound('cheer');
      document.getElementById('escape-room').classList.add('wetland');
      document.getElementById('capy-sprite').innerText = "🌊🦫🦫🌴";
      const tag = document.getElementById('room-tag');
      tag.className = "status-badge safe";
      tag.innerText = "Safe in the Pantanal Wetlands!";
      banner.innerText = "🏆 Victory! The capybara is happy in its wild home!";
      speakSentence("Victory! The capybara is safe in its wild wetland home!");
      setTimeout(showCertificate, 2200);
    }
  }

  // ==========================================
  // STAGE 5: RANGER CERTIFICATE SCREEN
  // ==========================================
  function showCertificate() {
    setProgress(100);
    stage.innerHTML = `
      <div class="stage-header">
        <h2 class="stage-title">🏆 Graduation Day!</h2>
        <p class="stage-subtitle">You are now a Certified Junior Wildlife Ranger!</p>
      </div>

      <div style="border: 6px double var(--primary); padding: 30px; border-radius: 20px; text-align: center; background: #fffdf5;">
        <div style="font-size: 4rem;">🎖️🦫</div>
        <h1 style="color: var(--primary); margin: 10px 0;">Official Ranger Certificate</h1>
        <p style="font-size: 1.2rem; color: #2d6a4f; margin-bottom: 15px;">
          Awarded for protecting exotic animals and seeing through TikTok trends!
        </p>
        <p style="font-size: 1.3rem; font-weight: 800; color: var(--sand);">
          Total Detective Score: ${state.score} Points
        </p>
        <div style="margin: 20px 0; font-size: 1.1rem; line-height: 1.6; color: #333;">
          <i>"I promise to leave wild animals in nature,<br>
          respect their five welfare needs,<br>
          and buy the toy nightlight instead!"</i>
        </div>
        <button class="btn-main" onclick="loadMission1()">Play Again 🔄</button>
      </div>
    `;
  }

  // Launch initial game
  loadMission1();
</script>
</body>
</html>
