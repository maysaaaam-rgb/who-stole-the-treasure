<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Detective: TikTok vs. Nature</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-arena">
    <header>
      <div class="title-shield">🐾 Wildlife Detective</div>
      <div class="meter-container">
        <div class="meter-label-row">
          <span>Wild Energy</span>
          <span id="meter-perc">20%</span>
        </div>
        <div class="meter-track">
          <div id="meter-fill" class="meter-fill"></div>
        </div>
      </div>
      <div class="xp-counter">
        <span>⭐</span>
        <span id="score-val">0</span>
        <span style="font-size:0.75rem; color:#fff;">XP</span>
      </div>
    </header>
    <main id="stage"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
