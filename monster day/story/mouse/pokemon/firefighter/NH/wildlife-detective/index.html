<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Detective: TikTok vs. Nature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07130c;
      --panel-bg: rgba(13, 31, 21, 0.92);
      --border: #1e4530;
      --primary: #10b981;
      --primary-dark: #047857;
      --accent: #f59e0b;
      --accent-dark: #b45309;
      --cyan: #38bdf8;
      --danger: #ef4444;
      --danger-dark: #b91c1c;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 10%, #0d2b1a 0%, var(--bg-dark) 85%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #game-arena {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 2px solid var(--border);
      border-radius: 28px;
      width: 100%;
      max-width: 920px;
      min-height: 640px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      padding: 16px 24px;
      background: rgba(7, 19, 12, 0.7);
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .badge-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meter-container {
      flex: 1;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .meter-track {
      background: #08150f;
      height: 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .meter-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--cyan), var(--primary));
      transition: width 0.3s ease;
    }

    .xp-counter {
      background: #11291b;
      border: 1px solid #1f5035;
      padding: 8px 16px;
      border-radius: 50px;
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    main#stage {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-prompt { text-align: center; margin-bottom: 20px; max-width: 700px; }
    .stage-prompt h2 { font-family: 'Fredoka', cursive; font-size: 2rem; color: #fff; margin-bottom: 4px; }
    .stage-prompt p { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .stage-prompt .pill-rule {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary);
      color: #34d399;
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* 3D Tactile Buttons */
    .btn-3d {
      border: none;
      font-family: 'Fredoka', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 14px 24px;
      border-radius: 16px;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn-green { background: var(--primary); box-shadow: 0 5px 0 var(--primary-dark); }
    .btn-green:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--primary-dark); }
    .btn-green:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }
    .btn-coral { background: var(--danger); box-shadow: 0 5px 0 var(--danger-dark); }
    .btn-coral:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--danger-dark); }
    .btn-coral:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--danger-dark); }
    .btn-amber { background: var(--accent); box-shadow: 0 5px 0 var(--accent-dark); color: #1a1303; }
    .btn-amber:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent-dark); }
    .btn-amber:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }

    /* Mission 1: 5-Animal Care Swiper */
    .care-swiper-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 650px;
    }
    .animal-showcase-card {
      background: #0d2116;
      border: 3px solid var(--border);
      border-radius: 24px;
      width: 100%;
      padding: 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .animal-art { font-size: 4.5rem; background: #07150e; border: 2px solid var(--border); border-radius: 20px; padding: 10px 20px; }
    .animal-info h3 { font-family: 'Fredoka', cursive; font-size: 1.6rem; color: #fff; margin-bottom: 4px; }
    .animal-info p { color: var(--muted); font-size: 0.95rem; font-weight: 600; line-height: 1.4; }
    .needs-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .need-btn {
      background: #0d261a;
      border: 2px solid var(--border);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .need-btn:hover { border-color: var(--cyan); transform: translateY(-2px); background: #133524; }

    /* Mission 2: TikTok Feed Phone */
    .phone-stage {
      width: 100%;
      max-width: 480px;
      background: #030805;
      border: 4px solid #1f3828;
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .tiktok-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; color: #64748b; }
    .tiktok-video {
      background: #0a1b12;
      border-radius: 20px;
      border: 2px solid var(--border);
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 16px;
    }
    .tiktok-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tiktok-desc { font-weight: 700; font-size: 0.95rem; margin-top: 8px; color: #e2e8f0; }
    .tiktok-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tiktok-actions button { min-height: 48px; font-size: 0.85rem; }

    /* Mission 3: Living Room Disaster Simulator */
    .room-sim {
      width: 100%;
      max-width: 700px;
      background: #091a11;
      border: 3px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .disaster-viewport {
      background: radial-gradient(circle, #133a24 0%, #05140b 90%);
      border: 2px solid var(--border);
      border-radius: 18px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .disaster-sprite { font-size: 4.5rem; transition: transform 0.4s ease; }
    .crisis-banner {
      position: absolute;
      bottom: 12px;
      background: var(--danger);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    .disaster-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .solve-card {
      background: #0e291b;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s ease;
    }
    .solve-card:hover { border-color: var(--cyan); transform: translateY(-3px); }
    .solve-card.resolved {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.15);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Teleprompter */
    .tele-box {
      width: 100%;
      max-width: 680px;
      background: #07150e;
      border: 2px solid var(--cyan);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-top: 14px;
    }
    .tele-words { font-size: 1.25rem; font-weight: 700; line-height: 1.7; color: #cbd5e1; }
    .tele-words .word { display: inline-block; padding: 2px 5px; border-radius: 6px; }
    .tele-words .word.active { background: var(--accent); color: #1a1303; transform: scale(1.1); box-shadow: 0 0 12px rgba(245, 158, 11, 0.8); }

    .wobble { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<div id="game-arena">
  <header>
    <div class="badge-title">🐾 Wildlife Detective: TikTok vs. Nature</div>
    <div class="meter-container">
      <div class="meter-label">
        <span id="meter-title">Investigation Progress</span>
        <span id="meter-perc">10%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
    </div>
    <div class="xp-counter">
      <span>⭐</span>
      <span id="score-val">0</span>
      <span style="font-size:0.75rem; color:#fff;">XP</span>
    </div>
  </header>

  <main id="stage"></main>
</div>

<script>
// --- PURE WEB AUDIO SYNTHESIZERS ---
class SFX {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  snap() {
    this.init(); if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.frequency.setValueAtTime(900, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  xp() {
    this.init(); if (!this.ctx) return;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.07);
      g.gain.setValueAtTime(0.18, this.ctx.currentTime + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.07 + 0.25);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.07); osc.stop(this.ctx.currentTime + i * 0.07 + 0.25);
    });
  }
  fail() {
    this.init(); if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  }
  fanfare() {
    this.init(); if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.1);
      g.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.1 + 0.35);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.1); osc.stop(this.ctx.currentTime + i * 0.1 + 0.35);
    });
  }
  say(text, cb) {
    if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.05; u.lang = "en-US";
    if (cb) u.onend = cb;
    window.speechSynthesis.speak(u);
  }
}

const sfx = new SFX();

// --- STATE REPOSITORY ---
const state = {
  score: 0,
  m1Index: 0,
  m2Index: 0,
  m3Resolved: new Set()
};

function addXP(n) {
  state.score += n;
  document.getElementById('score-val').innerText = state.score;
}

function updateProgress(p) {
  document.getElementById('meter-fill').style.width = p + "%";
  document.getElementById('meter-perc').innerText = p + "%";
}

// ==========================================
// MISSION 1: 5-ANIMAL CARE SWIPER
// ==========================================
const M1_ANIMALS = [
  {
    name: "Axolotl",
    icon: "🦎",
    habitat: "Lakes in Mexico",
    question: "What does this wild animal need to survive?",
    options: [
      { text: "Cold, clean water & zero heat", correct: true, feedback: "Correct! The axolotl is wild. It needs cold, clean water in Mexican lakes." },
      { text: "A dry sofa with blankets", correct: false, feedback: "No! Axolotls have gills and cannot live on dry sofas." }
    ]
  },
  {
    name: "Bearded Dragon",
    icon: "🐲",
    habitat: "Australian Deserts",
    question: "What does this desert reptile need?",
    options: [
      { text: "Deep ice water to swim", correct: false, feedback: "No! Dragons are desert lizards, not fish." },
      { text: "A hot basking lamp & UV rays", correct: true, feedback: "Correct! A bearded dragon needs a hot lamp to digest its food." }
    ]
  },
  {
    name: "Ball Python",
    icon: "🐍",
    habitat: "African Grasslands",
    question: "What does this shy snake need?",
    options: [
      { text: "A warm, tight dark hideout", correct: true, feedback: "Correct! It cannot live open in a bedroom. It needs a tight, warm burrow." },
      { text: "A noisy bedroom with music", correct: false, feedback: "No! Loud noises cause dangerous stress for wild snakes." }
    ]
  },
  {
    name: "Fennec Fox",
    icon: "🦊",
    habitat: "Sahara Desert Sands",
    question: "What do its giant ears and paws need?",
    options: [
      { text: "A cold tiled apartment floor", correct: false, feedback: "No! Walking on cold tile ruins its digging claws." },
      { text: "Deep sand to dig burrows", correct: true, feedback: "Correct! The fennec fox is wild. It needs deep desert sand to burrow." }
    ]
  },
  {
    name: "Sugar Glider",
    icon: "🐿️",
    habitat: "Australian Tree Canopies",
    question: "What does this tiny marsupial need?",
    options: [
      { text: "A wild colony of 10+ friends", correct: true, feedback: "Correct! Gliders die of loneliness alone in cages. They need a wild colony." },
      { text: "A tiny solitary hamster cage", correct: false, feedback: "No! Solitary cages cause depression. It needs a tree canopy and a group!" }
    ]
  }
];

function renderMission1() {
  updateProgress(10 + state.m1Index * 6);
  const animal = M1_ANIMALS[state.m1Index];
  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 1: The Care Card Swipe</h2>
      <p>Pair all 5 exotic species with their true biological requirements!</p>
      <div class="pill-rule">Animal ${state.m1Index + 1} of 5 • Target: "It needs [requirement]"</div>
    </div>
    <div class="care-swiper-box">
      <div class="animal-showcase-card" id="anim-card">
        <div class="animal-art">${animal.icon}</div>
        <div class="animal-info">
          <h3>${animal.name}</h3>
          <p><b>Natural Habitat:</b> ${animal.habitat}</p>
          <p style="color:#38bdf8; margin-top:4px;">${animal.question}</p>
        </div>
      </div>
      <div class="needs-selector">
        ${animal.options.map((opt, i) => `
          <button class="need-btn" onclick="checkM1Choice(${opt.correct}, '${opt.feedback.replace(/'/g, "\\'")}')">
            <span>🔘</span> ${opt.text}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function checkM1Choice(isCorrect, speech) {
  const card = document.getElementById('anim-card');
  if (isCorrect) {
    sfx.xp();
    addXP(15);
    sfx.say(speech);
    card.style.borderColor = "var(--primary)";
    setTimeout(() => {
      state.m1Index++;
      if (state.m1Index < M1_ANIMALS.length) {
        renderMission1();
      } else {
        sfx.fanfare();
        renderMission2();
      }
    }, 2200);
  } else {
    sfx.fail();
    card.classList.add('wobble');
    sfx.say(speech);
    setTimeout(() => card.classList.remove('wobble'), 500);
  }
}

// ==========================================
// MISSION 2: SCREEN VS. REALITY (4 TIKTOK TYPES)
// ==========================================
const M2_FEED = [
  {
    typeTag: "Viral Trend #1",
    art: "🛋️🦫💥",
    caption: "@petlover: 'Look at my cute new bedroom pet! It can sleep in my bed!'",
    reality: "Living 50kg wild capybara inside an apartment.",
    correctChoice: "report",
    buttonPrompt: "Identify the situation:",
    speech: "Keep it wild! A capybara is a wild animal, not a bedroom pet. It cannot live in an apartment!"
  },
  {
    typeTag: "Viral Trend #2",
    art: "💡✨🦫",
    caption: "@roomdecor: 'This soft capybara nightlight taps on and off! Cozy vibes!'",
    reality: "A silicone LED battery lamp.",
    correctChoice: "buy",
    buttonPrompt: "Identify the situation:",
    speech: "Smart choice! Buy the toy nightlight. It brings cute decor and needs no food or river!"
  },
  {
    typeTag: "Viral Trend #3",
    art: "🩺🦅🩹",
    caption: "@wildliferescue: 'Bandaging an injured hawk's wing before flight release!'",
    reality: "Licensed wildlife sanctuary rehabilitation clinic.",
    correctChoice: "expert",
    buttonPrompt: "Identify the situation:",
    speech: "Approved! That is a licensed zookeeper and wildlife expert helping animals return to nature!"
  },
  {
    typeTag: "Viral Trend #4",
    art: "🤖✨🦦",
    caption: "@ai_magic: 'Look at this purple baby otter drinking a strawberry smoothie!'",
    reality: "Generated AI digital animation.",
    correctChoice: "cartoon",
    buttonPrompt: "Identify the situation:",
    speech: "Detective eye! That is an AI cartoon. It is not real wildlife!"
  }
];

function renderMission2() {
  updateProgress(45 + state.m2Index * 10);
  const post = M2_FEED[state.m2Index];
  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 2: Screen vs. Reality Feed</h2>
      <p>Analyze the viral post! Decide: Is it a Fake Pet, a Toy, an Expert, or a Cartoon?</p>
      <div class="pill-rule">Post ${state.m2Index + 1} of 4 • Media Literacy Detective</div>
    </div>
    <div class="phone-stage" id="phone-box">
      <div class="tiktok-header">
        <span>● LIVE DETECTIVE FEED</span>
        <span>${state.m2Index + 1}/4</span>
      </div>
      <div class="tiktok-video">
        <span class="tiktok-tag">${post.typeTag}</span>
        <div style="font-size:3.5rem;">${post.art}</div>
        <p class="tiktok-desc">${post.caption}</p>
      </div>
      <div class="tiktok-actions">
        <button class="btn-3d btn-green" onclick="checkM2Choice('report')">🚫 Keep It Wild!</button>
        <button class="btn-3d btn-amber" onclick="checkM2Choice('buy')">💡 Buy The Toy!</button>
        <button class="btn-3d btn-green" onclick="checkM2Choice('expert')">🩺 Zoo Expert!</button>
        <button class="btn-3d btn-coral" onclick="checkM2Choice('cartoon')">🎨 AI Cartoon!</button>
      </div>
    </div>
  `;
}

function checkM2Choice(choice) {
  const current = M2_FEED[state.m2Index];
  const box = document.getElementById('phone-box');

  if (choice === current.correctChoice) {
    sfx.xp();
    addXP(20);
    sfx.say(current.speech);
    box.style.borderColor = "var(--primary)";
    setTimeout(() => {
      state.m2Index++;
      if (state.m2Index < M2_FEED.length) {
        renderMission2();
      } else {
        sfx.fanfare();
        renderMission3();
      }
    }, 2400);
  } else {
    sfx.fail();
    box.classList.add('wobble');
    sfx.say("Detective, look closer at the evidence! Try again.");
    setTimeout(() => box.classList.remove('wobble'), 500);
  }
}

// ==========================================
// MISSION 3: LIVING ROOM RESCUE & TELEPROMPTER
// ==========================================
function renderMission3() {
  updateProgress(85);
  document.getElementById('stage').innerHTML = `
    <div class="stage-prompt">
      <h2>Mission 3: The 60kg Hamster Rescue</h2>
      <p>A giant wild capybara is trapped in a living room! Diagnose the 3 biological crises to teleport it to the wetland:</p>
      <div class="pill-rule">Active Crises: Couch chewing • Overflowing bathtub • Solitary crying</div>
    </div>

    <div class="room-sim">
      <div class="disaster-viewport" id="disaster-view">
        <div class="disaster-sprite" id="capy-sprite">🛋️🦫💧</div>
        <div class="crisis-banner" id="crisis-tag">⚠️ CRISIS: Chewing wooden furniture!</div>
      </div>

      <div class="disaster-tools" id="tools-tray">
        <div class="solve-card" id="card-teeth" onclick="resolveCrisis('teeth')">
          <span style="font-size:2rem;">🦷</span>
          <h4 style="margin:6px 0 2px;">Ever-Growing Teeth</h4>
          <p style="font-size:0.75rem; color:#cbd5e1;">It must chew river grass, not chairs!</p>
        </div>
        <div class="solve-card" id="card-snorkel" onclick="resolveCrisis('snorkel')">
          <span style="font-size:2rem;">👀</span>
          <h4 style="margin:6px 0 2px;">Snorkel Face & Toes</h4>
          <p style="font-size:0.75rem; color:#cbd5e1;">Eyes on top & webbed feet need a real wetland!</p>
        </div>
        <div class="solve-card" id="card-herd" onclick="resolveCrisis('herd')">
          <span style="font-size:2rem;">🌿</span>
          <h4 style="margin:6px 0 2px;">Giant Herd Life</h4>
          <p style="font-size:0.75rem; color:#cbd5e1;">It is sad and lonely without 20 companions!</p>
        </div>
      </div>

      <div class="tele-box" id="tele-panel" style="display:none;">
        <div class="tele-words" id="tele-script">
          <span class="word">This</span> <span class="word">is</span> <span class="word">the</span> <span class="word">wild</span> <span class="word">capybara.</span>
          <span class="word">It</span> <span class="word">cannot</span> <span class="word">live</span> <span class="word">in</span> <span class="word">a</span> <span class="word">bedroom</span>
          <span class="word">because</span> <span class="word">its</span> <span class="word">teeth</span> <span class="word">chew</span> <span class="word">and</span> <span class="word">it</span> <span class="word">needs</span> <span class="word">a</span> <span class="word">wetland</span> <span class="word">and</span> <span class="word">a</span> <span class="word">herd!</span>
          <span class="word">Keep</span> <span class="word">it</span> <span class="word">wild!</span>
        </div>
        <button class="btn-3d btn-amber" style="margin-top:14px;" onclick="broadcastRangerReport()">📢 BROADCAST TO CLASSROOM</button>
      </div>
    </div>
  `;
}

function resolveCrisis(type) {
  if (state.m3Resolved.has(type)) return;
  state.m3Resolved.add(type);
  sfx.snap(); sfx.xp(); addXP(20);

  const card = document.getElementById(`card-${type}`);
  card.classList.add('resolved');
  card.innerHTML += `<div style="color:var(--primary); font-weight:800; font-size:0.8rem; margin-top:4px;">RESOLVED ✔</div>`;

  if (type === 'teeth') {
    sfx.say("Its teeth never stop growing! In nature it chews tough river grass. In a bedroom, it chews the table!");
    document.getElementById('crisis-tag').innerText = "⚠️ Bathtub is overflowing with water!";
    document.getElementById('capy-sprite').innerText = "🛁🦫💦";
  } else if (type === 'snorkel') {
    sfx.say("Snorkel face and webbed feet! Its eyes and nose are placed on top to breathe while swimming across rivers!");
    document.getElementById('crisis-tag').innerText = "⚠️ Capybara is crying for companions!";
    document.getElementById('capy-sprite').innerText = "🦫🥺💔";
  } else if (type === 'herd') {
    sfx.say("Herd power! Capybaras need a herd of 20 friends to stay safe from predators.");
  }

  if (state.m3Resolved.size === 3) {
    setTimeout(() => {
      sfx.fanfare();
      updateProgress(100);
      document.getElementById('disaster-view').style.background = "radial-gradient(circle, #065f46 0%, #022c22 90%)";
      document.getElementById('capy-sprite').innerText = "🌴🦫🦫🦫🌊";
      document.getElementById('crisis-tag').innerText = "✔ SAFE IN SOUTH AMERICAN WETLANDS!";
      document.getElementById('crisis-tag').style.background = "var(--primary)";
      document.getElementById('tools-tray').style.display = "none";
      document.getElementById('tele-panel').style.display = "block";
      sfx.say("Teleport success! The capybara has returned to its wetland herd. Time for your official Ranger broadcast!");
    }, 1800);
  }
}

function broadcastRangerReport() {
  const words = document.querySelectorAll('#tele-script .word');
  let idx = 0;
  const fullText = "This is the wild capybara. It cannot live in a bedroom because its teeth chew and it needs a wetland and a herd! Keep it wild!";
  
  sfx.say(fullText, () => {
    words.forEach(w => w.classList.remove('active'));
    sfx.fanfare();
    renderDiploma();
  });

  const timer = setInterval(() => {
    if (idx < words.length) {
      words.forEach(w => w.classList.remove('active'));
      words[idx].classList.add('active');
      idx++;
    } else {
      clearInterval(timer);
    }
  }, 290);
}

function renderDiploma() {
  document.getElementById('stage').innerHTML = `
    <div style="text-align:center; padding:20px; max-width:600px;">
      <div style="font-size:4.5rem; margin-bottom:8px;">🎖️</div>
      <h2 style="font-family:'Fredoka'; font-size:2.3rem; color:var(--primary); margin-bottom:8px;">Junior Wildlife Ranger!</h2>
      <p style="font-size:1.05rem; color:#cbd5e1; margin-bottom:18px; font-weight:600;">
        You analyzed 5 wild species, debunked 4 viral TikTok fads, and safely returned Capy to the South American Pantanal!
      </p>
      <div style="background:#071c11; border:2px dashed var(--border); border-radius:20px; padding:18px; margin-bottom:20px;">
        <h4 style="color:var(--accent); font-family:'Fredoka'; font-size:1.2rem;">OFFICIAL RANGER CODE:</h4>
        <p style="color:#fff; font-weight:700; margin-top:4px;">"Wild animals stay in nature. Buy the toy, keep the wild!"</p>
        <div style="margin-top:10px; font-size:1.15rem; font-weight:800; color:var(--cyan);">Final Score: ${state.score} XP</div>
      </div>
      <button class="btn-3d btn-green" onclick="location.reload()">🔄 INVESTIGATE AGAIN</button>
    </div>
  `;
}

// Start
renderMission1();
</script>
</body>
</html>
