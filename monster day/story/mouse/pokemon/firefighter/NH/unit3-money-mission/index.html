<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unit 3 Smartboard Revision Mission: How Much Is It? • English Adventure Academy</title>
  <link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body>
  <div class="space-backdrop"></div>
  <div id="xp-toast" class="xp-toast">⭐ +5 XP Awarded!</div>

  <div class="mission-shell">
    <!-- =====================================================================
         TOP 45% VIEWPORT ZONE: HUD + CREW BAR + FRAMED JPEG CLUE + MONSTER
         ===================================================================== -->
    <section class="top-viewport-zone">
      <header class="mission-hud glass-panel">
        <div class="hud-brand">
          <img src="../assets/monsters/pets/pet-crew-red-captain.png" class="hud-crew-icon" alt="Crewmate">
          <div class="hud-title-block">
            <h1>Unit 3 Mission: How Much Is It?</h1>
            <p>Why do we need money? · Among Us Crew Tasks + 2P Bridge Finale</p>
          </div>
        </div>

        <div class="hud-progress-cluster">
          <div class="crew-bar-header">
            <span>🚀 Total Crew Task Progress</span>
            <span id="crew-bar-pct">0%</span>
          </div>
          <div class="crew-bar-track">
            <div class="crew-bar-fill" id="crew-bar-fill"></div>
            <div class="crew-bar-segments">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="stage-tabs-row">
            <button type="button" class="btn-3d stage-tab-btn active" data-stage="1">⚡ 1. Wires (0–33%)</button>
            <button type="button" class="btn-3d stage-tab-btn" data-stage="2">☄️ 2. Asteroids (33–66%)</button>
            <button type="button" class="btn-3d stage-tab-btn" data-stage="3">⚛️ 3. Reactor (66–100%)</button>
            <button type="button" class="btn-3d stage-tab-btn boss-tab" data-stage="4">🌉 4. Boss Tug-of-War</button>
          </div>
        </div>

        <div class="hud-controls">
          <div class="class-pills" id="class-pills-box" title="Select Active Class"></div>
          <a href="worksheet.html" target="_blank" class="btn-3d btn-violet" title="Open Printable Companion Worksheet" style="padding:7px 10px; font-size:0.76rem;">
            🖨️ Worksheet
          </a>
          <button type="button" class="btn-3d" id="btn-mute-audio" title="Mute / Unmute Audio" style="padding:7px 10px; font-size:0.85rem;">
            🔊
          </button>
          <button type="button" class="btn-3d btn-cyan" id="btn-fullscreen" title="Toggle Smartboard Fullscreen" style="padding:7px 10px; font-size:0.85rem;">
            📺
          </button>
          <a href="../index.html" class="btn-3d" title="Back to English Adventure Academy" style="padding:7px 10px; font-size:0.85rem;">
            🏠
          </a>
        </div>
      </header>

      <!-- Dynamic Upper Showcase (Picture Card + Prompt + Student Monster OR 2P Rope Bridge) -->
      <div id="upper-stage-mount" style="flex:1; min-height:0; display:flex; flex-direction:column;"></div>
    </section>

    <!-- =====================================================================
         BOTTOM 55% INTERACTIVE ZONE: ERGONOMIC SMARTBOARD TAP TARGETS
         ===================================================================== -->
    <main class="bottom-interactive-zone glass-panel" id="bottom-stage-mount"></main>
  </div>

  <!-- Celebration & XP Reward Modal -->
  <div class="mission-modal-backdrop" id="mission-modal">
    <div class="mission-modal-card glass-panel" id="mission-modal-body"></div>
  </div>

  <!-- Platform Store, Monster Renderer & Cloud Sync Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=2.2"></script>
  <script src="../js/supabase-client.js?v=2.9"></script>
  <script src="../js/school-cloud-sync.js?v=3.0"></script>
  <script src="../js/evolution-levels.js?v=1"></script>
  <script src="../js/school-store.js?v=4.40"></script>
  <script src="../js/monster-costumes.js?v=4"></script>
  <script src="../js/monster-costumes2.js?v=2"></script>
  <script src="../js/monster-pets.js?v=1"></script>
  <script src="../js/monster-renderer.js?v=4.3"></script>
  <script src="../js/milestone-ceremony.js?v=8"></script>

  <!-- Unit 3 Smartboard Revision Mission Engine -->
  <script src="js/data.js?v=1.0"></script>
  <script src="js/audio.js?v=1.0"></script>
  <script src="js/app.js?v=1.0"></script>
</body>
</html>
