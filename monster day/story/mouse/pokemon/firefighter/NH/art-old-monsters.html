<!doctype html><html><head><meta charset="utf-8"><title>Old drawn monsters, all stages</title>
<style>body{margin:0;background:#1b2238;color:#fff;font-family:system-ui,sans-serif;padding:12px}h2{margin:6px 0;font-size:14px}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}.c{background:#e8f1ff;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}.c b{position:absolute;left:6px;top:4px;font-size:10px;color:#345}</style></head><body>
<div id="out"></div>
<script src="js/monster-renderer.js"></script>
<script>
const stages=['egg','cracking_egg','baby','growing','adventurer','advanced','ultimate'];
const colors=(new URLSearchParams(location.search).get('c')||'blue,orange,green').split(',');
let h='';
colors.forEach(col=>{h+='<h2>'+col+'</h2><div class="row">'+stages.map(st=>'<div class="c"><b>'+st+'</b>'+MonsterRenderer.renderMonsterSVG({stage:st,color:col,equipped:{},size:200,animated:false})+'</div>').join('')+'</div>';});
document.getElementById('out').innerHTML=h;
</script></body></html>
