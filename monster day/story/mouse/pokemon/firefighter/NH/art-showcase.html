<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster art showcase (offline)</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font:600 13px system-ui,sans-serif;padding:14px}
h2{margin:22px 0 8px;font-size:17px}h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cell{background:linear-gradient(#f3ecff,#e6f0ff);border-radius:14px;padding:6px;color:#223;text-align:center}
.cell .t{font-size:11px;margin-top:2px;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px}
.mini{width:150px;background:linear-gradient(#f3ecff,#e6f0ff);border-radius:12px;padding:4px;color:#223;text-align:center;font-size:11px}
.mini img{width:140px;height:140px;object-fit:contain;display:block}
</style></head><body>
<h2>1. Dressed monsters: new items, illustrated backgrounds and auras</h2>
<div class="grid" id="dress"></div>
<h2>2. Lesson emotions (cheer, think, oops, sleepy)</h2>
<div class="row" id="emo"></div>
<h2>3. Cracking eggs (the stage between egg and baby)</h2>
<div class="row" id="egg"></div>
<h2>4. Three new species (egg to ultimate)</h2>
<div class="row" id="new"></div>
<script src="js/monster-renderer.js"></script>
<script src="js/monster-anchors.js"></script>
<script src="js/monster-dressup.js"></script>
<script>
var sets=[
 {c:'blue',s:'adventurer',e:{hat:'hat-pirate',glasses:'glasses-sun',accessory:'neck-bandana',background:'bg-beach',aura:'aura-ice'},bg:1},
 {c:'green',s:'growing',e:{hat:'hat-chef',glasses:'glasses-heart',accessory:'acc-icecream',background:'bg-meadow',aura:'aura-blossom'},bg:1},
 {c:'purple',s:'baby',e:{hat:'hat-tophat',glasses:'glasses-star',accessory:'neck-bowtie',background:'bg-moonlit',aura:'aura-cosmic'},bg:1},
 {c:'orange',s:'advanced',e:{hat:'hat-cowboy',accessory:'acc-magnifier',background:'bg-volcano',aura:'aura-flame'},bg:1},
 {c:'gold',s:'growing',e:{hat:'hat-propeller',glasses:'glasses-round',accessory:'acc-balloon',background:'bg-rainbow',aura:'aura-rainbow'},bg:1},
 {c:'blue',s:'baby',e:{hat:'hat-party',accessory:'neck-bell',background:'bg-underwater',aura:'aura-sparkle'},bg:1},
 {c:'purple',s:'adventurer',e:{hat:'hat-santa',glasses:'glasses-heart',accessory:'acc-pencil',background:'bg-winter',aura:'aura-star'},bg:1},
 {c:'gold',s:'baby',e:{hat:'hat-beanie',glasses:'glasses-sun',accessory:'acc-ball',background:'bg-castle',aura:'aura-royal'},bg:1}
];
document.getElementById('dress').innerHTML=sets.map(function(x){
 return '<div class="cell">'+MonsterDressUp.render({color:x.c,stage:x.s,equipped:x.e,size:250,showBackground:true,animated:false})+
 '<div class="t">'+x.c+' / '+x.s+'<br>'+Object.values(x.e).join(', ')+'</div></div>';}).join('');
var sp=['emberwing','aquafind','florasprout','astralight','sparktail'],em=['cheer','think','oops','sleepy'];
document.getElementById('emo').innerHTML=sp.map(function(s){return em.map(function(e){return '<div class="mini"><img src="assets/monsters/art/'+s+'_growing_'+e+'.webp"><div>'+s+' '+e+'</div></div>'}).join('')}).join('');
document.getElementById('egg').innerHTML=sp.map(function(s){return '<div class="mini"><img src="assets/monsters/art/'+s+'_egg.webp"><div>'+s+' egg</div></div><div class="mini"><img src="assets/monsters/art/'+s+'_cracking.webp"><div>'+s+' cracking</div></div>'}).join('');
var ns=['terrashell','frostfluff','breezefin'],st=['egg','baby','growing','adventurer','advanced','ultimate'];
document.getElementById('new').innerHTML=ns.map(function(s){return st.map(function(t){return '<div class="mini"><img src="assets/monsters/art/'+s+'_'+t+'.webp"><div>'+s+' '+t+'</div></div>'}).join('')}).join('');
</script></body></html>
