<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Party: garden signs and table cards</title>
<link rel="stylesheet" href="print.css">
<style>
  .sign .frame { gap: 2mm; }
  .sign.rose .frame { background: linear-gradient(180deg, #fff1f2, #ffe4e6); border-color: #be123c; }
  .sign.blue .frame { background: linear-gradient(180deg, #eff6ff, #dbeafe); border-color: #1d4ed8; }
  .sign.green .frame { background: linear-gradient(180deg, #f0fdf4, #dcfce7); border-color: #15803d; }
  .sign.purple .frame { background: linear-gradient(180deg, #faf5ff, #f3e8ff); border-color: #7e22ce; }
  .arrow { font-size: 90pt; line-height: 1; }
  .tcard { border: 0.5mm dashed #64748b; border-radius: 4mm; text-align: center; padding: 5mm 3mm; background: #fffbeb; break-inside: avoid; }
  .tcard .e { font-size: 34pt; line-height: 1.1; } .tcard .e img { height: 22mm; }
  .tcard .w { font-size: 17pt; font-weight: 800; margin-top: 1mm; }
  .tent { border: 0.5mm dashed #64748b; border-radius: 4mm; padding: 5mm; text-align: center; background: #faf5ff; break-inside: avoid; }
  .tent .t { font-size: 17pt; font-weight: 800; color: var(--violet); }
  .tent .s { font-size: 11pt; color: #475569; margin-top: 1mm; }
  .place { border: 0.5mm dashed #64748b; border-radius: 4mm; padding: 4mm; text-align: center; background: #fff; break-inside: avoid; }
  .place .n { font-size: 18pt; font-weight: 900; color: var(--violet); }
  .place .r { font-size: 11pt; color: #475569; }
  .flag { width: 38mm; height: 52mm; clip-path: polygon(0 0, 100% 0, 50% 100%); display: flex; align-items: flex-start; justify-content: center; padding-top: 7mm; font-size: 44pt; font-weight: 900; color: #fff; }
  .flags { display: flex; flex-wrap: wrap; gap: 2mm; justify-content: center; }
  .sheet .sechd { margin: 0 0 4mm; font-size: 16pt; color: var(--violet); }
</style>
</head>
<body>
<div class="bar"><h1>🌿 Garden signs and table cards</h1>
  <button onclick="window.print()">Print everything</button>
  <span class="hint">Landscape signs for the garden walls and fence, then table cards, phrase cards, place cards and bunting. Print on thick paper if you can.</span>
</div>
<main id="out"></main>
<script src="../alice-party-home/party-data.js?v=2"></script>
<script>
(function () {
  'use strict';
  var P = window.PARTY, DECO = '../assets/party-deco/';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function deco(file, emoji) { return '<div class="deco"><img src="' + DECO + file + '.webp" alt="" onerror="this.replaceWith(document.createTextNode(\'' + emoji + '\'))"></div>'; }
  var SIGNS = [
    { cls: 'purple', file: 'deco_teapot', e: '🫖', big: "ALICE'S TEA PARTY", mid: 'Welcome to the garden!', small: 'Class 4A and Class 4B' },
    { cls: 'rose', file: 'deco_hearts', e: '♥️', big: 'NO ROOM! NO ROOM!', mid: 'There is plenty of room!', small: 'The March Hare and the Mad Hatter say hello' },
    { cls: 'blue', file: 'deco_bottle', e: '🧪', big: 'DRINK ME', mid: 'A small bottle with a blue drink', small: 'Water only, please!' },
    { cls: 'rose', file: 'deco_cake', e: '🍰', big: 'EAT ME', mid: 'A small cake with a red cherry', small: 'Eat after the show' },
    { cls: 'green', file: 'deco_clock', e: '🕕', big: 'IT IS ALWAYS TEA TIME', mid: 'The clock says six o’clock', small: 'Stuck at six, just like the Hatter’s watch' },
    { cls: 'rose', file: 'deco_roses', e: '🌹', big: 'PAINT THE ROSES RED', mid: 'Shhh! The Red Queen is coming', small: 'Hide the white roses!' },
    { cls: 'purple', file: 'deco_cat', e: '😸', big: 'CHESHIRE CAT’S SMILE CORNER', mid: 'Take a photo with a big smile', small: 'Smile, smile, smile!' },
    { cls: 'blue', file: 'deco_mouse', e: '🐭', big: 'SHHH! THE DORMOUSE IS SLEEPING', mid: 'Please speak quietly', small: 'Zzz...' },
    { cls: 'green', file: 'deco_door', e: '🚪', big: 'THIS WAY TO THE TEA PARTY', mid: 'Follow the white rabbit', small: 'Mind the little door' },
    { cls: 'purple', file: 'deco_mushroom', e: '🍄', big: 'PLEASE SIT HERE', mid: 'Wonderland guests only', small: 'Take a seat on the mushroom' },
    { cls: 'green', file: 'deco_tea', e: '🍵', big: 'WOULD YOU LIKE SOME TEA?', mid: 'Yes, please. / No, thank you.', small: 'Practise your party phrases!' },
    { cls: 'rose', file: 'deco_cards', e: '🃏', big: 'OFF WITH THEIR... NOISE!', mid: 'Quiet voices, please', small: 'The Red Queen is listening' }
  ];
  var TABLE = [['tea', '🍵'], ['milk', '🥛'], ['sugar', '🍬'], ['lemon', '🍋'], ['cake', '🍰'], ['biscuits', '🍪'], ['jam', '🍓'], ['honey', '🍯'], ['bread', '🍞'], ['butter', '🧈'], ['teapot', '🫖'], ['teacup', '☕'],
    ['plate', '🍽️'], ['spoon', '🥄'], ['napkin', '🧻'], ['sandwich', '🥪'], ['apple', '🍎'], ['orange juice', '🧃'], ['cherry', '🍒'], ['carrot', '🥕'], ['flower', '🌸'], ['candle', '🕯️'], ['clock', '🕐'], ['key', '🔑']];
  var PHRASES = [['Would you like some tea?', 'Host: pour the tea'], ['Yes, please.', 'Guest: say yes politely'], ['No, thank you.', 'Guest: say no politely'], ['Pass the cake, please.', 'Ask nicely and say please'],
    ['Here you are.', 'Give something to a friend'], ['Thank you very much!', 'Always say thank you'], ['This is a nice tea party!', 'Say it at the end'], ['You are welcome.', 'The answer to thank you']];
  var out = '';
  SIGNS.forEach(function (s) {
    out += '<section class="sheet land sign ' + s.cls + '"><div class="frame">' + deco(s.file, s.e) + '<div class="big">' + esc(s.big) + '</div><div class="mid">' + esc(s.mid) + '</div><div class="small">' + esc(s.small) + '</div></div></section>';
  });
  out += '<section class="sheet land sign green"><div class="frame"><div class="arrow">⬅️</div><div class="big">THIS WAY</div><div class="mid">to the tea party</div></div></section>';
  out += '<section class="sheet land sign green"><div class="frame"><div class="arrow">➡️</div><div class="big">THIS WAY</div><div class="mid">to the tea party</div></div></section>';
  out += '<section class="sheet"><h2 class="sechd">Table cards: cut along the dashed lines and fold in half</h2><div class="grid4">' +
    TABLE.map(function (t) { return '<div class="tcard"><div class="e"><img src="' + DECO + 'tbl_' + t[0].replace(/ /g, '_') + '.webp" alt="" onerror="this.replaceWith(document.createTextNode(\'' + t[1] + '\'))"></div><div class="w">' + esc(t[0]) + '</div></div>'; }).join('') + '</div></section>';
  out += '<section class="sheet"><h2 class="sechd">Phrase cards for the tables</h2><div class="grid2">' +
    PHRASES.map(function (p) { return '<div class="tent"><div class="t">' + esc(p[0]) + '</div><div class="s">' + esc(p[1]) + '</div></div>'; }).join('') + '</div></section>';
  Object.keys(P.classes).forEach(function (c) {
    out += '<section class="sheet"><h2 class="sechd">Place cards · ' + esc(P.classes[c].label) + '</h2><div class="grid3">' +
      P.classes[c].students.map(function (s) { return '<div class="place"><div class="n">' + esc(s.name) + '</div><div class="r">' + esc(P.roles[s.role].name) + '</div></div>'; }).join('') + '</div></section>';
  });
  var cols = ['#7c3aed', '#db2777', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444'], i = 0;
  out += '<section class="sheet land"><h2 class="sechd">Bunting: cut the flags and tie them to a string</h2><div class="flags">' +
    'TEA PARTY ALICE'.split('').map(function (ch) { if (ch === ' ') return '<div style="width:14mm"></div>'; var c = cols[i++ % cols.length]; return '<div class="flag" style="background:' + c + '">' + ch + '</div>'; }).join('') + '</div></section>';
  document.getElementById('out').innerHTML = out;
})();
</script>
</body>
</html>
