<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Party: blueprints (cut-out patterns)</title>
<link rel="stylesheet" href="print.css">
<style>
  .sheet.bp { padding: 0; overflow: hidden; }
  .sheet.bp svg { display: block; width: 100%; height: 100%; }
  .sheet.bp.port { height: 297mm; } .sheet.bp.land { height: 210mm; }
  .bar select { max-width: 260px; }
  .legend { font-size: .85rem; color: #cbd5e1; }
</style>
</head>
<body>
<div class="bar"><h1>📐 Blueprints</h1>
  <select id="mode"><option value="role">One character</option><option value="class">A whole class (one set per pupil)</option><option value="all">All patterns</option></select>
  <select id="role"></select><select id="cls"></select>
  <button onclick="window.print()">Print</button>
  <span class="legend">Print at <b>100% / Actual size</b> (not “fit to page”). Check: the ruler on every page must measure 10 cm. Black line = CUT · blue dashes = FOLD · grey = GLUE TAB.</span>
</div>
<main id="out"></main>
<script src="../alice-party-home/party-data.js?v=2"></script>
<script>
(function () {
  'use strict';
  var P = window.PARTY;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var CUT = 'fill="none" stroke="#111" stroke-width="0.7"', FOLD = 'fill="none" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="3 2"',
      GLUE = 'fill="url(#hatch)" stroke="#111" stroke-width="0.5"', HINT = 'fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-dasharray="1.5 1.5"';
  function T(x, y, s, size, anchor, col) { return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 4) + '" fill="' + (col || '#334155') + '" text-anchor="' + (anchor || 'start') + '" font-family="Trebuchet MS,Segoe UI,Arial,sans-serif">' + esc(s) + '</text>'; }
  /* union outline: the shapes are drawn twice so the lines inside overlaps disappear */
  function union(shapes) { return shapes.map(function (s) { return s.replace('/>', ' fill="#fff" stroke="#111" stroke-width="1.4"/>'); }).join('') + shapes.map(function (s) { return s.replace('/>', ' fill="#fff" stroke="none"/>'); }).join(''); }
  function rect(x, y, w, h, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"' + (extra || '') + '/>'; }
  function circ(x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"/>'; }
  function ell(x, y, rx, ry, rot) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '"' + (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + '/>'; }
  function poly(pts, st) { return '<polygon points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '" ' + (st || CUT) + '/>'; }
  function line(x1, y1, x2, y2, st) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' + (st || FOLD) + '/>'; }
  function strokeOf(shape, st) { return shape.replace('/>', ' ' + st + '/>'); }

  var PAGES = {
    strip: { t: 'Headband strips', land: true, w: 297, h: 210, draw: function () {
      var o = '';
      [25, 100].forEach(function (y, i) {
        o += strokeOf(rect(10, y, 277, 40), CUT) + strokeOf(rect(267, y, 20, 40), GLUE) + line(267, y, 267, y + 40) + T(14, y + 24, i ? 'STRIP 2: glue its tab on the end of strip 1' : 'STRIP 1', 5) + T(277, y + 24, 'glue', 4, 'middle');
      });
      return o + T(10, 165, 'Join the two strips with the glue tab. Wrap the headband around your head, glue the last tab. Cut it shorter if it is too long.', 4.2) + T(10, 172, 'Then stick your ears, crown or antennae on the headband.', 4.2);
    } },
    ears_rabbit: { t: 'Long ears (rabbit and hare)', land: false, w: 210, h: 297, draw: function () {
      var o = ''; [60, 150].forEach(function (cx) { o += strokeOf(ell(cx, 110, 30, 90), CUT) + strokeOf(ell(cx, 112, 17, 74), HINT) + strokeOf(rect(cx - 25, 200, 50, 25), GLUE) + line(cx - 25, 200, cx + 25, 200) + T(cx, 218, 'tab', 4, 'middle'); });
      return o + T(105, 245, 'Cut 2 ears. Colour the inside pink. Fold the tabs, then glue them on the headband.', 4.2, 'middle');
    } },
    ears_cat: { t: 'Pointed ears (cat)', land: false, w: 210, h: 297, draw: function () {
      var o = ''; [60, 150].forEach(function (cx) { o += poly([[cx - 40, 200], [cx, 70], [cx + 40, 200]]) + poly([[cx - 26, 192], [cx, 100], [cx + 26, 192]], HINT) + strokeOf(rect(cx - 40, 200, 80, 25), GLUE) + line(cx - 40, 200, cx + 40, 200) + T(cx, 218, 'tab', 4, 'middle'); });
      return o + T(105, 245, 'Cut 2 ears. Colour the inside pink. Fold the tabs, then glue them on the headband.', 4.2, 'middle');
    } },
    ears_dog: { t: 'Floppy ears (dog)', land: false, w: 210, h: 297, draw: function () {
      var o = ''; [60, 150].forEach(function (cx) { o += strokeOf(rect(cx - 30, 60, 60, 140, ' rx="28"'), CUT) + strokeOf(rect(cx - 30, 200, 60, 25), GLUE) + line(cx - 30, 200, cx + 30, 200) + T(cx, 218, 'tab', 4, 'middle'); });
      return o + T(105, 245, 'Cut 2 ears. Colour them brown. Let them hang down: glue only the tab on the headband.', 4.2, 'middle');
    } },
    ears_mouse: { t: 'Round ears (mouse)', land: false, w: 210, h: 297, draw: function () {
      var o = ''; [60, 150].forEach(function (cx) { o += strokeOf(circ(cx, 120, 50), CUT) + strokeOf(circ(cx, 124, 30), HINT) + strokeOf(rect(cx - 30, 170, 60, 25), GLUE) + line(cx - 30, 170, cx + 30, 170) + T(cx, 188, 'tab', 4, 'middle'); });
      return o + T(105, 235, 'Cut 2 ears. Colour them grey, the inside pink. Fold the tabs and glue them on the headband.', 4.2, 'middle');
    } },
    crown: { t: 'Crown (2 pieces)', land: true, w: 297, h: 210, draw: function () {
      var o = '';
      [0, 95].forEach(function (dy, k) {
        var pts = [[10, 100 + dy], [10, 55 + dy]], w = 277 / 9;
        for (var i = 0; i < 9; i++) { pts.push([10 + w * (i + 0.5), 20 + dy]); pts.push([10 + w * (i + 1), 55 + dy]); }
        pts.push([287, 100 + dy]);
        o += poly(pts) + strokeOf(rect(267, 55 + dy, 20, 45), GLUE) + line(267, 55 + dy, 267, 100 + dy) + T(14, 95 + dy, k ? 'PIECE 2' : 'PIECE 1', 4.5) + T(277, 80 + dy, 'glue', 4, 'middle');
      });
      return o + T(10, 205, 'Glue piece 1 to piece 2 with the tab, then close the ring around your head. Colour it and add stars or hearts.', 4);
    } },
    antennae: { t: 'Antennae', land: false, w: 210, h: 297, draw: function () {
      var o = ''; [65, 145].forEach(function (cx) { o += union([circ(cx, 45, 18), rect(cx - 5, 55, 10, 225)]) + line(cx - 5, 255, cx + 5, 255) + T(cx, 270, 'tab', 3.5, 'middle'); });
      return o + T(105, 18, 'Cut 2 antennae. Colour them blue. Fold the bottom tab and glue them on the headband.', 4.2, 'middle');
    } },
    hat1: { t: 'Hat: the tube (page 1 of 2)', land: true, w: 297, h: 210, draw: function () {
      var o = '';
      [10, 110].forEach(function (y, k) {
        o += strokeOf(rect(10, y, 225, 80), CUT) + strokeOf(rect(235, y, 10, 80), GLUE) + line(235, y, 235, y + 80) + strokeOf(rect(10, y + 80, 225, 10), GLUE) + line(10, y + 80, 235, y + 80) + T(14, y + 40, k ? 'TUBE PIECE 2' : 'TUBE PIECE 1', 5) + T(250, y + 45, 'glue', 4);
        for (var i = 1; i < 9; i++) o += line(10 + i * 25, y + 80, 10 + i * 25, y + 90, 'stroke="#111" stroke-width="0.4"');
      });
      return o + T(10, 205, 'Glue the 2 pieces into one tube. Cut the small tabs at the bottom and fold them out.', 4);
    } },
    hat2: { t: 'Hat: the brim (page 2 of 2)', land: true, w: 297, h: 210, draw: function () {
      var o = '';
      [105, 205].forEach(function (cy, k) { o += '<path d="M10,' + cy + ' A100,100 0 0 1 210,' + cy + ' L180,' + cy + ' A70,70 0 0 0 40,' + cy + ' Z" ' + CUT + '/>' + T(110, cy - 12, 'BRIM HALF ' + (k + 1), 5, 'middle'); });
      return o + T(222, 40, 'Tape the 2 halves into a ring.', 4.2) + T(222, 50, 'Push the tube through the ring and', 4.2) + T(222, 58, 'glue the tabs on the brim.', 4.2) + T(222, 76, 'TOP: put the tube on card, draw', 4.2) + T(222, 84, 'around it, add 1 cm tabs, cut it out', 4.2) + T(222, 92, 'and glue it on top.', 4.2) + T(222, 110, 'Colour the hat and add a band.', 4.2);
    } },
    wings: { t: 'Wings (print 2 pages)', land: true, w: 297, h: 210, draw: function () {
      var d = 'M30,185 C32,115 85,48 165,32 C212,23 248,26 276,14 L242,88 Q224,74 207,114 Q181,96 153,148 Q126,128 96,180 Z';
      return '<path d="' + d + '" ' + CUT + '/>' + line(45, 150, 235, 90, HINT) + line(45, 150, 200, 115, HINT) + line(45, 150, 150, 145, HINT) + strokeOf(circ(75, 130, 8), HINT) + T(75, 148, 'strap', 3.5, 'middle') + T(10, 191, 'Print this page twice. Turn the second copy over (mirror) so you have a left and a right wing.', 3.8) + T(10, 197, 'Colour them green and tape a ribbon loop on the back for your arm.', 3.8);
    } },
    claws: { t: 'Claws (10)', land: false, w: 210, h: 297, draw: function () {
      var o = '';
      for (var r = 0; r < 5; r++) for (var c = 0; c < 2; c++) { var x = 50 + c * 80, y = 25 + r * 52; o += poly([[x, y + 40], [x + 28, y + 40], [x + 14, y]]) + strokeOf(rect(x, y + 40, 28, 8), GLUE) + line(x, y + 40, x + 28, y + 40); }
      return o + T(105, 290, 'Cut 10 claws. Colour them dark. Fold the tab and tape one on each finger tip of a glove.', 4, 'middle');
    } },
    shell: { t: 'Shell (cut 2)', land: false, w: 210, h: 297, draw: function () {
      var cx = 105, cy = 230, r = 85, n = 9, o = '', d = 'M' + (cx - r) + ',' + cy;
      for (var i = 1; i <= n; i++) { var a = Math.PI - Math.PI * i / n, x = cx + r * Math.cos(a), y = cy - r * Math.sin(a); d += ' A' + (r * Math.PI / n * 0.62).toFixed(1) + ',' + (r * Math.PI / n * 0.62).toFixed(1) + ' 0 0 1 ' + x.toFixed(1) + ',' + y.toFixed(1); o += line(cx, cy, x, y, HINT); }
      d += ' Z';
      return '<path d="' + d + '" ' + CUT + '/>' + o + strokeOf(rect(cx - 25, cy, 50, 20), GLUE) + line(cx - 25, cy, cx + 25, cy) + T(cx, cy + 14, 'tab', 4, 'middle') + T(105, 20, 'Cut 2 shells. Colour the ridges pink and white. Glue them together at the tabs so they open like a book.', 4.2, 'middle');
    } },
    carrot: { t: 'Carrot cone + leaves', land: true, w: 297, h: 210, draw: function () {
      var r = 190, a = Math.PI / 4, ax = 148.5, ay = 8, x1 = ax - r * Math.sin(a), y1 = ay + r * Math.cos(a), x2 = ax + r * Math.sin(a), y2 = y1;
      var o = '<path d="M' + ax + ',' + ay + ' L' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' A' + r + ',' + r + ' 0 0 0 ' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' Z" ' + CUT + '/>';
      o += '<path d="M' + ax + ',' + ay + ' L' + (x2 - 14).toFixed(1) + ',' + (y2 - 14).toFixed(1) + ' L' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' Z" ' + GLUE.replace('url(#hatch)', 'url(#hatch)') + '/>';
      [[20, 36], [45, 36], [70, 36]].forEach(function (p) { o += strokeOf(ell(p[0], p[1], 10, 22), CUT); });
      return o + T(148.5, 120, 'Roll into a cone. Glue the tab.', 4.2, 'middle') + T(8, 72, 'Leaves: cut 3, colour green,', 3.6) + T(8, 78, 'glue inside the wide end.', 3.6) + T(10, 200, 'Colour the cone orange.', 4);
    } },
    smile: { t: 'Big smile', land: true, w: 297, h: 210, draw: function () {
      var o = '<path d="M15,50 Q148.5,215 282,50 Q148.5,110 15,50 Z" ' + CUT + '/>';
      return o + T(148.5, 28, 'Cut out the smile. Colour it white with a red edge, draw the teeth, and tape it to a stick or a paper plate.', 4.2, 'middle');
    } },
    key: { t: 'Key', land: false, w: 210, h: 297, draw: function () {
      return union([circ(105, 60, 32), rect(96, 85, 18, 160), rect(114, 170, 26, 12), rect(114, 195, 20, 12), rect(114, 220, 26, 12)]) + strokeOf(circ(105, 60, 14), CUT) + T(105, 275, 'Cut out the key. Colour it gold. Make a hole in the ring for a string.', 4.2, 'middle');
    } },
    watch: { t: 'Pocket watch', land: false, w: 210, h: 297, draw: function () {
      return union([circ(105, 130, 75), rect(95, 38, 20, 22)]) + strokeOf(circ(105, 130, 58), HINT) + line(105, 130, 105, 85, HINT) + line(105, 130, 135, 145, HINT) + strokeOf(circ(105, 130, 4), HINT) + T(105, 240, 'Cut out the watch. Draw the 2 hands and tick marks. Colour the edge gold.', 4.2, 'middle') + T(105, 250, 'Tie a string through the top and hang it around your neck.', 4.2, 'middle');
    } },
    letter: { t: 'Letter', land: true, w: 297, h: 210, draw: function () {
      return strokeOf(rect(60, 40, 177, 120), CUT) + line(60, 40, 148.5, 100) + line(237, 40, 148.5, 100) + T(148.5, 180, 'Cut out. Fold the flap. Colour a red heart seal. Write a message inside!', 4.2, 'middle');
    } },
    card: { t: 'Playing card', land: false, w: 210, h: 297, draw: function () {
      return strokeOf(rect(50, 40, 110, 160, ' rx="8"'), CUT) + '<path d="M105,150 C58,115 78,80 105,105 C132,80 152,115 105,150 Z" ' + HINT + '/>' + T(105, 220, 'Cut out the card. Colour a big red heart or spade.', 4.2, 'middle');
    } },
    bone: { t: 'Bone', land: true, w: 297, h: 210, draw: function () {
      return union([rect(70, 85, 157, 40), circ(60, 80, 24), circ(60, 130, 24), circ(237, 80, 24), circ(237, 130, 24)]) + T(148.5, 180, 'Cut out the bone. Colour it white or cream. Fold it in the middle for a stand.', 4.2, 'middle');
    } },
    button: { t: 'Big button', land: false, w: 210, h: 297, draw: function () {
      return strokeOf(circ(105, 120, 70), CUT) + strokeOf(circ(105, 120, 62), HINT) + [[-14, -14], [14, -14], [-14, 14], [14, 14]].map(function (p) { return strokeOf(circ(105 + p[0], 120 + p[1], 5), CUT); }).join('') + T(105, 215, 'Cut out the button and the 4 holes. Colour it bright. Tie string through the holes.', 4.2, 'middle');
    } },
    flower: { t: 'Flower', land: false, w: 210, h: 297, draw: function () {
      var sh = []; for (var i = 0; i < 8; i++) sh.push('<ellipse cx="105" cy="98" rx="18" ry="42" transform="rotate(' + (i * 45) + ' 105 140)"/>');
      return union(sh.concat([circ(105, 140, 24)])) + T(105, 250, 'Cut out the flower. Colour the petals pink and the middle yellow.', 4.2, 'middle');
    } },
    sword: { t: 'Toy sword (card only)', land: false, w: 210, h: 297, draw: function () {
      return union(['<polygon points="105,18 122,52 122,200 88,200 88,52"/>', rect(62, 200, 86, 14), rect(96, 214, 18, 45), circ(105, 268, 10)]) + T(105, 288, 'Card only. No real sword. Colour the blade silver.', 4.2, 'middle');
    } },
    book: { t: 'Book', land: true, w: 297, h: 210, draw: function () {
      return strokeOf(rect(40, 30, 217, 150), CUT) + line(148.5, 30, 148.5, 180) + T(148.5, 195, 'Cut out. Fold in the middle. Colour the cover and draw a picture on it.', 4.2, 'middle');
    } },
    stick: { t: 'Walking stick', land: false, w: 210, h: 297, draw: function () {
      return strokeOf(rect(94, 20, 22, 255, ' rx="10"'), CUT) + T(105, 290, 'Cut out. Colour brown. Roll a paper tube for a stronger stick.', 4, 'middle');
    } },
    pearl: { t: 'Pearl', land: false, w: 210, h: 297, draw: function () {
      return strokeOf(circ(105, 100, 40), CUT) + strokeOf(circ(105, 100, 30), HINT) + T(105, 170, 'Cut 2 circles. Colour white. Glue them together with a string between.', 4.2, 'middle');
    } },
    bell: { t: 'Bell', land: false, w: 210, h: 297, draw: function () {
      return union([ell(105, 120, 45, 55), rect(80, 160, 50, 10)]) + strokeOf(circ(105, 70, 8), CUT) + T(105, 205, 'Cut 2. Colour silver. Glue together with a ribbon loop in the top.', 4.2, 'middle');
    } },
    mushroom: { t: 'Mushroom', land: true, w: 297, h: 210, draw: function () {
      return union(['<path d="M48,110 A100,100 0 0 1 248,110 Z"/>', rect(123, 105, 50, 80)]) + [[110, 70, 14], [160, 55, 11], [190, 85, 12], [135, 95, 8]].map(function (c) { return strokeOf(circ(c[0], c[1], c[2]), HINT); }).join('') + T(148.5, 200, 'Colour the top red, the spots white, the stalk cream. Glue it on a stand.', 4.2, 'middle');
    } },
    tag: { t: 'Bottle tag', land: false, w: 210, h: 297, draw: function () {
      return strokeOf(rect(60, 50, 90, 55, ' rx="6"'), CUT) + strokeOf(circ(75, 65, 4), CUT) + T(105, 130, 'Cut out. Make a hole. Tie it to the bottle with string.', 4.2, 'middle');
    } }
  };
  /* prop text -> blueprint pages (types without a blueprint use a real item at home) */
  var MAP = { 'a paper key': ['key'], 'a big key': ['key'], 'a big paper hat': ['hat1', 'hat2'], 'a tall hat': ['hat1', 'hat2'], 'a green hat': ['hat1', 'hat2'], 'a paper watch': ['watch'], 'a letter': ['letter'],
    'a paper crown': ['crown'], 'a red paper crown': ['crown'], 'a small bottle': ['tag'], 'long paper ears': ['strip', 'ears_rabbit'], 'a carrot': ['carrot'], 'cat ears': ['strip', 'ears_cat'], 'a big smile': ['smile'],
    'dog ears': ['strip', 'ears_dog'], 'a paper bone': ['bone'], 'a playing card': ['card'], 'paper wings': ['wings'], 'a toy sword': ['sword'], 'paper claws': ['claws'], 'a book': ['book'], 'a flower': ['flower'],
    'a big button': ['button'], 'a button': ['button'], 'a small bell': ['bell'], 'blue paper antennae': ['strip', 'antennae'], 'a mushroom': ['mushroom'], 'a walking stick': ['stick'], 'mouse ears': ['strip', 'ears_mouse'],
    'a paper shell': ['shell'], 'a pearl': ['pearl'] };

  function pageHtml(id, label) {
    var p = PAGES[id], inner = p.draw();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + p.w + ' ' + p.h + '"><defs><pattern id="hatch" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.4" stroke="#94a3b8" stroke-width="0.7"/></pattern></defs>' +
      '<rect width="' + p.w + '" height="' + p.h + '" fill="#fff"/>' + inner +
      T(8, 7, p.t + (label ? ' · ' + label : ''), 4.4, 'start', '#6d28d9') +
      '<line x1="' + (p.w - 118) + '" y1="' + (p.h - 6) + '" x2="' + (p.w - 18) + '" y2="' + (p.h - 6) + '" stroke="#111" stroke-width="0.6"/><line x1="' + (p.w - 118) + '" y1="' + (p.h - 9) + '" x2="' + (p.w - 118) + '" y2="' + (p.h - 3) + '" stroke="#111" stroke-width="0.6"/><line x1="' + (p.w - 18) + '" y1="' + (p.h - 9) + '" x2="' + (p.w - 18) + '" y2="' + (p.h - 3) + '" stroke="#111" stroke-width="0.6"/>' +
      T(p.w - 68, p.h - 9, '10 cm: this line must measure 10 cm', 3.2, 'middle') + '</svg>';
    return '<section class="sheet bp ' + (p.land ? 'land' : 'port') + '">' + svg + '</section>';
  }
  function idsForRole(key) { var out = []; (P.roles[key].props || []).forEach(function (t) { (MAP[t] || []).forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); }); }); return out; }

  var mode = document.getElementById('mode'), role = document.getElementById('role'), cls = document.getElementById('cls'), out = document.getElementById('out');
  var keys = Object.keys(P.roles), ckeys = Object.keys(P.classes);
  role.innerHTML = keys.map(function (k) { return '<option value="' + k + '">' + esc(P.roles[k].name) + '</option>'; }).join('');
  cls.innerHTML = ckeys.map(function (k) { return '<option value="' + k + '">' + esc(P.classes[k].label) + '</option>'; }).join('');
  var wantRole = new URLSearchParams(location.search).get('role'); if (keys.indexOf(wantRole) >= 0) role.value = wantRole;
  function draw() {
    role.style.display = mode.value === 'role' ? '' : 'none'; cls.style.display = mode.value === 'class' ? '' : 'none';
    var h = '';
    if (mode.value === 'all') h = Object.keys(PAGES).map(function (id) { return pageHtml(id, ''); }).join('');
    else if (mode.value === 'role') { var ids = idsForRole(role.value); h = ids.length ? ids.map(function (id) { return pageHtml(id, P.roles[role.value].name); }).join('') : '<p class="empty">This character uses things from home (cups, teapot, plate). No blueprint needed.</p>'; }
    else h = P.classes[cls.value].students.map(function (s) { return idsForRole(s.role).map(function (id) { return pageHtml(id, s.name + ' · ' + P.roles[s.role].short); }).join(''); }).join('') || '<p class="empty">No pages.</p>';
    out.innerHTML = h;
  }
  mode.onchange = role.onchange = cls.onchange = draw; draw();
})();
</script>
</body>
</html>
