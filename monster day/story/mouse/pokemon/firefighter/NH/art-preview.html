<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster art preview</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font:600 13px system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 14px;opacity:.75}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.c{width:160px;background:linear-gradient(#f3ecff,#e6f0ff);border-radius:14px;padding:8px;text-align:center;color:#223}
.c img{width:144px;height:144px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
</style></head><body>
<h1>Monster art preview (offline, not published)</h1>
<p>Species follows the colour a student picked: blue = Aquafind, green/pink = Florasprout, purple = Astralight.</p>
<div id="g"></div>
<script>
var sp=['aquafind','florasprout','astralight'],st=['egg','baby','growing','adventurer','advanced','ultimate'];
document.getElementById('g').innerHTML=sp.map(function(s){return '<div class="row">'+st.map(function(t){return '<div class="c"><img src="assets/monsters/art/'+s+'_'+t+'.webp" alt="'+s+' '+t+'"><div>'+s+'<br>'+t+'</div></div>'}).join('')+'</div>'}).join('');
</script></body></html>
