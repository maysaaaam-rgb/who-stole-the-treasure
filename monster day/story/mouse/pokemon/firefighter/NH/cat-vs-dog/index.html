<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cat vs Dog (Fleabag vs Mutt) | Authentic Modern HTML5 Port</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Header Bar -->
  <header class="header-bar">
    <div class="brand-badge">
      🐱 <span>CAT</span> VS <span>DOG</span> 🐶
    </div>

    <!-- Match Win Scoreboard -->
    <div id="scoreboard-pill" class="scoreboard-pill" title="Session Scoreboard (Local Storage)">
      🐱 <b>0</b> &nbsp;|&nbsp; <b>0</b> 🐶
    </div>

    <div class="controls-cluster">
      <select id="game-mode-select" class="glass-select" title="Game Mode">
        <option value="1P">1 Player (vs CPU)</option>
        <option value="2P">2 Players (Pass &amp; Play)</option>
      </select>

      <select id="difficulty-select" class="glass-select" title="Wind Difficulty">
        <option value="normal">Wind: Normal (-7 to +7)</option>
        <option value="easy">Wind: Calm (-1 to +1)</option>
      </select>

      <button id="btn-toggle-mute" class="btn-3d active" title="Toggle Sound Mute">🔊 Sound</button>
      <button id="btn-reset" class="btn-3d" title="Restart Round">🔄 Round</button>
      <button id="btn-reset-score" class="btn-3d" title="Reset Win Counter">📊 Score</button>
      <button id="btn-fullscreen" class="btn-3d" title="Classroom Fullscreen">📺</button>
    </div>
  </header>

  <!-- Interactive Game Frame -->
  <main class="game-frame">
    <!-- Authentic Canvas Viewport (600x430 Native Flash) -->
    <canvas id="battle-canvas" width="600" height="430"></canvas>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Authentic Flash Assets...</div>
    </div>

    <!-- Game Over Modal Overlay -->
    <div id="game-over-modal" class="modal-overlay">
      <div class="modal-card">
        <div id="winner-avatar" class="winner-avatar">🏆</div>
        <h2 id="game-over-title" class="modal-title">Victory!</h2>
        <p id="game-over-desc" class="modal-desc">Winner details...</p>
        <div class="modal-actions">
          <button id="btn-rematch" class="btn-3d btn-primary" style="padding: 10px 22px; font-size: 0.95rem;">
            ⚔️ Play Next Round
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Hint & Tactical Tray -->
  <footer class="hint-tray">
    <span class="hint-pill">🖱️ Click &amp; Hold to Charge Power</span>
    <span class="hint-pill">🎯 Release to Launch Over Fence</span>
    <span class="hint-pill">💨 Watch Wind Vane Indicator</span>
    <span class="hint-pill">⚡ Tap Power-ups: x2 Double, 💣 Bomb, 🧪 Stink, 🩹 Heal</span>
  </footer>

  <!-- Scripts -->
  <script src="js/game-audio.js"></script>
  <script src="js/sprite-manager.js"></script>
  <script src="js/game-engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
