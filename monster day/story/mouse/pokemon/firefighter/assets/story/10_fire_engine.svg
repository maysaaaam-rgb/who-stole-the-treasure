<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="truckRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f44336"/>
      <stop offset="50%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="truckShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#eceff1"/>

  <rect y="460" width="800" height="140" fill="#607d8b"/>
  <line x1="50" y1="530" x2="200" y2="530" stroke="#fff" stroke-width="8" stroke-dasharray="25 15"/>
  <line x1="280" y1="530" x2="520" y2="530" stroke="#fff" stroke-width="8" stroke-dasharray="25 15"/>
  <line x1="600" y1="530" x2="750" y2="530" stroke="#fff" stroke-width="8" stroke-dasharray="25 15"/>

  <rect x="180" y="25" width="440" height="65" rx="16" fill="#d32f2f" stroke="#b71c1c" stroke-width="3"/>
  <text x="400" y="68" font-family="'Comic Sans MS', sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">THE FIRE ENGINE 🚒</text>

  <g transform="translate(60, 130)" filter="url(#truckShadow)">
    <!-- Ladder -->
    <rect x="220" y="15" width="360" height="18" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <line x1="240" y1="15" x2="240" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="280" y1="15" x2="280" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="320" y1="15" x2="320" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="360" y1="15" x2="360" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="400" y1="15" x2="400" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="440" y1="15" x2="440" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="480" y1="15" x2="480" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="520" y1="15" x2="520" y2="33" stroke="#78909c" stroke-width="4"/>
    <line x1="560" y1="15" x2="560" y2="33" stroke="#78909c" stroke-width="4"/>

    <!-- Siren Light -->
    <rect x="110" y="25" width="30" height="15" rx="5" fill="#29b6f6" stroke="#0288d1" stroke-width="2"/>

    <!-- Cab -->
    <path d="M 40,160 L 40,80 L 140,40 L 220,40 L 220,280 L 40,280 Z" fill="url(#truckRed)" stroke="#9a0007" stroke-width="4"/>
    <path d="M 60,150 L 60,95 L 140,60 L 200,60 L 200,150 Z" fill="#b3e5fc" stroke="#0288d1" stroke-width="3"/>
    
    <!-- Body -->
    <rect x="220" y="40" width="420" height="240" rx="8" fill="url(#truckRed)" stroke="#9a0007" stroke-width="4"/>

    <!-- Shutters -->
    <rect x="240" y="65" width="110" height="150" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
    <line x1="240" y1="100" x2="350" y2="100" stroke="#b0bec5" stroke-width="3"/>
    <line x1="240" y1="140" x2="350" y2="140" stroke="#b0bec5" stroke-width="3"/>
    <line x1="240" y1="180" x2="350" y2="180" stroke="#b0bec5" stroke-width="3"/>

    <rect x="375" y="65" width="110" height="150" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
    <circle cx="430" cy="140" r="40" fill="#fff9c4" stroke="#fbc02d" stroke-width="4"/>
    <circle cx="430" cy="140" r="22" fill="#ef6c00"/>
    <circle cx="430" cy="140" r="8" fill="#424242"/>

    <rect x="510" y="65" width="110" height="150" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
    <line x1="510" y1="100" x2="620" y2="100" stroke="#b0bec5" stroke-width="3"/>
    <line x1="510" y1="140" x2="620" y2="140" stroke="#b0bec5" stroke-width="3"/>
    <line x1="510" y1="180" x2="620" y2="180" stroke="#b0bec5" stroke-width="3"/>

    <!-- Reflective stripe -->
    <rect x="40" y="225" width="600" height="24" fill="#ffee58"/>
    <rect x="40" y="233" width="600" height="8" fill="#ffffff"/>

    <!-- Wheels -->
    <g transform="translate(130, 280)">
      <circle cx="0" cy="0" r="48" fill="#212121"/>
      <circle cx="0" cy="0" r="26" fill="#9e9e9e" stroke="#616161" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#424242"/>
    </g>
    <g transform="translate(520, 280)">
      <circle cx="0" cy="0" r="48" fill="#212121"/>
      <circle cx="0" cy="0" r="26" fill="#9e9e9e" stroke="#616161" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#424242"/>
    </g>
  </g>

  <g transform="translate(100, 485)">
    <text x="50" y="0" font-family="'Comic Sans MS', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🪖 Helmets</text>
    <text x="250" y="0" font-family="'Comic Sans MS', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">💦 Water Hose</text>
    <text x="450" y="0" font-family="'Comic Sans MS', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🪜 Rescue Ladder</text>
  </g>
</svg>