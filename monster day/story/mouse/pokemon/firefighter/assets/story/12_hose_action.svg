<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="yardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="65%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#yardBg)"/>

  <rect x="180" y="20" width="440" height="60" rx="16" fill="#e53935" stroke="#b71c1c" stroke-width="3"/>
  <text x="400" y="60" font-family="'Comic Sans MS', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">🚨 FIREFIGHTER NEEDED! 💦</text>

  <g transform="translate(80, 200)">
    <g transform="translate(130, 20)">
      <circle cx="0" cy="0" r="30" fill="#ffcc80"/>
      <path d="M -38,-10 Q 0,-48 38,-10 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <rect x="-28" y="30" width="56" height="110" rx="10" fill="#1a237e"/>
      <rect x="-28" y="75" width="56" height="14" fill="#ffee58"/>
    </g>

    <g transform="translate(190, 80)">
      <circle cx="0" cy="0" r="26" fill="#8d6e63"/>
      <path d="M -32,-8 Q 0,-42 32,-8 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <rect x="-22" y="26" width="44" height="85" rx="8" fill="#d32f2f"/>
    </g>

    <!-- Hose -->
    <path d="M -40,160 Q 60,150 180,135 L 260,115" stroke="#ffb300" stroke-width="24" stroke-linecap="round" fill="none"/>
    <polygon points="255,100 310,85 310,135 255,120" fill="#fdd835" stroke="#f57f17" stroke-width="3"/>

    <!-- Water Stream -->
    <path d="M 310,110 Q 450,40 600,130" stroke="#00e5ff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 310,110 Q 450,40 600,130" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="610" cy="135" r="14" fill="#80d8ff"/>
    <circle cx="630" cy="120" r="10" fill="#00e5ff"/>
    <circle cx="590" cy="150" r="8" fill="#80d8ff"/>
  </g>

  <g transform="translate(620, 260)">
    <circle cx="50" cy="50" r="60" fill="#ff5722" opacity="0.2"/>
    <text x="50" y="65" font-size="50" text-anchor="middle">🔥</text>
  </g>

  <g transform="translate(100, 480)">
    <rect width="600" height="90" rx="16" fill="#ffffff" stroke="#0288d1" stroke-width="3"/>
    <text x="300" y="38" font-family="'Comic Sans MS', sans-serif" font-size="22" font-weight="bold" fill="#01579b" text-anchor="middle">"Can you use the hose?"</text>
    <text x="300" y="70" font-family="'Comic Sans MS', sans-serif" font-size="24" font-weight="bold" fill="#2e7d32" text-anchor="middle">"YES, I CAN!" 💦</text>
  </g>
</svg>