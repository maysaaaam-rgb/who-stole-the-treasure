<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="careerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="50%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#careerBg)"/>

  <g transform="translate(100, 20)" filter="url(#badgeShadow)">
    <rect width="600" height="95" rx="20" fill="#673ab7" stroke="#512da8" stroke-width="4"/>
    <text x="300" y="42" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="24" font-weight="900" fill="#ffd54f" text-anchor="middle">"YOU SHOULD BE WHATEVER YOU WANT TO BE."</text>
    <text x="300" y="78" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">"THE BEST THING YOU CAN BE IS YOURSELF." ❤️</text>
  </g>

  <!-- Career Bubbles Grid -->
  <g transform="translate(60, 135)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#ffebee" stroke="#f44336" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👩‍🚒</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Firefighter</text>
  </g>

  <g transform="translate(240, 135)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#e3f2fd" stroke="#2196f3" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👨‍⚕️</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">Doctor</text>
  </g>

  <g transform="translate(420, 135)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#e8f5e9" stroke="#4caf50" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👩‍🏫</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">Teacher</text>
  </g>

  <g transform="translate(600, 135)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#ede7f6" stroke="#9c27b0" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👨‍🚀</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#4a148c" text-anchor="middle">Astronaut</text>
  </g>

  <g transform="translate(60, 295)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#e0f7fa" stroke="#00bcd4" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👩‍🔬</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#006064" text-anchor="middle">Scientist</text>
  </g>

  <g transform="translate(240, 295)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#fff3e0" stroke="#ff9800" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">👨‍🍳</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">Chef</text>
  </g>

  <g transform="translate(420, 295)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#f1f8e9" stroke="#8bc34a" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">⚽</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#33691e" text-anchor="middle">Footballer</text>
  </g>

  <g transform="translate(600, 295)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="65" fill="#fce4ec" stroke="#e91e63" stroke-width="4"/>
    <text x="70" y="65" font-size="44" text-anchor="middle">🎨</text>
    <text x="70" y="105" font-family="'Comic Sans MS', sans-serif" font-size="14" font-weight="bold" fill="#880e4f" text-anchor="middle">Artist</text>
  </g>

  <g transform="translate(80, 460)" filter="url(#badgeShadow)">
    <rect width="640" height="110" rx="20" fill="#ffffff" stroke="#ffb300" stroke-width="4"/>
    <text x="320" y="42" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="26" font-weight="bold" fill="#e65100" text-anchor="middle">"What do YOU want to be?"</text>
    <text x="320" y="82" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="28" font-weight="900" fill="#1565c0" text-anchor="middle">"I want to be a __________!"</text>
  </g>
</svg>