<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#bf360c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgFire)"/>

  <!-- Left Card: STRONG -->
  <g transform="translate(60, 55)" filter="url(#heroShadow)">
    <rect width="320" height="465" rx="20" fill="#ffffff" stroke="#ff9800" stroke-width="5"/>
    <rect x="0" y="0" width="320" height="70" rx="20" fill="#ffe082"/>
    <text x="160" y="48" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#e65100" text-anchor="middle">💪 STRONG</text>
    
    <g transform="translate(160, 200)">
      <circle cx="0" cy="-40" r="35" fill="#ffcc80"/>
      <path d="M -40,-50 Q 0,-90 40,-50 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <path d="M -12,-30 Q 0,-18 12,-30" stroke="#333" stroke-width="3" fill="none"/>
      <rect x="-35" y="-5" width="70" height="90" rx="10" fill="#1a237e"/>
      <rect x="-35" y="40" width="70" height="15" fill="#ffee58"/>
      <path d="M 35,10 Q 80,0 85,-40 Q 60,-50 45,-10" stroke="#1a237e" stroke-width="22" stroke-linecap="round" fill="none"/>
      <text x="90" y="-30" font-size="30">💥</text>
    </g>

    <text x="160" y="380" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Carry heavy hoses!</text>
    <text x="160" y="415" font-family="'Comic Sans MS', sans-serif" font-size="18" font-weight="bold" fill="#e65100" text-anchor="middle">"Make a strong pose!"</text>
  </g>

  <!-- Right Card: BRAVE -->
  <g transform="translate(420, 55)" filter="url(#heroShadow)">
    <rect width="320" height="465" rx="20" fill="#ffffff" stroke="#e53935" stroke-width="5"/>
    <rect x="0" y="0" width="320" height="70" rx="20" fill="#ffcdd2"/>
    <text x="160" y="48" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#b71c1c" text-anchor="middle">🦸 BRAVE</text>

    <g transform="translate(160, 200)">
      <circle cx="0" cy="-40" r="35" fill="#ffcc80"/>
      <path d="M -40,-50 Q 0,-90 40,-50 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <circle cx="-12" cy="-42" r="3" fill="#333"/>
      <circle cx="12" cy="-42" r="3" fill="#333"/>
      <path d="M -12,-28 Q 0,-20 12,-28" stroke="#333" stroke-width="3" fill="none"/>
      <rect x="-35" y="-5" width="70" height="90" rx="10" fill="#1a237e"/>
      <polygon points="0,15 15,35 -15,35" fill="#ffd54f"/>
      <path d="M -35,10 L -65,35 L -35,50" stroke="#1a237e" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M 35,10 L 65,35 L 35,50" stroke="#1a237e" stroke-width="18" stroke-linecap="round" fill="none"/>
      <text x="-25" y="-75" font-size="36">⭐</text>
    </g>

    <text x="160" y="380" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Help in emergencies!</text>
    <text x="160" y="415" font-family="'Comic Sans MS', sans-serif" font-size="18" font-weight="bold" fill="#b71c1c" text-anchor="middle">"Make a superhero pose!"</text>
  </g>

  <text x="400" y="565" font-family="'Comic Sans MS', sans-serif" font-size="22" font-weight="bold" fill="#bf360c" text-anchor="middle">"Does a firefighter need to be strong? YES! Brave? YES!"</text>
</svg>