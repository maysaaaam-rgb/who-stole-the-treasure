<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#fff8e1"/>

  <rect x="180" y="20" width="440" height="60" rx="16" fill="#f57f17" stroke="#e65100" stroke-width="3"/>
  <text x="400" y="60" font-family="'Comic Sans MS', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">FIREFIGHTER EQUIPMENT 🪖</text>

  <!-- 1. Helmet -->
  <g transform="translate(60, 105)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#fbc02d" stroke-width="3"/>
    <path d="M 40,90 Q 100,25 160,90 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="4"/>
    <ellipse cx="100" cy="90" rx="65" ry="16" fill="#fdd835"/>
    <polygon points="95,65 105,65 100,50" fill="#d32f2f"/>
    <path d="M 50,95 Q 100,115 150,95" stroke="#81d4fa" stroke-width="6" fill="none"/>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">HELMET</text>
  </g>

  <!-- 2. Uniform -->
  <g transform="translate(300, 105)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="3"/>
    <path d="M 40,40 L 160,40 L 145,120 L 55,120 Z" fill="#1a237e" stroke="#0d47a1" stroke-width="3"/>
    <rect x="50" y="80" width="100" height="14" fill="#ffee58"/>
    <rect x="50" y="84" width="100" height="4" fill="#ffffff"/>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">UNIFORM</text>
  </g>

  <!-- 3. Hose -->
  <g transform="translate(540, 105)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#ff9800" stroke-width="3"/>
    <circle cx="100" cy="75" r="45" fill="none" stroke="#ffb300" stroke-width="12"/>
    <circle cx="100" cy="75" r="28" fill="none" stroke="#ffa000" stroke-width="10"/>
    <polygon points="120,40 150,30 150,55 120,45" fill="#f57f17"/>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">HOSE</text>
  </g>

  <!-- 4. Heavy Boots -->
  <g transform="translate(60, 320)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#424242" stroke-width="3"/>
    <rect x="55" y="45" width="35" height="60" rx="6" fill="#212121"/>
    <ellipse cx="65" cy="105" rx="25" ry="12" fill="#000000"/>
    <rect x="110" y="45" width="35" height="60" rx="6" fill="#212121"/>
    <ellipse cx="120" cy="105" rx="25" ry="12" fill="#000000"/>
    <rect x="55" y="65" width="35" height="8" fill="#ffee58"/>
    <rect x="110" y="65" width="35" height="8" fill="#ffee58"/>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">BOOTS</text>
  </g>

  <!-- 5. Ladder -->
  <g transform="translate(300, 320)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#78909c" stroke-width="3"/>
    <line x1="75" y1="35" x2="75" y2="125" stroke="#90a4ae" stroke-width="8"/>
    <line x1="125" y1="35" x2="125" y2="125" stroke="#90a4ae" stroke-width="8"/>
    <line x1="75" y1="50" x2="125" y2="50" stroke="#607d8b" stroke-width="4"/>
    <line x1="75" y1="75" x2="125" y2="75" stroke="#607d8b" stroke-width="4"/>
    <line x1="75" y1="100" x2="125" y2="100" stroke="#607d8b" stroke-width="4"/>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">LADDER</text>
  </g>

  <!-- 6. Fire Engine -->
  <g transform="translate(540, 320)" filter="url(#gearShadow)">
    <rect width="200" height="190" rx="16" fill="#ffffff" stroke="#d32f2f" stroke-width="3"/>
    <g transform="translate(30, 45)">
      <rect x="0" y="15" width="135" height="60" rx="6" fill="#d32f2f"/>
      <rect x="10" y="22" width="40" height="25" rx="4" fill="#b3e5fc"/>
      <circle cx="35" cy="75" r="16" fill="#212121"/>
      <circle cx="105" cy="75" r="16" fill="#212121"/>
      <circle cx="70" cy="10" r="7" fill="#29b6f6"/>
    </g>
    <text x="100" y="165" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">FIRE ENGINE</text>
  </g>

  <text x="400" y="555" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#e65100" text-anchor="middle">Teacher asks: "Find something firefighters wear!" 👉 HELMET / UNIFORM</text>
</svg>