<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="teamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#teamBg)"/>

  <rect x="150" y="30" width="500" height="75" rx="20" fill="#0288d1" stroke="#01579b" stroke-width="4"/>
  <text x="400" y="78" font-family="'Comic Sans MS', 'Fredoka', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">TEAMWORK 🤝</text>

  <g transform="translate(180, 200)">
    <g transform="translate(120, 40)">
      <circle cx="0" cy="0" r="32" fill="#ffcc80"/>
      <path d="M -38,-10 Q 0,-50 38,-10 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <rect x="-30" y="32" width="60" height="90" rx="10" fill="#1a237e"/>
      <rect x="-30" y="75" width="60" height="15" fill="#ffee58"/>
      <rect x="-25" y="122" width="20" height="50" fill="#212121"/>
      <rect x="5" y="122" width="20" height="50" fill="#212121"/>
    </g>

    <g transform="translate(260, 40)">
      <circle cx="0" cy="0" r="32" fill="#a1887f"/>
      <path d="M -38,-10 Q 0,-50 38,-10 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
      <rect x="-30" y="32" width="60" height="90" rx="10" fill="#1a237e"/>
      <rect x="-30" y="75" width="60" height="15" fill="#ffee58"/>
      <rect x="-25" y="122" width="20" height="50" fill="#212121"/>
      <rect x="5" y="122" width="20" height="50" fill="#212121"/>
    </g>

    <!-- Water Hose -->
    <path d="M -100,120 Q 50,110 200,105 Q 350,100 450,90" stroke="#fbc02d" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M -100,120 Q 50,110 200,105 Q 350,100 450,90" stroke="#f57f17" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Firefighters' hands -->
    <circle cx="95" cy="110" r="14" fill="#ffcc80" stroke="#333" stroke-width="2"/>
    <circle cx="145" cy="108" r="14" fill="#ffcc80" stroke="#333" stroke-width="2"/>
    <circle cx="235" cy="105" r="14" fill="#a1887f" stroke="#333" stroke-width="2"/>
    <circle cx="285" cy="102" r="14" fill="#a1887f" stroke="#333" stroke-width="2"/>

    <!-- Water Jet -->
    <polygon points="440,75 480,60 480,120 440,105" fill="#cfd8dc" stroke="#90a4ae" stroke-width="3"/>
    <path d="M 480,90 Q 550,80 620,50" stroke="#00e5ff" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(100, 460)">
    <rect width="600" height="100" rx="16" fill="#ffffff" stroke="#0288d1" stroke-width="3"/>
    <text x="300" y="42" font-family="'Comic Sans MS', sans-serif" font-size="24" font-weight="bold" fill="#01579b" text-anchor="middle">"Firefighters work as a team." 🤝</text>
    <text x="300" y="76" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#e65100" text-anchor="middle">They help each other to put out the fire!</text>
  </g>
</svg>