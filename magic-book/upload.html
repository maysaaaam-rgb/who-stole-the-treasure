<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload the Magic Book (teacher only)</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2a1a0e;font-family:system-ui,sans-serif;color:#fff3dc}
  .card{width:min(640px,92vw);background:#3d2716;border-radius:22px;padding:28px 32px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;color:#ffd77a} p{line-height:1.5}
  button{border:0;border-bottom:5px solid #b8781a;border-radius:16px;padding:14px 26px;font-size:20px;font-weight:700;background:#ffcf5a;color:#4a2a08;cursor:pointer}
  button:active{transform:translateY(4px);border-bottom-width:1px}
  button:disabled{opacity:.5;cursor:default}
  .bar{height:16px;border-radius:10px;background:#5a3b22;overflow:hidden;margin:18px 0 8px}
  .bar i{display:block;height:100%;width:0;background:#3cc46a;transition:width .2s}
  #log{font-size:14px;max-height:160px;overflow:auto;color:#e9cfa5;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>📚 Upload the Magic Book</h1>
  <p>This copies the Unit 5 book (real pages, pictures, videos, sounds and answers) from this PC into your <b>private</b> cloud folder.
     Only you, signed in as the teacher, can open it. Pages are made smaller (WebP) on the way. Run it again any time the book changes.</p>
  <button id="go">⬆️ Upload now</button>
  <div class="bar"><i id="bar"></i></div>
  <div id="status">Ready.</div>
  <div id="log"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js?v=2.3"></script>
<script src="../js/supabase-client.js?v=3.3"></script>
<script src="../js/teacher-auth.js?v=1" data-guard="1"></script>
<script>
(function () {
  'use strict';
  var SRC = new URL('../unit5-work/magic-book/', location.href).href;
  var VBASE = 'https://book.local/unit5-work/magic-book/';
  var $ = function (id) { return document.getElementById(id); };
  function log(m) { $('log').textContent += m + '\n'; $('log').scrollTop = 1e9; }
  function keyOf(p) { return new URL(p, VBASE).pathname.replace(/^\/unit5-work\//, ''); }
  function srcOf(p) { return new URL(p, SRC).href; }

  function loadData() {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = SRC + 'js/book-data.js?t=' + Date.now();
      s.onload = function () { window.MAGIC_BOOK_DATA ? res(window.MAGIC_BOOK_DATA) : rej(new Error('no data')); };
      s.onerror = function () { rej(new Error('Cannot find unit5-work/magic-book/js/book-data.js')); };
      document.head.appendChild(s);
    });
  }
  function collect(d) {
    var set = {};
    ['g3_cover.png', 'g4_cover.png'].forEach(function (p) { set[p] = 1; });
    Object.keys(d).forEach(function (g) {
      var b = d[g]; ['hookVideo', 'r1Video', 'r2Video'].forEach(function (k) { if (b[k]) set[b[k]] = 1; });
      Object.keys(b.pages || {}).forEach(function (n) {
        var p = b.pages[n];
        ['img', 'popScene', 'video', 'sound'].forEach(function (k) { if (p[k]) set[p[k]] = 1; });
        (p.popWords || []).forEach(function (w) { if (w.img) set[w.img] = 1; });
      });
    });
    return Object.keys(set);
  }
  function toWebp(blob) {
    return new Promise(function (res) {
      var img = new Image(), u = URL.createObjectURL(blob);
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(function (b) { URL.revokeObjectURL(u); res(b && b.size < blob.size ? b : blob); }, 'image/webp', 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(u); res(blob); };
      img.src = u;
    });
  }

  $('go').onclick = async function () {
    $('go').disabled = true; $('log').textContent = '';
    try {
      if (window.TeacherAuth) await TeacherAuth.ready;
      var A = window.AdventureSupabase, c = A && (A.client || (A._ensureClient && A._ensureClient()));
      if (!c) throw new Error('The cloud is not connected on this PC.');
      var ses = await c.auth.getSession();
      if (!ses.data.session) throw new Error('Please sign in as the teacher first.');
      var st = c.storage.from('magic-book');
      var data = await loadData();
      var files = collect(data), keys = [], done = 0, skipped = [];
      $('status').textContent = 'Uploading ' + files.length + ' files…';
      for (var i = 0; i < files.length; i++) {
        var p = files[i], key = keyOf(p);
        try {
          var r = await fetch(srcOf(p));
          if (!r.ok) { skipped.push(key); log('– missing: ' + key); continue; }
          var blob = await r.blob(), type = blob.type || 'application/octet-stream';
          if (/^image\/(png|jpe?g)$/.test(type)) { blob = await toWebp(blob); type = blob.type; }
          var up = await st.upload(key, blob, { upsert: true, contentType: type, cacheControl: '86400' });
          if (up.error) throw up.error;
          keys.push(key); log('✓ ' + key + '  (' + Math.round(blob.size / 1024) + ' KB)');
        } catch (e) { skipped.push(key); log('✗ ' + key + ': ' + (e.message || e)); }
        done++; $('bar').style.width = Math.round(done / files.length * 100) + '%';
      }
      var dj = new Blob([JSON.stringify(data)], { type: 'application/json' });
      var u1 = await st.upload('data.json', dj, { upsert: true, contentType: 'application/json', cacheControl: '60' });
      if (u1.error) throw u1.error;
      keys.push('data.json');
      var mj = new Blob([JSON.stringify(keys)], { type: 'application/json' });
      var u2 = await st.upload('manifest.json', mj, { upsert: true, contentType: 'application/json', cacheControl: '60' });
      if (u2.error) throw u2.error;
      $('status').innerHTML = '✅ Done: ' + (keys.length - 1) + ' files uploaded' + (skipped.length ? ', ' + skipped.length + ' missing or failed (see list)' : '') +
        '. <a style="color:#ffd77a" href="https://maysaaaam-rgb.github.io/who-stole-the-treasure/magic-book/">Open the live book</a>';
    } catch (e) {
      $('status').textContent = '❌ ' + (e.message || e);
    } finally { $('go').disabled = false; }
  };
})();
</script>
</body>
</html>
