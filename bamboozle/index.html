<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Academy: Bamboozle Meme Arena</title>
  <style>
    :root {
      --bg-space: #070b14;
      --card-bg: linear-gradient(145deg, #1e293b, #0f172a);
      --border-color: #334155;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --green: #10b981;
      --purple: #a855f7;
      --text: #f8fafc;
      --t1: #0284c7;
      --t2: #e11d48;
      --t3: #059669;
      --t4: #7c3aed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-space);
      background-image: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #070b14 85%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Teacher Bar */
    .arena-nav {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      z-index: 50;
    }
    .brand-group {
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .btn-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { background: #334155; color: #fff; border-color: var(--cyan); }
    .nav-btn.active { background: var(--cyan); color: #022c22; border-color: var(--cyan); }

    /* Topic Bar */
    .topics-strip {
      background: #0b1120;
      border-bottom: 1px solid var(--border-color);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      overflow-x: auto;
    }
    .topic-tag {
      font-size: 0.8rem;
      font-weight: 900;
      color: #64748b;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .topic-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 999px;
      padding: 0.35rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .topic-pill:hover { border-color: var(--cyan); color: #fff; }
    .topic-pill.active {
      background: linear-gradient(135deg, var(--amber), #d97706);
      color: #000;
      border-color: var(--amber);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: #080d1a;
      border-bottom: 1px solid var(--border-color);
    }
    .team-badge {
      background: #1e293b;
      border-radius: 14px;
      padding: 0.75rem 1rem;
      text-align: center;
      border: 3px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .team-badge.active-turn {
      border-color: var(--amber);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
      background: #243247;
    }
    .team-title { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; }
    .team-score { font-size: 2.3rem; font-weight: 900; margin: 0.2rem 0; }
    .nudge-controls { display: flex; justify-content: center; gap: 0.3rem; opacity: 0.6; }
    .team-badge:hover .nudge-controls { opacity: 1; }
    .nudge-btn {
      background: #334155; border: none; color: #cbd5e1; border-radius: 4px;
      padding: 2px 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer;
    }
    .nudge-btn:hover { background: var(--amber); color: #000; }

    /* 24 Mystery Cards (No Traps Visible on Card Back) */
    .cards-grid {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1.1rem;
    }
    @media (max-width: 1100px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 680px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }

    .mystery-card {
      aspect-ratio: 16/11;
      background: var(--card-bg);
      border: 3px solid #334155;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 8px 0 #020617, 0 12px 22px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
    }
    .mystery-card:hover {
      transform: translateY(-5px);
      border-color: var(--cyan);
      box-shadow: 0 12px 0 #020617, 0 18px 30px rgba(56, 189, 248, 0.25);
    }
    .mystery-card:active { transform: translateY(4px); box-shadow: 0 2px 0 #020617; }
    .mystery-card.opened {
      opacity: 0.12;
      pointer-events: none;
      filter: grayscale(1);
      box-shadow: none;
      border-color: #1e293b;
    }
    .card-face-number {
      font-size: 3.2rem;
      font-weight: 900;
      color: #93c5fd;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
    }

    /* Modal Display */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #1e293b;
      border: 5px solid var(--cyan);
      border-radius: 26px;
      max-width: 820px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      animation: popBounce 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popBounce { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-header {
      background: #0f172a;
      border-bottom: 2px solid var(--border-color);
      padding: 0.9rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 0.3rem 1rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .modal-score-pill { font-size: 1.5rem; font-weight: 900; color: var(--amber); }

    .modal-main {
      padding: 2.2rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    /* Meme / Visual Hero Image */
    .meme-hero-box {
      width: 180px;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border: 3px solid #334155;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      position: relative;
    }
    .meme-hero-box svg {
      width: 100%;
      height: 100%;
    }

    .modal-prompt-text {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.35;
      color: #f8fafc;
      max-width: 720px;
    }

    /* Timer Countdown Track */
    .timer-track {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border: 2px solid var(--border-color);
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--amber);
      transition: width 1s linear, background-color 0.3s;
    }

    /* Answer Drawer */
    .revealed-answer {
      background: rgba(16, 185, 129, 0.12);
      border: 2px dashed var(--green);
      border-radius: 14px;
      padding: 1.1rem 1.8rem;
      color: #6ee7b7;
      font-size: 1.55rem;
      font-weight: 800;
      width: 90%;
      display: none;
    }

    /* Footer Buttons */
    .modal-footer {
      background: #0f172a;
      border-top: 2px solid var(--border-color);
      padding: 1.2rem;
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .btn-judge {
      font-size: 1.25rem;
      font-weight: 900;
      padding: 0.85rem 2.4rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.1s;
    }
    .btn-judge:active { transform: scale(0.96); }
    .btn-reveal { background: var(--cyan); color: #022c22; }
    .btn-pass { background: var(--green); color: #022c22; }
    .btn-fail { background: var(--rose); color: #fff; }
    .btn-power-exec { background: var(--amber); color: #000; font-size: 1.45rem; padding: 1rem 3.2rem; }
  </style>
</head>
<body>

  <header class="arena-nav">

      <div class="modal-footer" id="modal-footer"></div>

  <script>
    /* Zero-Dependency Harmonic Synthesizer */
    class ArenaSound {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      }
      playChord(freqs, type="sine", dur=0.35, gain=0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        freqs.forEach(f => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f, now);
          g.gain.setValueAtTime(gain, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur);
        });
      }
      coin() { this.playChord([987.77, 1318.51], "sine", 0.3, 0.2); }
      whoosh() { this.playChord([220, 277.18, 329.63], "triangle", 0.45, 0.2); }
      softFail() { this.playChord([246.94, 220], "sine", 0.3, 0.2); }
      fanfare() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          setTimeout(() => this.playChord([f, f * 1.5], "triangle", 0.28, 0.15), i * 110);
        });
      }
      tick() { this.playChord([1200], "sine", 0.04, 0.05); }
      alarm() {
        for (let i = 0; i < 3; i++) setTimeout(() => this.playChord([880, 1760], "triangle", 0.18, 0.25), i * 200);
      }
    }

      { id: "nat3", pool: "nature", cat: "🌊 Ocean Habitats", pts: 25, meme: "derpFrog", q: "How do dolphins breathe in the ocean?", a: "Through a blowhole at the top of their head!" },
      { id: "nat4", pool: "nature", cat: "🌳 Rainforest Jungle", pts: 25, meme: "derpFrog", q: "Why do rainforest animals have loud voices and bright colors?", a: "To communicate through thick green trees!" },
      { id: "nat5", pool: "nature", cat: "🐾 Animal Needs", pts: 20, meme: "lion", q: "What do herbivores need to eat to survive?", a: "Plants, grass, and leaves!" },
      { id: "nat6", pool: "nature", cat: "🌱 Eco Protection", pts: 25, meme: "derpFrog", q: "What should we do with plastic bottles to protect animal habitats?", a: "Recycle them!" },

      // Sabotages & Tongue Twisters (Hidden Traps)
      { id: "sab1", pool: "sabotage", type: "power", action: "swap", cat: "💥 BAMBOOZLE SWAP", meme: "shockedCat", q: "<strong>BAMBOOZLE SWAP!</strong><br>Swap all your team's points with the leading team right now!" },
      { id: "sab2", pool: "sabotage", type: "power", action: "steal", pts: 25, cat: "🦹 PIRATE STEAL", meme: "gigachad", q: "<strong>PIRATE STEAL!</strong><br>Steal 25 points from any rival team!" },
      { id: "sab3", pool: "sabotage", type: "power", action: "double", cat: "🎰 LUCKY VAULT", meme: "gigachad", q: "<strong>DOUBLE VAULT!</strong><br>Double your current points! (Or +30 if currently 0)" },
      { id: "sab4", pool: "sabotage", type: "power", action: "bankrupt", cat: "💣 TOTAL RESET", meme: "thisIsFine", q: "<strong>THIS IS FINE!</strong><br>BOOM! Your points drop to 0! Better luck next turn!" },
      { id: "sab5", pool: "sabotage", cat: "👅 Speed Twister", pts: 30, meme: "derpFrog", q: "Say 2x fast without stopping:<br><strong>'The bottom of the butter bucket is the buttered bucket bottom.'</strong>", a: "Fluently repeated with zero mistakes!" },
      { id: "sab6", pool: "sabotage", cat: "👅 Speed Twister", pts: 30, meme: "rocket", q: "Say 3x fast under 10 seconds:<br><strong>'Red rocket, roll rocket, red rocket roll!'</strong>", a: "Flawless rapid pronunciation!" }
    ];

    /* Match State */
    let activeTopic = "all";
    let activeDeck = [];
    let teamCount = 2;
    let currentTurn = 0;
    let scores = [0, 0, 0, 0];
    let timerEnabled = true;
    let timerDuration = 15;
    let activeCard = null;
    let timerInterval = null;

    const teamNames = ["Red Rockets", "Blue Comets", "Green Rovers", "Purple Novas"];
    const teamColors = ["var(--t1)", "var(--t2)", "var(--t3)", "var(--t4)"];

    function setTopic(key) {
      activeTopic = key;
      document.querySelectorAll(".topic-pill").forEach(p => p.classList.remove("active"));
      document.getElementById(`pill-${key}`).classList.add("active");
      generateDeck();
    }

    function generateDeck() {
      let pool = [];
      if (activeTopic === "all") {
        pool = [...QUESTION_BANK];
      } else {
        // Keep subject questions + sabotage surprises mixed in
        pool = QUESTION_BANK.filter(q => q.pool === activeTopic || q.type === "power");
      }

      pool = pool.sort(() => Math.random() - 0.5);
      while (pool.length < 24) {
        pool = pool.concat(QUESTION_BANK.sort(() => Math.random() - 0.5));
      }
      activeDeck = pool.slice(0, 24);
      renderGrid();
    }

    function initScoreboard() {
      const strip = document.getElementById("scoreboard-strip");
      strip.innerHTML = "";
      for (let i = 0; i < teamCount; i++) {
        const badge = document.createElement("div");
        badge.className = `team-badge ${i === currentTurn ? 'active-turn' : ''}`;
        badge.id = `pill-team-${i}`;
        badge.innerHTML = `
          <div class="team-title" style="color:${teamColors[i]}">${teamNames[i]}</div>
          <div class="team-score" id="score-team-${i}">${scores[i]}</div>
          <div class="nudge-controls">
            <button class="nudge-btn" onclick="nudgeScore(${i}, -10)">-10</button>
            <button class="nudge-btn" onclick="nudgeScore(${i}, 10)">+10</button>
          </div>
        `;
        strip.appendChild(badge);
      }
    }

    /* Renders purely anonymous numbers (No hints about traps!) */
    function renderGrid() {
      const grid = document.getElementById("cards-grid");
      grid.innerHTML = "";
      activeDeck.forEach((card, idx) => {
        const box = document.createElement("div");
        box.className = "mystery-card";
        box.innerHTML = `<div class="card-face-number">${idx + 1}</div>`;
        box.onclick = () => openCard(card, box);
        grid.appendChild(box);
      });
    }

    function openCard(card, element) {
      activeCard = card;
      element.classList.add("opened");
      const modal = document.getElementById("active-modal");
      const answerBox = document.getElementById("modal-answer");
      const memeFrame = document.getElementById("modal-meme-frame");
      modal.style.display = "flex";
      answerBox.style.display = "none";
      clearInterval(timerInterval);

      document.getElementById("modal-tag").innerText = card.cat;
      document.getElementById("modal-score").innerText = card.pts ? `${card.pts} PTS` : "MYSTERY";
      document.getElementById("modal-prompt").innerHTML = card.q;
      document.getElementById("modal-answer").innerHTML = `💡 ${card.a}`;

      // Insert Visual Meme SVG
      memeFrame.innerHTML = MEMES[card.meme] || MEMES.derpFrog;

      const footer = document.getElementById("modal-footer");
      const timerTrack = document.getElementById("modal-timer-track");

      if (card.type === "power") {
        timerTrack.style.display = "none";
        audio.whoosh();
        footer.innerHTML = `<button class="btn-judge btn-power-exec" onclick="executePower()">💥 ACTIVATE</button>`;
      } else {
        audio.coin();
        if (timerEnabled) runCountdown(timerDuration);
        else timerTrack.style.display = "none";

        footer.innerHTML = `
          <button class="btn-judge btn-reveal" id="btn-reveal" onclick="showAnswer()">👀 Check Answer</button>
          <div id="grade-row" style="display:none; gap:1.2rem;">
            <button class="btn-judge btn-fail" onclick="judgeCard(false)">✖ Oops!</button>
            <button class="btn-judge btn-pass" onclick="judgeCard(true)">✔ Okay (+${card.pts})</button>
          </div>
        `;
      }
    }

    function runCountdown(seconds) {
      const track = document.getElementById("modal-timer-track");
      const fill = document.getElementById("modal-timer-fill");
      track.style.display = "block";
      fill.style.width = "100%";
      fill.style.backgroundColor = "var(--amber)";
      let left = seconds;

      timerInterval = setInterval(() => {
        left--;
        fill.style.width = `${(left / seconds) * 100}%`;
        audio.tick();
        if (left <= 4) fill.style.backgroundColor = "var(--rose)";
        if (left <= 0) {
          clearInterval(timerInterval);
          audio.alarm();
        }
      }, 1000);
    }

    function showAnswer() {
      clearInterval(timerInterval);
      document.getElementById("btn-reveal").style.display = "none";
      document.getElementById("grade-row").style.display = "flex";
      document.getElementById("modal-answer").style.display = "block";
    }

    function judgeCard(pass) {
      clearInterval(timerInterval);
      if (pass) {
        scores[currentTurn] += activeCard.pts;
        audio.fanfare();
      } else {
        audio.softFail();
      }
      closeModal();
    }

    function executePower() {
      const act = activeCard.action;
      const other = (currentTurn + 1) % teamCount;

      if (act === "swap") {
        const temp = scores[currentTurn];
        scores[currentTurn] = scores[other];
        scores[other] = temp;
      } else if (act === "steal") {
        const amt = Math.min(scores[other], activeCard.pts);
        scores[other] -= amt;
        scores[currentTurn] += amt;
      } else if (act === "double") {
        scores[currentTurn] = scores[currentTurn] === 0 ? 30 : scores[currentTurn] * 2;
      } else if (act === "bankrupt") {
        scores[currentTurn] = 0;
      }

      audio.whoosh();
      closeModal();
    }

    function closeModal() {
      document.getElementById("active-modal").style.display = "none";
      currentTurn = (currentTurn + 1) % teamCount;
      refreshScoreboardUI();
    }

    function refreshScoreboardUI() {
      for (let i = 0; i < teamCount; i++) {
        const scoreEl = document.getElementById(`score-team-${i}`);
        const pillEl = document.getElementById(`pill-team-${i}`);
        if (scoreEl) scoreEl.innerText = scores[i];
        if (pillEl) pillEl.classList.toggle("active-turn", i === currentTurn);
      }
    }

    function nudgeScore(teamIdx, amount) {
      scores[teamIdx] = Math.max(0, scores[teamIdx] + amount);
      refreshScoreboardUI();
      audio.tick();
    }

    function setTeams(n) {
      teamCount = n;
      currentTurn = 0;
      for (let i = 2; i <= 4; i++) {
        document.getElementById(`btn-t-${i}`).classList.toggle("active", i === n);
      }
      initScoreboard();
    }

    function toggleTimer() {
      timerEnabled = !timerEnabled;
      const btn = document.getElementById("btn-timer");
      btn.innerText = timerEnabled ? "15s ON" : "TIMER OFF";
      btn.classList.toggle("active", timerEnabled);
    }

    function toggleSound() {
      audio.enabled = !audio.enabled;
      const btn = document.getElementById("btn-sound");
      btn.innerText = audio.enabled ? "🔊 ON" : "🔇 OFF";
      btn.classList.toggle("active", audio.enabled);
    }

    function resetArena() {
      scores = [0, 0, 0, 0];
      currentTurn = 0;
      initScoreboard();
      generateDeck();
    }

    // Launch
    initScoreboard();
    generateDeck();
  </script>
</body>
</html>
