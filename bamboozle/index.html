<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bamboozle! Mystery Cards · Smartboard</title>
<style>
  :root { --ink:#26215c; --spring:cubic-bezier(.175,.885,.32,1.275); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { font-family:"Fredoka","Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif; color:var(--ink); user-select:none; overflow:hidden; background:linear-gradient(180deg,#a78bfa 0%,#7dd3fc 45%,#fde68a 100%); }
  .sky { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .sky i { position:absolute; width:5vh; height:5vh; opacity:.35; font-style:normal; font-size:5vh; animation:float linear infinite; }
  @keyframes float { from { transform:translateY(110vh) rotate(0); } to { transform:translateY(-15vh) rotate(360deg); } }
  .screen { display:none; height:100%; padding:1.4vh 1.6vw; position:relative; z-index:1; overflow-y:auto; overflow-x:hidden; }
  .screen.on { display:flex; }
  .btn { font:inherit; font-weight:700; font-size:clamp(16px,2.9vh,32px); color:#fff; border:4px solid rgba(38,33,92,.85); border-bottom-width:8px; border-radius:2.6vh; padding:.9vh 1.8vw; cursor:pointer; background:#22c55e; text-shadow:0 2px 0 rgba(0,0,0,.2); transition:transform .12s var(--spring),border-bottom-width .12s; }
  .btn:active { transform:translateY(5px); border-bottom-width:3px; }
  .btn.blue { background:#3b82f6; } .btn.orange { background:#fb923c; } .btn.pink { background:#ec4899; } .btn.purple { background:#8b5cf6; } .btn.gold { background:#f59e0b; } .btn.grey { background:#64748b; }
  .btn[hidden] { display:none; } .btn:disabled { opacity:.4; cursor:not-allowed; }
  .card { background:#fff; border:5px solid var(--ink); border-radius:3.4vh; box-shadow:0 .9vh 0 rgba(38,33,92,.3); }
  .chip { font:inherit; font-weight:700; font-size:clamp(14px,2.6vh,30px); color:var(--ink); background:#f1f5f9; border:4px solid #cbd5e1; border-bottom-width:7px; border-radius:2.6vh; padding:.8vh 1.4vw; cursor:pointer; transition:transform .12s var(--spring); }
  .chip:active { transform:translateY(4px); } .chip.sel { background:#fde047; border-color:var(--ink); }
  .row { display:flex; gap:.9vw; justify-content:center; flex-wrap:wrap; align-items:center; }
  .lab { font-size:clamp(15px,2.6vh,28px); font-weight:700; width:5.2em; text-align:right; }
  /* setup */
  #setup { align-items:center; justify-content:center; text-align:center; flex-direction:column; }
  .setupbox { padding:2.4vh 2.6vw; width:min(1150px,96vw); max-height:98vh; display:flex; flex-direction:column; gap:1.8vh; overflow-y:auto; }
  .title { font-size:clamp(30px,8vh,92px); font-weight:800; line-height:1.05; }
  .title span:nth-child(1){color:#ef4444} .title span:nth-child(2){color:#f97316} .title span:nth-child(3){color:#eab308} .title span:nth-child(4){color:#22c55e} .title span:nth-child(5){color:#06b6d4} .title span:nth-child(6){color:#3b82f6} .title span:nth-child(7){color:#8b5cf6} .title span:nth-child(8){color:#ec4899} .title span:nth-child(9){color:#ef4444} .title span:nth-child(10){color:#f97316}
  .sub { font-size:clamp(14px,2.5vh,28px); color:#6d5fd1; font-weight:600; }
  .opts2 { display:flex; gap:1.4vw; justify-content:center; }
  .big { flex:1; max-width:32vw; font:inherit; color:var(--ink); background:#f8fafc; border:5px solid #cbd5e1; border-bottom-width:10px; border-radius:3vh; padding:1.2vh 1vw; cursor:pointer; transition:transform .15s var(--spring); }
  .big:active { transform:translateY(5px); } .big.sel { background:#fef9c3; border-color:var(--ink); transform:scale(1.03); }
  .big b { display:block; font-size:clamp(18px,3.6vh,42px); } .big span { font-size:clamp(12px,2.1vh,24px); color:#6b5fb5; font-weight:600; }
  /* game */
  #game { flex-direction:column; gap:1vh; }
  #score { display:flex; gap:.7vw; padding-right:12vw; }
  .team { flex:1; min-width:0; padding:.5vh .6vw; text-align:center; border-radius:2.2vh; border:4px solid var(--ink); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .25s var(--spring); }
  .team .nm { font-weight:800; font-size:clamp(11px,2vh,24px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .team .pt { font-weight:800; font-size:clamp(20px,4.2vh,48px); line-height:1; }
  .team.turn { transform:scale(1.08); box-shadow:0 0 0 .6vh #fde047, 0 0 3vh #fde047; }
  #banner { align-self:center; font-weight:800; font-size:clamp(16px,3.2vh,38px); background:#fde047; border:5px solid var(--ink); border-radius:99px; padding:.2vh 2.4vw; box-shadow:0 .6vh 0 rgba(38,33,92,.3); }
  #board { flex:1; min-height:0; display:grid; gap:1vh .9vw; }
  .tile { position:relative; font:inherit; font-weight:800; font-size:clamp(22px,6vh,80px); color:#fff; border:5px solid var(--ink); border-bottom-width:9px; border-radius:2.6vh; cursor:pointer; text-shadow:0 3px 0 rgba(0,0,0,.25); transition:transform .15s var(--spring),border-bottom-width .15s,opacity .3s; display:flex; align-items:center; justify-content:center; }
  .tile:active { transform:translateY(5px); border-bottom-width:3px; }
  .tile.used { opacity:.28; pointer-events:none; filter:grayscale(.7); }
  .tile.used span { font-size:.55em; }
  .tile:nth-child(6n+1){background:#ef4444} .tile:nth-child(6n+2){background:#f97316} .tile:nth-child(6n+3){background:#eab308} .tile:nth-child(6n+4){background:#22c55e} .tile:nth-child(6n+5){background:#3b82f6} .tile:nth-child(6n+6){background:#8b5cf6}
  #foot { display:flex; gap:.7vw; justify-content:center; flex-wrap:wrap; } #foot .btn { padding:.6vh 1.2vw; }
  /* overlay (question or special) */
  #ov { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(38,33,92,.6); padding:1.4vh 1.6vw; }
  #ov.on { display:flex; }
  #ovCard { width:min(1300px,98vw); max-height:98vh; padding:1.6vh 1.8vw; display:flex; flex-direction:column; gap:1.1vh; animation:flipin .5s var(--spring); overflow-y:auto; }
  @keyframes flipin { from { transform:rotateY(90deg) scale(.7); opacity:0; } }
  #oTop { display:flex; justify-content:space-between; align-items:center; gap:1vw; font-weight:700; font-size:clamp(13px,2.3vh,26px); }
  .pill { background:#ede9fe; border:4px solid var(--ink); border-radius:99px; padding:0 1.2vw; white-space:nowrap; }
  #oPic { font-size:clamp(46px,11vh,130px); line-height:1.05; text-align:center; }
  #oQ { font-size:clamp(24px,5.2vh,66px); font-weight:700; line-height:1.15; text-align:center; }
  #oPass { font-size:clamp(15px,2.7vh,32px); color:#6b5fb5; font-weight:600; line-height:1.25; text-align:center; }
  #oOpts { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(9vh,1fr); gap:1.1vh .9vw; }
  .opt { position:relative; font:inherit; font-weight:700; font-size:clamp(20px,4.4vh,54px); color:#fff; border:5px solid var(--ink); border-bottom-width:10px; border-radius:3.2vh; cursor:pointer; padding:.5vh .6vw .5vh 3.6vw; text-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .12s var(--spring),border-bottom-width .12s,filter .2s; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.05; animation:popin .4s var(--spring) backwards; }
  .opt.small { font-size:clamp(15px,3vh,36px); }
  .opt:nth-child(2){animation-delay:.07s} .opt:nth-child(3){animation-delay:.14s} .opt:nth-child(4){animation-delay:.21s}
  @keyframes popin { from { transform:scale(.6); opacity:0; } }
  .opt:nth-child(1){background:#ef4444} .opt:nth-child(2){background:#3b82f6} .opt:nth-child(3){background:#22c55e} .opt:nth-child(4){background:#f59e0b}
  .opt .let { position:absolute; left:.7vw; top:50%; transform:translateY(-50%); width:2.8vw; height:2.8vw; min-width:30px; min-height:30px; border-radius:50%; background:#fff; color:var(--ink); font-size:.6em; display:flex; align-items:center; justify-content:center; border:3px solid var(--ink); text-shadow:none; }
  .opt:active { transform:translateY(6px); border-bottom-width:3px; }
  .opt.ok { background:#16a34a !important; animation:pop .5s var(--spring); } @keyframes pop { 50% { transform:scale(1.06); } }
  .opt.no { filter:grayscale(.9) brightness(1.1); opacity:.5; animation:wob .4s; } @keyframes wob { 25% { transform:translateX(-6px) rotate(-2deg); } 75% { transform:translateX(6px) rotate(2deg); } }
  #oOrder { display:none; flex-direction:column; gap:1.4vh; }
  #tiles,#built { display:flex; flex-wrap:wrap; gap:1vh .8vw; justify-content:center; }
  .wt { font:inherit; font-weight:700; font-size:clamp(20px,4.2vh,50px); color:#fff; background:#8b5cf6; border:4px solid var(--ink); border-bottom-width:8px; border-radius:2.2vh; padding:.6vh 1.4vw; cursor:pointer; text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .wt:active { transform:translateY(5px); border-bottom-width:3px; } .wt.used { opacity:.2; pointer-events:none; }
  #built { min-height:9vh; padding:1vh .8vw; background:#f5f3ff; border:5px dashed #8b5cf6; border-radius:2.6vh; align-items:center; } #built .wt { background:#0ea5e9; }
  #oMsg { text-align:center; font-weight:800; font-size:clamp(18px,3.4vh,42px); min-height:4vh; }
  #oBtns { display:flex; gap:.7vw; justify-content:center; flex-wrap:wrap; } #oBtns .btn { padding:.6vh 1.2vw; }
  /* special card */
  #oSpecial { display:none; text-align:center; flex-direction:column; gap:1.2vh; align-items:center; }
  #spIcon { font-size:clamp(80px,22vh,260px); line-height:1; animation:dance .5s infinite alternate; } @keyframes dance { to { transform:rotate(10deg) translateY(-2vh); } }
  #spTitle { font-size:clamp(30px,8vh,96px); font-weight:800; } #spText { font-size:clamp(18px,3.6vh,44px); font-weight:600; color:#6b5fb5; }
  #spTeams { display:flex; gap:.8vw; flex-wrap:wrap; justify-content:center; } #spTeams .btn { font-size:clamp(18px,3.6vh,44px); }
  .conf { position:fixed; top:-6vh; z-index:50; pointer-events:none; animation:fall linear forwards; } @keyframes fall { to { transform:translateY(115vh) rotate(540deg); } }
  #tools { position:fixed; right:1vw; top:1vh; z-index:40; display:flex; gap:.5vw; } #tools .btn { padding:.4vh .8vw; font-size:clamp(16px,2.6vh,28px); border-bottom-width:5px; }
  /* end */
  #end { align-items:center; justify-content:center; text-align:center; flex-direction:column; gap:1.4vh; }
  .podium { display:flex; gap:1.2vw; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
  .podium .p { padding:1.2vh 1.6vw; border:5px solid var(--ink); border-radius:3.4vh; font-weight:800; min-width:11vw; box-shadow:0 .9vh 0 rgba(38,33,92,.3); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25); animation:popin .6s var(--spring) backwards; }
  .podium .p .em { font-size:2.1em; display:block; }
  .skills { width:min(900px,92vw); padding:1.6vh 1.8vw; display:flex; flex-direction:column; gap:.8vh; text-align:left; }
  .sk { display:flex; align-items:center; gap:1vw; font-size:clamp(15px,2.5vh,28px); font-weight:700; } .sk .lbl { width:8em; }
  .sk .bar { flex:1; height:2.6vh; background:#e2e8f0; border-radius:99px; overflow:hidden; border:3px solid var(--ink); } .sk .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#22c55e,#86efac); }
  /* meme-style reaction sticker */
  #meme { position:fixed; inset:0; z-index:45; display:none; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; text-align:center; }
  #meme.on { display:flex; animation:memepop 1.9s var(--spring) forwards; }
  @keyframes memepop { 0% { transform:scale(.2) rotate(-14deg); opacity:0; } 14% { transform:scale(1.08) rotate(5deg); opacity:1; } 24% { transform:scale(1) rotate(-3deg); } 80% { transform:scale(1) rotate(2deg); opacity:1; } 100% { transform:scale(.9) rotate(0); opacity:0; } }
  #memePic { width:clamp(150px,40vh,420px); height:clamp(150px,40vh,420px); display:flex; align-items:center; justify-content:center; position:relative; filter:drop-shadow(0 1.2vh 0 rgba(38,33,92,.35)); }
  #memePic img { width:100%; height:100%; object-fit:contain; }
  .stk { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#fff; border:.8vh solid var(--ink); border-radius:50%; box-shadow:inset 0 0 0 1.2vh #fde047; }
  .stk .an { font-size:clamp(90px,24vh,260px); line-height:1; }
  .stk .ex { position:absolute; right:2%; top:2%; font-size:clamp(50px,13vh,140px); transform:rotate(14deg); }
  .stk .sh { position:absolute; left:50%; top:34%; transform:translateX(-50%); font-size:clamp(60px,15vh,170px); }
  #memeCap { font-family:Impact,"Arial Black","Arial Rounded MT Bold","Comic Sans MS",sans-serif; font-weight:900; font-size:clamp(34px,10vh,120px); letter-spacing:.04em; text-transform:uppercase; color:#fff; -webkit-text-stroke:1.1vh var(--ink); paint-order:stroke fill; text-shadow:0 .8vh 0 rgba(38,33,92,.35); margin-top:-1vh; }
  @media (max-aspect-ratio: 1/1) { #score { padding-right:0; } }
</style>
</head>
<body>
<div class="sky" id="sky"></div>

<div id="setup" class="screen on">
  <div class="setupbox card">
    <div class="title"><span>B</span><span>a</span><span>m</span><span>b</span><span>o</span><span>o</span><span>z</span><span>l</span><span>e</span><span>!</span></div>
    <div class="sub">Pick a mystery card. Answer to win stars. Beware of tricks!</div>
    <div class="opts2" id="gradeRow"><button class="big sel" data-g="3"><b>🔧 Grade 3</b><span>Inventors &amp; Harvest</span></button><button class="big" data-g="4"><b>🌲 Grade 4</b><span>Alice, Brain &amp; Forests</span></button></div>
    <div class="opts2" id="unitRow"></div>
    <div class="row"><span class="lab">Teams</span><button class="chip" data-t="2">2</button><button class="chip" data-t="3">3</button><button class="chip sel" data-t="4">4</button><button class="chip" data-t="5">5</button><button class="chip" data-t="6">6</button></div>
    <div class="row"><span class="lab">Cards</span><button class="chip" data-n="12">12</button><button class="chip sel" data-n="20">20</button><button class="chip" data-n="30">30</button><button class="chip" data-n="40">40 (marathon)</button></div>
    <div class="row"><span class="lab">Tricks</span><button class="chip sel" data-f="0">😈 Steal &amp; swap ON</button><button class="chip" data-f="1">😇 Friendly (no steal)</button></div>
    <div class="row"><button class="btn" id="go">▶ Let's play!</button></div>
  </div>
</div>

<div id="game" class="screen">
  <div id="score"></div>
  <div id="banner">Pick a card!</div>
  <div id="board"></div>
  <div id="foot"><button class="btn grey" id="finish">✕ Finish game</button></div>
</div>

<div id="ov"><div id="ovCard" class="card">
  <div id="oTop"><span class="pill" id="oTeam"></span><span class="pill" id="oSkill"></span><span class="pill" id="oVal"></span></div>
  <div id="oPic"></div><div id="oQ"></div><div id="oPass"></div>
  <div id="oOpts"></div>
  <div id="oOrder"><div id="built"></div><div id="tiles"></div></div>

</div></div>

<div id="end" class="screen">
  <div class="title" style="font-size:clamp(28px,6.8vh,80px)">🏆 Well done, everyone! 🏆</div>

</div>

<script src="data.js"></script>
<script>
var TEAMS = [{n:'Fox',k:'fox',e:'🦊',c:'#f97316'},{n:'Frog',k:'frog',e:'🐸',c:'#16a34a'},{n:'Panda',k:'panda',e:'🐼',c:'#64748b'},{n:'Lion',k:'lion',e:'🦁',c:'#ca8a04'},{n:'Octopus',k:'octopus',e:'🐙',c:'#db2777'},{n:'Unicorn',k:'unicorn',e:'🦄',c:'#7c3aed'}];
/* Reaction stickers: if memes/<animal>_<face>.webp exists it is used, otherwise a big emoji sticker is drawn. */
var MEME = {
  win:    {faces: ['celebrate', 'cool', 'laugh'],  caps: ['BOOM!', 'NICE ONE!', 'SO COOL!', 'YES YES YES!', 'SUPER STAR!', 'BRAIN POWER!']},
  phew:   {faces: ['laugh', 'cool'],               caps: ['PHEW! YES!', 'GOT IT!', 'SECOND TRY HERO!']},
  oops:   {faces: ['oops', 'thinking'],            caps: ['OOPS!', 'HMMM…', 'NOT YET!', 'ALMOST!']},
  miss:   {faces: ['oops', 'thinking'],            caps: ['GOOD TRY!', 'NEXT TIME!', 'LEARNING TIME!']},
  gift:   {faces: ['celebrate', 'laugh'],          caps: ['FREE GIFT!', 'LUCKY YOU!']},
  jackpot:{faces: ['celebrate', 'cool'],           caps: ['JACKPOT!', 'WOW! SO RICH!']},
  double: {faces: ['cool'],                        caps: ['POWER UP!', 'DOUBLE TIME!']},
  again:  {faces: ['laugh'],                       caps: ['ONE MORE GO!', 'AGAIN! AGAIN!']},
  steal:  {faces: ['sneaky'],                      caps: ['SNEAKY!', 'GIMME GIMME!']},
  swap:   {faces: ['shocked'],                     caps: ['WHOA!', 'SWITCHEROO!']},
  end:    {faces: ['celebrate'],                   caps: ['WE DID IT!', 'WELL DONE!']}
};
var FACE_EMOJI = {celebrate: '🎉', cool: '', laugh: '😂', oops: '🙈', thinking: '🤔', sneaky: '😏', shocked: '😱'};
var memeSeen = {}, memeTimer = null;
function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }
function memeFor(kind, teamIdx) {
  var m = MEME[kind]; if (!m) return; var t = TEAMS[teamIdx == null ? S.turn : teamIdx] || TEAMS[0], face = pickOne(m.faces), cap = pickOne(m.caps), src = 'memes/' + t.k + '_' + face + '.webp';
  var pic = document.getElementById('memePic'); document.getElementById('memeCap').textContent = cap;
  function emoji() { pic.innerHTML = '<div class="stk"><span class="an">' + t.e + '</span>' + (face === 'cool' ? '<span class="sh">😎</span>' : '<span class="ex">' + FACE_EMOJI[face] + '</span>') + '</div>'; }
  function show() { var el = document.getElementById('meme'); el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(memeTimer); memeTimer = setTimeout(function () { el.classList.remove('on'); }, 1900); }
  if (memeSeen[src] === 'ok') { pic.innerHTML = '<img src="' + src + '" alt="">'; show(); }
  else if (memeSeen[src] === 'no') { emoji(); show(); }
  else { var im = new Image(); im.onload = function () { memeSeen[src] = 'ok'; pic.innerHTML = '<img src="' + src + '" alt="">'; show(); }; im.onerror = function () { memeSeen[src] = 'no'; emoji(); show(); }; im.src = src; }
}
var SPECIALS = {
  gift:    {icon:'🎁', title:'Gift!', text:'Free +10 stars!', pts:10},
  jackpot: {icon:'🌈', title:'Jackpot!', text:'Wow! +20 stars!', pts:20},
  double:  {icon:'⚡', title:'Double power!', text:'Your next right answer is worth DOUBLE!'},
  again:   {icon:'🔁', title:'Extra turn!', text:'Pick another card!'},
  steal:   {icon:'🦹', title:'Steal!', text:'Take up to 10 stars from another team. Pick a team!'},
  swap:    {icon:'🔄', title:'Swap!', text:'Swap scores with another team. Pick a team!'}
};
var cfg = {g:'3', u:'1', t:4, n:20, friendly:false};
var S = {tiles:[], scores:[], dbl:[], turn:0, cur:null, tries:0, locked:false, built:[], missed:{}, asked:{}};
function $(id) { return document.getElementById(id); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function show(id) { ['setup','game','end'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }
(function sky() { var b = ['⭐','🎈','✨','🎲','💡','🌟'], h = ''; for (var i = 0; i < 9; i++) h += '<i style="left:' + (i * 11 + 2) + '%;animation-duration:' + (14 + (i * 3) % 11) + 's;animation-delay:-' + (i * 2) + 's">' + b[i % 6] + '</i>'; $('sky').innerHTML = h; })();
